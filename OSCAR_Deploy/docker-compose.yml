services:
  oscar:
    # Production: pull the pre-built image from GHCR (the :stable tag is
    # promoted by .github/workflows/promote-release.yml when a release-YYYY.MM
    # Git tag is pushed). For local dev / first-time setup before any image
    # has been published, comment out the `image:` line and uncomment the
    # `build:` block below.
    image: ghcr.io/top-phe/oscar-server:stable
    # build:
    #   context: ../Oscar_Server
    #   dockerfile: Dockerfile
    container_name: oscar
    env_file: .env
    environment:
      # Path to the Bruno CLI binary inside the runtime image.
      BRU_CMD: /usr/local/bin/bru
      # Path inside the container where the Bruno collection is mounted.
      COLLECTION_PATH: /collection
      # Path to the monorepo-level compatibility matrix mounted below.
      COMPATIBILITY_FILE: /app/compatibility.json
      # ── Run isolation (option 2b; OSCAR - Server Hardening, "Isolating the
      # runs") ─────────────────────────────────────────────────────────────
      # The runs' working folders, on a volume the runner container shares.
      RUN_WORKSPACES_DIR: /app/run-workspaces
      # local (default): Bruno runs inside this container, as before.
      # isolated: the oscar-runner container runs it (set RUN_ISOLATION,
      # RUN_AGENT_TOKEN and COMPOSE_PROFILES=isolated in .env).
      RUN_ISOLATION: ${RUN_ISOLATION:-local}
      RUN_AGENT_HOST: oscar-runner
      # Where Bruno, in the runner container, reaches this server.
      RUN_SERVER_URL: http://oscar:3001
      NODE_ENV: production
      # Process timezone — affects every Date object the Node process
      # constructs (log timestamps, audit log entries, "Sent at" in emails,
      # run start/finish times rendered for the dashboard). Storage stays
      # UTC ISO-8601 in the JSON layer (correct); only the wall-clock the
      # process sees changes. Default Europe/Paris because that's where
      # the canonical OSCAR deployment is hosted; override via OSCAR_TZ
      # in .env if you self-host elsewhere (e.g. OSCAR_TZ=America/New_York).
      TZ: ${OSCAR_TZ:-Europe/Paris}
    ports:
      # Bind to localhost only — front with nginx for HTTPS termination.
      - "127.0.0.1:3001:3001"
    volumes:
      # Persist SQLite DB, artifacts, and datafiles across container restarts.
      - ./data:/app/data
      # Bruno test collection — read-only bind-mount from the sibling folder
      # of the monorepo. Refreshed by refresh-collection.sh on collection-only
      # commits to main, no rebuild needed.
      - ../Bruno_Collection:/collection:ro
      # Monorepo compatibility matrix — read-only.
      - ../compatibility.json:/app/compatibility.json:ro
      # The runs' working folders, shared with oscar-runner.
      - run-workspaces:/app/run-workspaces
    restart: unless-stopped
    # ── Container hardening ─────────────────────────────────────────────────
    # The image already runs as the unprivileged `node` user (Dockerfile
    # `USER node`); these take away what such a process could still be given.
    # No capability (port 3001 needs none), no gaining privileges through a
    # setuid binary, and a cap on processes and threads: every run is a Bruno
    # CLI process (about a dozen threads each), MAX_CONCURRENT_RUNS of them at
    # most, so 2048 leaves room and still stops a runaway fork.
    # The root file system stays writable for now: Bruno and the server write
    # outside /app/data, and a read-only root needs each of those places
    # listed first.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    # ── Health check (PR — v1.8.0) ──────────────────────────────────────────
    # Hits OSCAR's /health endpoint, which itself probes the SQLite DB, the
    # data dir, and the queue. Three consecutive failures (90 s total at the
    # 30 s interval) flip the container to "unhealthy", which the autoheal
    # sidecar picks up and restarts. start_period gives the app room to boot
    # — migrations on a large DB can take 5–10 s.
    healthcheck:
      # Use node's built-in fetch (Node 22) — wget/curl are not in the slim image.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # Tells Watchtower (below) to monitor THIS container for new versions
      # of the :stable tag. Containers without this label are ignored.
      com.centurylinklabs.watchtower.enable: "true"
      # Opts this container in to the autoheal sidecar — see service below.
      autoheal: "true"

  # ── Runner agent — the runs' processes, isolated (option 2b) ──────────────
  # Started only with COMPOSE_PROFILES=isolated. The same image, another
  # command: it runs Bruno for the server and holds NONE of the server's
  # data or secrets — no env_file, no ./data, no collection mount (the server
  # copies what a run needs into its working folder). It refuses to start if
  # it can see a server secret or the database. The server reaches it at
  # oscar-runner:3002 with RUN_AGENT_TOKEN; Bruno reaches the server at
  # http://oscar:3001, and the server takes the run's calls from this
  # container's address only (utils/runAgentPeer.js), with the run's secret.
  oscar-runner:
    image: ghcr.io/top-phe/oscar-server:stable
    container_name: oscar-runner
    profiles: ["isolated"]
    command: ["node", "src/runner-agent/agent.js"]
    environment:
      RUN_AGENT_TOKEN: ${RUN_AGENT_TOKEN:-}
      RUN_AGENT_HOST: 0.0.0.0
      RUN_WORKSPACES_DIR: /app/run-workspaces
      BRU_CMD: /usr/local/bin/bru
      NODE_ENV: production
      TZ: ${OSCAR_TZ:-Europe/Paris}
    volumes:
      - run-workspaces:/app/run-workspaces
    depends_on:
      - oscar
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The runs' Bruno processes live here now.
    pids_limit: 2048
    # A ceiling on the runs' memory, so a run that runs away cannot starve the
    # server and the monitoring beside it. One run takes about 80 MB on the
    # VPS (20 at once: 1.6 GB); the default leaves room for twice the server's
    # run limit. Set RUNNER_MEMORY_LIMIT in .env to change it (e.g. 4g).
    mem_limit: ${RUNNER_MEMORY_LIMIT:-6g}
    memswap_limit: ${RUNNER_MEMORY_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      autoheal: "true"

  # ── Autoheal — restart sidecar (PR — v1.8.0) ──────────────────────────────
  # Watches the Docker socket every AUTOHEAL_INTERVAL seconds; any container
  # carrying the `autoheal=true` label that Docker reports as `unhealthy`
  # gets restarted. Tiny image (~5 MB), no per-container config beyond the
  # label + healthcheck above. Combined with Alertmanager (metrics overlay)
  # for the alert side, this gives self-healing + paging without a heavy
  # external monitoring stack.
  autoheal:
    # Pinned by digest, like every image that is given the Docker socket:
    # a tag can be moved to other content, a digest cannot. Dependabot
    # (docker-compose ecosystem) proposes the next one.
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    container_name: oscar-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"          # poll every 30 s
      AUTOHEAL_START_PERIOD: "0"       # respect each container's own start_period
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "20"
      # Match the OSCAR app's TZ so "Container restarted at HH:MM" lines
      # the autoheal logs read in the same timezone as everything else.
      TZ: ${OSCAR_TZ:-Europe/Paris}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── Auto-update agent ──────────────────────────────────────────────────────
  # Watchtower polls GHCR every 5 minutes and pulls + recreates the oscar
  # container if a new digest is available for the :stable tag. Production
  # rollout therefore happens automatically when promote-release.yml pushes
  # a new :stable image — i.e. only when you push a release-YYYY.MM Git tag.
  watchtower:
    # Active community fork. The original containrrr/watchtower image
    # ships with an old Docker SDK that requests API v1.25 — Docker
    # Engine 25+ rejects that as below the minimum (1.40), causing the
    # container to spin in an error loop. nickfedor/watchtower is the
    # maintained drop-in replacement using the same env-var contract.
    # A version and its digest, never :latest: this container holds the
    # Docker socket, so whatever the tag points to runs as root on the host.
    image: nickfedor/watchtower:1.24.0@sha256:e96976bcbeaf0a9adeddc9016a539c27a2245ef6bb7d3ca97ed106783350d387
    container_name: watchtower
    restart: unless-stopped
    environment:
      # Pull credentials for the private GHCR repo. Set up on the host
      # via `docker login ghcr.io` before bringing the stack up — the
      # resulting ~/.docker/config.json is mounted in below.
      WATCHTOWER_LABEL_ENABLE: "true"      # only update labelled containers
      WATCHTOWER_CLEANUP: "true"           # remove old image after pull
      WATCHTOWER_POLL_INTERVAL: "300"      # 5 minutes
      WATCHTOWER_INCLUDE_RESTARTING: "false"
      WATCHTOWER_NOTIFICATIONS: ""         # add slack/email here later if wanted
      TZ: ${OSCAR_TZ:-Europe/Paris}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read GHCR creds set up on the host with `docker login ghcr.io`.
      - /home/ubuntu/.docker/config.json:/config.json:ro

volumes:
  # The runs' working folders: the oscar and oscar-runner containers share
  # them, and nothing else.
  run-workspaces:

# ── Notes ─────────────────────────────────────────────────────────────────────
# - Production rollout = a release-YYYY.NNN tag. The promote-release CI
#   workflow (GitHub environment "production") rebuilds the image, pushes it
#   as :stable and moves the host checkout to that tag. Watchtower picks the
#   image up within ~5 min.
# - The collection is the host checkout at the latest release tag, never
#   main's head (refresh-collection.sh): a merge alone deploys nothing.
# - To roll back: on the VPS, edit the `image:` line above to a specific
#   tag (e.g. ghcr.io/top-phe/oscar-server:server-v1.2.0) and `docker compose
#   up -d`. To re-enable auto-update later, restore :stable.
