# loki-config.yaml as a ConfigMap, for Loki on a cluster
# (OSCAR_Deploy/kubernetes/monitoring/stack/loki.yaml). The VPS's Loki reads
# the file itself (docker-compose.metrics.yml): one configuration for both.
# No hash in the name: it is used from another kustomization. After a change,
# `kubectl -n monitoring rollout restart statefulset/loki`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: oscar-monitoring

configMapGenerator:
  - name: loki-config
    files:
      - loki-config.yaml
