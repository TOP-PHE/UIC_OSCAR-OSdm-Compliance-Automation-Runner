# The dashboards of this folder for Grafana on a cluster
# (OSCAR_Deploy/kubernetes/monitoring/oscar): one ConfigMap each, which the
# chart's Grafana loads by their label. The VPS's Grafana reads the files
# themselves (docker-compose.metrics.yml): one set of dashboards for both.
# No hash in the names: a changed dashboard replaces its ConfigMap instead of
# adding a second one, which Grafana would load too.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: oscar-monitoring

configMapGenerator:
  - name: oscar-dashboard-overview
    files:
      - dashboards/oscar-overview.json
  - name: oscar-dashboard-logs
    files:
      - dashboards/oscar-logs.json
  - name: oscar-dashboard-simulator
    files:
      - dashboards/osdm-simulator.json
