# Auto-provisions the Prometheus datasource in Grafana on startup. Without
# this, an operator would have to click through the Grafana UI to configure
# it once. With this, the datasource is preconfigured the moment the
# container boots — clean across container recreations.

apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit UID so dashboard JSON files can reference it by a stable
    # string. Without this, Grafana auto-generates a UID like "aabXz123"
    # and dashboards that hardcode `"uid": "prometheus"` show "No data".
    # PR #45 bake-in — was discovered after v1.5.0 shipped.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
