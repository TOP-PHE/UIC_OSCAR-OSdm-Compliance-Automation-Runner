# Scrape config for OSCAR. Scrapes the OSCAR container via the docker-compose
# internal hostname (resolves to whatever IP the bridge network gives `oscar`).
# nginx blocks /metrics for external requests, so this is the only path that
# can reach it.

global:
  scrape_interval:     15s     # default poll cadence
  scrape_timeout:      10s
  evaluation_interval: 15s

# ── Alerting (PR — v1.8.0) ───────────────────────────────────────────────────
# Prometheus pushes firing alerts to Alertmanager, which routes them to email
# (or any other channel configured in alertmanager/alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Alert rules — see alerts/oscar-alerts.yml for the full ruleset
# (oscar down, restart loop, queue stuck, high failure rate, host resources).
rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: oscar-server
    metrics_path: /metrics
    static_configs:
      - targets: ['oscar:3001']
        labels:
          service: oscar
          env: production

  # The OSDM simulator (#1005), read by OSCAR through the address and key of
  # Admin → OSDM Simulator and relayed here: Prometheus holds no key and the
  # simulator's host opens nothing. Without a simulator set up, only
  # oscar_simulator_configured 0 comes back. nginx's `location = /metrics`
  # 404 covers this path too (the query string does not change the match).
  - job_name: osdm-simulator
    metrics_path: /metrics
    params:
      source: ['simulator']
    scrape_interval: 30s
    static_configs:
      - targets: ['oscar:3001']
        labels:
          service: osdm-simulator

  # Prometheus's own self-metrics — useful for monitoring the monitor.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
