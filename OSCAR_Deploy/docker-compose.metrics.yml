# ─────────────────────────────────────────────────────────────────────────────
# OPT-IN metrics overlay: Prometheus + Grafana
# Default deployments don't need this. To turn metrics on:
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
# To turn off:
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml down prometheus grafana
#   docker compose -f docker-compose.yml up -d
#
# Adds ~300 MB RAM steady state + ~500 MB disk over 15 days at default
# scrape interval. Detail in Documentation/Server_Operations/metrics-and-monitoring.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── OSCAR overlay (v1.9.0) ─────────────────────────────────────────────────
  # When the metrics stack is up, OSCAR also gets:
  #   - the alertmanager-config volume (so the Server Config tab can write
  #     alertmanager.yml that the Alertmanager container will then read)
  #   - the env vars pointing at where to write + which Alertmanager instance
  #     to hot-reload via /-/reload
  # When the metrics overlay is NOT used, OSCAR runs without these — the
  # Alerting section of the Server Config tab still appears but the "Apply"
  # button shows "Alertmanager not reachable" (which is the truth).
  oscar:
    environment:
      ALERTMANAGER_CONFIG_PATH: /etc/oscar-managed/alertmanager.yml
      ALERTMANAGER_RELOAD_URL:  http://alertmanager:9093/-/reload
    volumes:
      - alertmanager-config:/etc/oscar-managed

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: oscar-prometheus
    restart: unless-stopped
    environment:
      # Wall-clock TZ for log lines. Storage of samples stays UTC (always
      # has, Prometheus rule). Default Europe/Paris; override via OSCAR_TZ.
      TZ: ${OSCAR_TZ:-Europe/Paris}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # Sub-path serving so nginx can proxy at https://oscar.uic.org/prometheus/
      # without breaking Prometheus's internal asset / API URLs.
      - '--web.external-url=https://oscar.uic.org/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to localhost only — exposed externally via nginx /prometheus/
      # block, gated by OSCAR SSO (admin). Inside the docker network, Grafana
      # still reaches Prometheus via http://prometheus:9090 (the bridge name).
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager

  # ── Alertmanager — alert routing + email delivery (PR — v1.8.0) ───────────
  # Receives firing alerts from Prometheus, dedupes / groups them, and sends
  # email to OSCAR administrators using the same SMTP relay configured in
  # the OSCAR Server Config tab (Brevo, etc.). Operator copies
  # alertmanager/alertmanager.yml.example → alertmanager.yml and fills in
  # SMTP credentials + admin email list before bringing the stack up.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: oscar-alertmanager
    restart: unless-stopped
    environment:
      TZ: ${OSCAR_TZ:-Europe/Paris}
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://oscar.uic.org/alertmanager/'
      - '--web.route-prefix=/'
    volumes:
      # Generated by OSCAR (since v1.9.0) — Server Config tab → Alerting → Apply.
      # Falls back to the host-edited alertmanager.yml if the volume is empty
      # (legacy v1.8.x deployments) — operator can either keep editing the file
      # by hand OR start managing it via the UI; see admin guide § 14.
      - alertmanager-config:/etc/alertmanager
      - alertmanager-data:/alertmanager
    ports:
      # Bound to localhost — Prometheus reaches it inside the bridge network
      # via http://alertmanager:9093. Optional nginx /alertmanager/ block can
      # expose the silences UI to admins (gated by SSO, same as /prometheus/).
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: oscar-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Public URL Grafana uses to build absolute links (login redirects, share
      # buttons, etc.). Hardcoded to the canonical hostname — the
      # %(protocol)s://%(domain)s/grafana/ template only works if both
      # GF_SERVER_DOMAIN is set AND Grafana correctly reads X-Forwarded-Proto.
      # Hardcoding eliminates a class of redirect-loop bugs (PR #45 — was
      # diagnosed live in production after v1.5.0 shipped).
      GF_SERVER_DOMAIN:               'oscar.uic.org'
      GF_SERVER_ROOT_URL:             'https://oscar.uic.org/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH:  'true'
      # ── SSO via OSCAR (PR #46) ───────────────────────────────────────────
      # nginx fronts /grafana/ with auth_request → OSCAR /v1/auth/sso-check.
      # On 200 nginx forwards X-WEBAUTH-USER (the user's OSCAR email) here.
      # Grafana auto-creates a matching user on first visit. Replaces the
      # earlier basic-auth + anonymous-viewer setup from v1.5.0.
      GF_AUTH_PROXY_ENABLED:                 'true'
      GF_AUTH_PROXY_HEADER_NAME:             'X-WEBAUTH-USER'
      GF_AUTH_PROXY_HEADER_PROPERTY:         'username'
      GF_AUTH_PROXY_AUTO_SIGN_UP:            'true'
      # Map the X-User-Email header back into the Grafana user record so
      # avatars / share emails / alert recipients resolve.
      GF_AUTH_PROXY_HEADERS:                 'Email:X-User-Email Role:X-User-Role'
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN:      'true'
      # Disable basic auth + anonymous + login form — only the proxy header gets in.
      GF_AUTH_ANONYMOUS_ENABLED:             'false'
      GF_AUTH_BASIC_ENABLED:                 'false'
      GF_AUTH_DISABLE_LOGIN_FORM:            'true'
      # New users created via auth.proxy default to Viewer. Promote individuals
      # to Editor / Admin in the Grafana UI as needed.
      GF_USERS_AUTO_ASSIGN_ORG:              'true'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE:         'Viewer'
      # Don't phone home or check for new versions
      GF_ANALYTICS_REPORTING_ENABLED:        'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES:        'false'
      # Wall-clock TZ for Grafana's internal logs. Dashboards render in the
      # viewer's browser timezone by default — admins can flip an individual
      # dashboard's "Timezone" picker to "browser" / "utc" / explicit zone.
      TZ: ${OSCAR_TZ:-Europe/Paris}
      # Default for newly-created dashboards. "browser" matches the user's
      # local clock; switch to an explicit IANA zone here if you want every
      # dashboard to render in the same TZ regardless of viewer.
      GF_DATE_FORMATS_DEFAULT_TIMEZONE:     'browser'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Bound to localhost — exposed externally via nginx /grafana/ block.
      - "127.0.0.1:3000:3000"

  # ── Loki — log aggregation backend (PR #52) ────────────────────────────────
  # Stores logs shipped by Promtail. Bound to localhost:3100 so Grafana can
  # use a stable datasource URL. NOT exposed externally — operators query
  # logs through the Grafana "OSCAR · Logs" dashboard provisioned alongside
  # the Overview dashboard.
  loki:
    image: grafana/loki:3.4.1
    container_name: oscar-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    environment:
      TZ: ${OSCAR_TZ:-Europe/Paris}
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  # ── Promtail — ships container stdout/stderr to Loki (PR #52) ──────────────
  # Discovers containers via Docker service-discovery (mounted socket),
  # tags each log line with container name + stream, and pushes to Loki.
  # No host-side file paths to maintain — picks up any new container that
  # docker compose adds to this project automatically.
  promtail:
    image: grafana/promtail:3.4.1
    container_name: oscar-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    environment:
      TZ: ${OSCAR_TZ:-Europe/Paris}
    depends_on:
      - loki
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read container log files (canonical paths).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Docker socket — for SD discovery + container metadata.
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail-data:/promtail

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
  alertmanager-data:
  # Shared between the OSCAR container (writes alertmanager.yml from Server
  # Config DB) and the alertmanager container (reads it). External=false +
  # default driver = local docker volume; survives container recreation.
  alertmanager-config:
