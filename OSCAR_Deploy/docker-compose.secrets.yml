# OSCAR — the server's secrets as files, not environment variables (#1430).
#
# Optional, added to docker-compose.yml. With it, ENCRYPTION_KEY and SMTP_PASS
# are read from files under OSCAR_Deploy/secrets/ (mounted read-only at
# /run/secrets/ in the container): they are no longer in the container's
# configuration, where `docker inspect` shows every environment variable.
# Their lines in .env are then left empty: setting both is refused at start.
#
# Use it for every docker compose command by adding this line to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.secrets.yml
# The files belong to the container's user (uid 1000) and to nobody else:
#   sudo install -d -m 700 -o 1000 -g 1000 secrets
#   sudo install -m 400 -o 1000 -g 1000 /dev/null secrets/encryption_key
# then write the value into it (see OSCAR - Server Admin Guide, 13.7).
#
# PLATFORM_BOOTSTRAP_TOKEN, METRICS_TOKEN and RUN_AGENT_TOKEN accept a
# NAME_FILE the same way: add their lines below when you use them.

services:
  oscar:
    environment:
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      SMTP_PASS_FILE: /run/secrets/smtp_pass
    secrets:
      - encryption_key
      - smtp_pass

secrets:
  encryption_key:
    file: ./secrets/encryption_key
  smtp_pass:
    file: ./secrets/smtp_pass
