# The server's internal port (INTERNAL_PORT): what a run pod calls, and
# nothing else (src/server.js, internalApp). Never exposed by an Ingress or a
# Route; the network policy lets run pods only reach it.
apiVersion: v1
kind: Service
metadata:
  name: oscar-internal
  labels:
    app.kubernetes.io/name: oscar
    app.kubernetes.io/component: server-internal
spec:
  type: ClusterIP
  # The run pods reach the server here even while its readiness probe fails.
  # The probe fails when the server is slow to answer /health, as under a
  # large batch, and a Service without this then refuses every connection:
  # the run pods lost their data file and their results. A slow server makes
  # them wait instead. One replica: there is no other pod to send them to.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: oscar
  ports:
    - name: internal
      port: 3003
      targetPort: internal
