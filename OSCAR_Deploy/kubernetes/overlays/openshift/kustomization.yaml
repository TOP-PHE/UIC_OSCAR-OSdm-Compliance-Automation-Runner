# OSCAR on OpenShift (#1059). It runs under the default restricted-v2 SCC:
# no SCC to grant, the cluster chooses the uid and the volume's group.
#   oc new-project oscar
#   oc create secret generic oscar-secrets --from-env-file=secrets.env
#   oc apply -k OSCAR_Deploy/kubernetes/overlays/openshift
# Before that, change below: the release to run (published on GHCR at each
# release, or the images you built with build-images.sh), and the
# host oscar.example.org here and in route.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - route.yaml

images:
  - name: oscar-bundle
    newName: ghcr.io/top-phe/oscar
    newTag: release-2026.529

configMapGenerator:
  - name: oscar-settings
    behavior: merge
    literals:
      - APP_URL=https://oscar.example.org
      - ALLOWED_REDIRECT_HOSTS=oscar.example.org
