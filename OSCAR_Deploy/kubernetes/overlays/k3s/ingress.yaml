# The way in: k3s's Traefik, on https only (k3s/traefik-config.yaml sends
# http there), with a Let's Encrypt certificate it obtains for the host
# below, and the body limit of the VPS's nginx (middleware.yaml, named
# <namespace>-<name>: OSCAR's namespace is oscar).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oscar
  labels:
    app.kubernetes.io/name: oscar
    app.kubernetes.io/component: server
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: oscar-oscar-limits@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: oscar.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oscar
                port:
                  name: http
