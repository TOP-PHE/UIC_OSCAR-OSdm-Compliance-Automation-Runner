# A request body of 50 MB at most, as the VPS's nginx allows
# (client_max_body_size 50M): a larger one gets 413 from Traefik before it
# reaches OSCAR.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oscar-limits
  labels:
    app.kubernetes.io/name: oscar
spec:
  buffering:
    maxRequestBodyBytes: 52428800
