# The server may take 3 GiB on this machine (#1254). SQLite reads the
# database through the kernel's page cache, which the kernel counts in the
# container's memory. With the base's 1 GiB, a database moved from the VPS
# (10 GB on the test machine) stayed mostly on disk: storing a run's results
# took 2.5 to 3 s at the start of a batch, 1.1 s with 3 GiB. The request and
# the CPU stay the base's. Node sizes its heap from this limit (about 1.5 GB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscar
spec:
  template:
    spec:
      containers:
        - name: oscar
          resources:
            limits:
              memory: 3Gi
