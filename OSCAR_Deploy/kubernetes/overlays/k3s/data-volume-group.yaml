# The image runs as uid 1000. Most storage classes give a new volume to root:
# fsGroup 1000 lets that uid write the database there. The uid and group are
# named too (#1438): the image's own, which a scanner cannot see from the
# manifest. (OpenShift chooses all three itself, which is why this is not in
# the base.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscar
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
