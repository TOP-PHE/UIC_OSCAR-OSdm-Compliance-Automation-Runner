# The run dispatcher under the image's own uid and group, named (#1438), as
# the server's pod is (data-volume-group.yaml). Not in the pod-runs component:
# OpenShift chooses them itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscar-dispatcher
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
