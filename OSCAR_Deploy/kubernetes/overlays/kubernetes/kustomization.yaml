# OSCAR on a Kubernetes cluster with ingress-nginx (#1059).
#   kubectl create namespace oscar
#   kubectl -n oscar create secret generic oscar-secrets --from-env-file=secrets.env
#   kubectl -n oscar apply -k OSCAR_Deploy/kubernetes/overlays/kubernetes
# Before that, change below: the image you built (build-images.sh), and the
# host oscar.example.org here, in ingress.yaml and in its TLS Secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

images:
  - name: oscar-bundle
    newName: registry.example.org/oscar/oscar
    newTag: release-2026.481

configMapGenerator:
  - name: oscar-settings
    behavior: merge
    literals:
      - APP_URL=https://oscar.example.org
      - ALLOWED_REDIRECT_HOSTS=oscar.example.org

patches:
  - path: data-volume-group.yaml
