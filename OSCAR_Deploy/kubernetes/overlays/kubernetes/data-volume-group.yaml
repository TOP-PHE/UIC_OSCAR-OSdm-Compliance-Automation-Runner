# The image runs as uid 1000. Most storage classes give a new volume to root:
# fsGroup 1000 lets that uid write the database there. (OpenShift chooses
# fsGroup itself, which is why this is not in the base.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscar
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
