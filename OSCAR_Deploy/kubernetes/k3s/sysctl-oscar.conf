# The kernel settings of a machine running OSCAR's runs on k3s, copied to
# /etc/sysctl.d/90-oscar-k3s.conf (guide: "OSCAR - k3s on one VPS", section 3)
# and read at every boot.
#
# inotify instances per user. Ubuntu's default is 128. Out of a campaign,
# k3s-server alone holds 23 and each containerd-shim 2 to 4; the kubelet takes
# one more for each pod log it follows, and the dispatcher follows every run
# pod's. During a campaign of 15 runs at once the limit was reached: two kept
# pods' logs were cut by "failed to create fsnotify watcher: too many open
# files" (#1336). 8192 is the usual value on Kubernetes nodes. The number of
# watches (fs.inotify.max_user_watches) is left as it is.
fs.inotify.max_user_instances = 8192
