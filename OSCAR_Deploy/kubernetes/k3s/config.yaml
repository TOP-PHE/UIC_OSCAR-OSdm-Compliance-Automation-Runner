# k3s's own settings for OSCAR on one machine, copied to
# /etc/rancher/k3s/config.yaml BEFORE k3s is installed (guide: "OSCAR - k3s
# on one VPS"). Each key is a k3s server flag without its "--".

# The kubeconfig (every right on the cluster) is root's only.
write-kubeconfig-mode: "0600"

# Kubernetes Secrets encrypted in k3s's datastore: oscar-secrets holds
# ENCRYPTION_KEY. It can only be switched on at a k3s start.
secrets-encryption: true
