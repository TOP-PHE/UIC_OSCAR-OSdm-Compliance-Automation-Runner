# A drop-in for k3s's service (#1438): once k3s has started, its certificates
# are readable by root only (the CIS benchmark of k3s, 1.1.20). k3s writes
# them, and renews them, when it starts; this runs after each start, so a
# renewed certificate is closed too. "-": a failure never stops k3s.
# Installed as /etc/systemd/system/k3s.service.d/oscar-cert-permissions.conf
# (OSCAR - k3s on one VPS, section 3).
[Service]
ExecStartPost=-/usr/bin/find /var/lib/rancher/k3s/server/tls -name *.crt -exec chmod 600 {} +
