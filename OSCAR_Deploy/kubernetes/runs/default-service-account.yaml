# The namespace's default ServiceAccount mounts no token (#1438, the CIS
# benchmark's 5.1.5): the run pods use oscar-run, which
# mounts none either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: oscar-runs
automountServiceAccountToken: false
