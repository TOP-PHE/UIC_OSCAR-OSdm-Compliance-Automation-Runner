# A ceiling on what runs take together, whatever the server asks for: room
# for MAX_CONCURRENT_RUNS (6 by default, up to 50) run pods of the
# dispatcher's default size (200m / 256Mi asked, 2 CPUs / 1Gi at most; 2 CPUs
# since #1307, 1.11.540: at 1 a run pod was throttled a third to half of the
# time). The limits are what the pods may use, not what they are given.
# Raise it with MAX_CONCURRENT_RUNS. A pod over the quota is not made, and its
# run ends as "did not start".
apiVersion: v1
kind: ResourceQuota
metadata:
  name: oscar-runs
  namespace: oscar-runs
spec:
  hard:
    pods: "50"
    count/jobs.batch: "60"
    count/secrets: "60"
    requests.cpu: "10"
    requests.memory: 13Gi
    limits.cpu: "100"
    limits.memory: 50Gi
