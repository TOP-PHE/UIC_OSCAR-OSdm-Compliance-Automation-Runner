# The runs' namespace (run isolation, option 4, #1130): one pod per run, made
# by the run dispatcher. A namespace of its own, so that the dispatcher's
# rights cover the runs and nothing of the server (oscar-secrets is not
# there). Applied once, on its own and without -n:
#
#   kubectl apply -k OSCAR_Deploy/kubernetes/runs
#
# It names OSCAR's namespace, "oscar", in three places (the dispatcher's
# RoleBinding and the network policy here, RUN_SERVER_URL and RUN_RESULTS_URL
# in components/pod-runs): change all of them together for another name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: oscar
    includeSelectors: false
resources:
  - namespace.yaml
  - run-account.yaml
  - dispatcher-role.yaml
  - quota.yaml
  - network-policy.yaml
