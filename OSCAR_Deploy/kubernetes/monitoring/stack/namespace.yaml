# Prometheus, Alertmanager, Grafana, Loki and Alloy. Not "restricted": the
# machine's exporter (node-exporter) reads the host's /proc and /sys, with the
# host's network, as on any cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: oscar-monitoring
