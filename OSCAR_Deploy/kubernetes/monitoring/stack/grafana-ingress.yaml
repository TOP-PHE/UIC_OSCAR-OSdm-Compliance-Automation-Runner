# Grafana at https://<OSCAR's name>/grafana/, for OSCAR administrators only,
# as on the VPS (nginx/oscar-metrics.conf.snippet): before each request
# Traefik asks OSCAR's /v1/auth/sso-check with the visitor's session cookie.
# A 200 (an administrator) gives Grafana the e-mail OSCAR answers, in
# X-User-Email; any other answer goes back to the visitor and Grafana sees
# nothing. Traefik removes an X-User-Email the visitor sent before it adds
# OSCAR's. Sign in to OSCAR first (Admin → Dashboard has the links).
#
# The host is OSCAR's (overlays/k3s/ingress.yaml) and the middleware is named
# <namespace>-<name>: this namespace is monitoring.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oscar-sso
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: oscar-monitoring
spec:
  forwardAuth:
    address: http://oscar.oscar.svc.cluster.local:3001/v1/auth/sso-check
    # What OSCAR reads to know who it is; nothing else of the request.
    authRequestHeaders:
      - Cookie
      - Authorization
    authResponseHeaders:
      - X-User-Email
      - X-User-Role
    # No session, or an ended one (8 h): OSCAR answers 401, and Traefik sends
    # the browser to OSCAR's sign-in page, which comes back to Grafana once
    # signed in, as nginx's @sso_login does on the VPS (#1199). Without it the
    # visitor saw OSCAR's 401 as JSON. A path: same host, nothing to replace.
    # Traefik 3.7 and later (k3s v1.36.6 ships 3.7.15).
    authSigninURL: /index.html?next=/grafana/
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: oscar-monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-oscar-sso@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: oscar.example.org
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                # The chart's Grafana, named after its release
                # (kube-prometheus-stack.yaml).
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
