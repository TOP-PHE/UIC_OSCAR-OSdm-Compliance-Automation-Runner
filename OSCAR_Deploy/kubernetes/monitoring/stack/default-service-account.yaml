# The namespace's default ServiceAccount mounts no token (#1438, the CIS
# benchmark's 5.1.5): Loki uses it and mounts none; the
# chart's pods and Alloy have accounts of their own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: monitoring
automountServiceAccountToken: false
