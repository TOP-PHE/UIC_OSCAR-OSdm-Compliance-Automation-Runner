# Grafana Alloy sends the logs of OSCAR's pods to Loki (config.alloy). It
# reads them through Kubernetes, with a Role in OSCAR's namespace only: it
# sees no other namespace's pods, and needs no folder of the machine. One
# replica: two would send each line twice.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: oscar-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oscar-logs-reader
  namespace: oscar
  labels:
    app.kubernetes.io/part-of: oscar-monitoring
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oscar-logs-reader
  namespace: oscar
  labels:
    app.kubernetes.io/part-of: oscar-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oscar-logs-reader
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: oscar-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: oscar-monitoring
    spec:
      serviceAccountName: alloy
      securityContext:
        # The image's own alloy user, which it does not run as by default.
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
          command: [/bin/alloy]
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            # Its own page (configuration, targets) stays in the pod.
            - --server.http.listen-addr=127.0.0.1:12345
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
