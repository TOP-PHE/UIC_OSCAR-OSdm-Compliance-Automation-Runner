# OSCAR's monitoring on k3s (#1147), what the VPS's docker-compose.metrics.yml
# gives: Prometheus, Alertmanager and Grafana (kube-prometheus-stack, installed
# by k3s's Helm controller), Loki for the logs and Grafana Alloy to send them.
# Guide: "OSCAR - k3s on one VPS", section 8a.
#   kubectl -n monitoring create secret generic oscar-alertmanager --from-file=alertmanager.yaml=<file>
#   kubectl apply -k OSCAR_Deploy/kubernetes/monitoring/site      (a copy of this folder)
#   kubectl apply -k OSCAR_Deploy/kubernetes/monitoring/oscar     (once the chart's CRDs exist)
# Before that, put the machine's DNS name in place of the placeholder host
# (kube-prometheus-stack.yaml, twice, and grafana-ingress.yaml): the guide's
# sed. Never write that placeholder in a comment: the guide's grep, after the
# sed, must print nothing. OSCAR's namespace must exist: Alloy reads its
# pods' logs. No namespace here: each file names its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - kube-prometheus-stack.yaml
  # The VPS's Loki configuration, as a ConfigMap (OSCAR_Deploy/loki).
  - ../../../loki
  - loki.yaml
  - alloy.yaml
  - grafana-ingress.yaml
  - network-policy.yaml

configMapGenerator:
  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy
