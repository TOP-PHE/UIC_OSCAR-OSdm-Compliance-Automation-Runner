# Generated by OSCAR_Deploy/kubernetes/monitoring/generate-rules.js from
# OSCAR_Deploy/prometheus/alerts/*.yml: do not edit it by hand. The VPS's
# alert rules, one PrometheusRule per file, their groups as they are.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oscar-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: oscar-monitoring
spec:
  groups:
    - name: oscar.app
      interval: 30s
      rules:
        - alert: OscarServerDown
          expr: up{job="oscar-server"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: OSCAR server is unreachable
            description: Prometheus has been unable to scrape the OSCAR /metrics endpoint for 2 minutes. The container is either down, deadlocked, or its network bridge is broken. The autoheal sidecar will restart it automatically if Docker reports it unhealthy — verify with `docker ps`. If autoheal didn't kick in, the process may still be answering /health while malfunctioning elsewhere; restart manually.
            runbook: Documentation/Server_Operations/OSCAR - Server Admin Guide.md#operational-monitoring--alerting
        - alert: OscarRestartLoop
          expr: changes(oscar_node_process_start_time_seconds{job="oscar-server"}[10m]) > 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: OSCAR is in a restart loop ({{ $value }} restarts in 10 min)
            description: 'Autoheal is restarting OSCAR but it keeps failing its healthcheck. Likely causes: corrupted SQLite DB, full data volume, missing env var after a deploy, or migration failure on boot. Check `docker logs oscar` and the OSCAR · Logs Grafana dashboard.'
            runbook: Documentation/Server_Operations/OSCAR - Server Admin Guide.md#operational-monitoring--alerting
        - alert: OscarQueueStuck
          expr: oscar_queue_depth > 0 and rate(oscar_runs_total[10m]) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OSCAR queue has work but no runs are completing
            description: Queue depth is {{ $value }} but no runs reached a terminal status in the last 10 min. Check Server Activity tab + OSCAR · Logs for stuck Bruno processes. Restarting the OSCAR container clears any zombie children.
            runbook: Documentation/Server_Operations/OSCAR - Server Admin Guide.md#operational-monitoring--alerting
        - alert: OscarRunFailureRateHigh
          expr: |
            (
              rate(oscar_runs_total{status="FAILED"}[15m])
              /
              (rate(oscar_runs_total[15m]) > 0)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: More than 50% of Bruno runs failing ({{ $value | humanizePercentage }})
            description: Sustained high failure rate over 15 minutes. Typically a vendor API outage, expired OAuth credentials for one or more companies, or a regression in the Bruno collection just deployed. Triage via the Reports tab + Server Activity view.
        - alert: OscarSmtpDegraded
          expr: increase(oscar_smtp_send_total{result="failure"}[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: SMTP send failures detected ({{ $value }} in last 10 min)
            description: OSCAR could not send one or more emails (verification, password reset, or test). Check SMTP credentials on the Server Config tab and the OSCAR · Logs dashboard for the underlying error (typically auth, quota, or DNS).
        - alert: OscarLoginAttackBurst
          expr: increase(oscar_login_attempts_total{result="failure"}[5m]) > 50
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: 'Failed login burst: {{ $value }} attempts in 5 min'
            description: Unusual number of failed logins. Check auth_events on the Server Activity tab, identify source IP, consider blocking at nginx / firewall level.
    - name: oscar.host
      interval: 30s
      rules:
        - alert: OscarHighMemory
          expr: oscar_node_process_resident_memory_bytes{job="oscar-server"} > 1073741824
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OSCAR memory usage above 1 GB for 15 min ({{ $value | humanize1024 }}B)
            description: Sustained high memory may indicate a leak. Capture a heap snapshot before restarting if you want to keep the diagnostic state.
        - alert: OscarEventLoopLag
          expr: oscar_node_nodejs_eventloop_lag_p99_seconds > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OSCAR event loop lag > 200 ms (p99)
            description: The Node event loop is being blocked. Likely a heavy synchronous report-builder query or a tight loop. Check active runs + report rendering load.
        - alert: OscarHostOverloaded
          expr: oscar_host_load{period="5m"} / ignoring(period) oscar_host_cpus > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OSCAR's machine is overloaded (load {{ $value | humanize }} per CPU)
            description: The 5-minute load is over twice the number of CPUs for 10 minutes. Runs and pages slow down. Lower Max Concurrent Runs (Admin → Server Config), about 4 runs per CPU, or give the machine more CPUs.
            runbook: Documentation/Server_Operations/metrics-and-monitoring.md#the-oscar-servers-machine-1013
        - alert: OscarHostMemoryLow
          expr: oscar_host_memory_available_bytes / oscar_host_memory_total_bytes < 0.10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OSCAR's machine has {{ $value | humanizePercentage }} of its memory available
            description: Less than 10 % of the memory is available for 5 minutes. Each run takes about 250 MB. Lower Max Concurrent Runs (Admin → Server Config) now, or the kernel may kill a process.
            runbook: Documentation/Server_Operations/metrics-and-monitoring.md#the-oscar-servers-machine-1013
        - alert: OscarHostSwapping
          expr: (oscar_host_swap_total_bytes - oscar_host_swap_free_bytes) > 1073741824
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OSCAR's machine uses {{ $value | humanize1024 }}B of swap
            description: 'Over 1 GiB of swap in use for 10 minutes: the machine is short of memory and everything slows down. Lower Max Concurrent Runs (Admin → Server Config).'
            runbook: Documentation/Server_Operations/metrics-and-monitoring.md#the-oscar-servers-machine-1013
        - alert: OscarContainerMemoryNearLimit
          expr: oscar_container_memory_bytes / oscar_container_memory_limit_bytes > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The OSCAR container uses {{ $value | humanizePercentage }} of its memory limit
            description: Over 90 % of the container's memory limit for 5 minutes. Past the limit Docker kills the container. Lower Max Concurrent Runs or raise the limit.
            runbook: Documentation/Server_Operations/metrics-and-monitoring.md#the-oscar-servers-machine-1013
    - name: oscar.run-pods
      interval: 30s
      rules:
        - alert: OscarRunPodsNotStarting
          expr: sum(increase(oscar_run_pods_ended_total{outcome="not_started"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: '{{ $value | humanize }} run pod(s) did not start in 15 minutes'
            description: 'Runs ended as "the run''s pod did not start": the run image cannot be pulled (RUN_IMAGE, registry credentials), the quota of the runs'' namespace is full, or its pod security refuses the pod. See `kubectl -n oscar-runs get events`.'
            runbook: Documentation/Server_Operations/OSCAR - Kubernetes and OpenShift Deployment Guide.md#10a-each-run-in-a-pod-of-its-own-pod-mode
        - alert: OscarRunDispatcherRefusing
          expr: sum(increase(oscar_run_pods_ended_total{outcome="refused"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: The run dispatcher refused or lost {{ $value | humanize }} run(s) in 15 minutes
            description: 'The server could not have a run''s pod made: the dispatcher is down, refuses the server''s key (RUN_AGENT_TOKEN), or has reached RUN_DISPATCHER_MAX_RUNS. See `kubectl -n oscar logs deploy/oscar-dispatcher`.'
            runbook: Documentation/Server_Operations/OSCAR - Kubernetes and OpenShift Deployment Guide.md#10a-each-run-in-a-pod-of-its-own-pod-mode
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: osdm-simulator-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: oscar-monitoring
spec:
  groups:
    - name: osdm-simulator
      interval: 30s
      rules:
        - alert: SimulatorUnreachable
          expr: oscar_simulator_configured == 1 and on() oscar_simulator_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The OSDM simulator does not answer OSCAR
            description: OSCAR could not read the simulator's metrics for 5 minutes. Admin → OSDM Simulator says whether the key is refused; else check the simulator host (`docker compose ps`, `curl -s localhost:3002/healthz`).
            runbook: Documentation/Server_Operations/OSCAR - OSDM Simulator.md#monitoring
        - alert: SimulatorSwapInUse
          expr: (osdm_sim_host_swap_total_bytes - osdm_sim_host_swap_free_bytes) > 268435456
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Simulator host uses {{ $value | humanize1024 }}B of swap
            description: Over 256 MiB of swap in use for 10 minutes. Fewer parallel runs (Max Concurrent Runs), or more memory for the simulator's host.
            runbook: Documentation/Server_Operations/OSCAR - OSDM Simulator.md#monitoring
        - alert: SimulatorMemoryHigh
          expr: 1 - osdm_sim_host_memory_available_bytes / osdm_sim_host_memory_total_bytes > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Simulator host memory over 90 % ({{ $value | humanizePercentage }})
            description: Less than 10 % of the simulator host's memory is available. The simulator keeps offers and bookings for an hour (SIM_TTL_SECONDS); a load test fills them.
            runbook: Documentation/Server_Operations/OSCAR - OSDM Simulator.md#monitoring
        - alert: SimulatorSlowAnswers
          expr: histogram_quantile(0.95, sum by (le) (rate(osdm_sim_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Simulator answers take over 1 s (p95)
            description: The simulator answers in a few milliseconds when at rest. A p95 over a second means its host is saturated (CPU, swap) or its event loop is blocked.
            runbook: Documentation/Server_Operations/OSCAR - OSDM Simulator.md#monitoring
        - alert: SimulatorRefusingOscar
          expr: increase(osdm_sim_rate_limited_total{trusted="true"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: The simulator refuses OSCAR's requests (429)
            description: 'The OSCAR server''s address reached SIM_TRUSTED_REQUESTS_PER_MINUTE or nginx''s trusted zone. Runs failing now are the limit''s: raise it, or lower Max Concurrent Runs.'
            runbook: Documentation/Server_Operations/OSCAR - OSDM Simulator.md#monitoring
        - alert: SimulatorDiskLow
          expr: osdm_sim_host_disk_free_bytes / osdm_sim_host_disk_total_bytes < 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Simulator data disk under 10 % free
            description: The disk holding the simulator's data folder (accounts, audit, statistics) is nearly full.
            runbook: Documentation/Server_Operations/OSCAR - OSDM Simulator.md#monitoring
        - alert: SimulatorEventLoopLag
          expr: osdm_sim_event_loop_delay_p99_seconds > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Simulator event loop delayed over 200 ms (p99)
            description: The simulator's Node process is blocked by CPU work. Check the host's CPU and the number of parallel runs.
            runbook: Documentation/Server_Operations/OSCAR - OSDM Simulator.md#monitoring
