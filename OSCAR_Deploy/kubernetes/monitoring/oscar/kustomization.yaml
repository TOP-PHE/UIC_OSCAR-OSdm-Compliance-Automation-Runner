# What OSCAR adds to a cluster's Prometheus Operator and Grafana (#1147): the
# scrape of /metrics, the VPS's alerts, alerts on the run pods, and the
# dashboards. On k3s it follows monitoring/stack; on another cluster with the
# Prometheus Operator (OpenShift's user workload monitoring included) it is
# applied alone. It needs the operator's CRDs, so it is applied after them:
#   kubectl wait --for condition=established crd/servicemonitors.monitoring.coreos.com crd/prometheusrules.monitoring.coreos.com
#   kubectl apply -k OSCAR_Deploy/kubernetes/monitoring/oscar
# OSCAR's namespace is oscar (service-monitor.yaml); the rest goes to
# monitoring. No namespace here: each file names its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service-monitor.yaml
  # The VPS's alert rules (OSCAR_Deploy/prometheus/alerts), generated by
  # generate-rules.js: do not edit it by hand.
  - prometheus-rules.yaml
  - cluster-rules.yaml
  # The VPS's dashboards (OSCAR_Deploy/grafana/dashboards).
  - ../../../grafana

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: oscar-monitoring

configMapGenerator:
  # A cluster's own: each run in a pod, OSCAR's pods, the machine.
  - name: oscar-dashboard-kubernetes
    namespace: monitoring
    files:
      - dashboards/oscar-kubernetes.json
