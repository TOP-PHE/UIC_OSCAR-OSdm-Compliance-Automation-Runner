# Everything OSCAR keeps: the SQLite database, the companies' data files and
# run reports (encrypted with ENCRYPTION_KEY), the run workspaces. Back it up
# with ENCRYPTION_KEY kept apart: one without the other cannot be read.
# ReadWriteOnce: one pod, one node. Use a block or local file system storage
# class: SQLite on a network file system (NFS, SMB) risks a corrupt database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oscar-data
  labels:
    app.kubernetes.io/name: oscar
    app.kubernetes.io/component: server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
