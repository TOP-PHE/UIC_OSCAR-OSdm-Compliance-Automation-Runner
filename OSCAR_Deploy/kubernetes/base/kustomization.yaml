# OSCAR on Kubernetes or OpenShift: what every cluster needs (#1059).
# Do not apply this folder alone: apply an overlay, which adds the way in
# and names the image.
#   overlays/kubernetes  an Ingress (ingress-nginx), and fsGroup 1000
#   overlays/openshift   a Route; the cluster chooses the user id
# Guide: Documentation/Server_Operations/OSCAR - Kubernetes and OpenShift Deployment Guide.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: oscar
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml
  - data-volume.yaml

# Settings that are not secret. The secrets (ENCRYPTION_KEY and the others in
# secrets.env.example) are a Secret named oscar-secrets that you create
# yourself: they never go in this folder.
# The generated name ends in a hash of the content, so a change of setting
# restarts the pod.
configMapGenerator:
  - name: oscar-settings
    envs:
      - settings.env
