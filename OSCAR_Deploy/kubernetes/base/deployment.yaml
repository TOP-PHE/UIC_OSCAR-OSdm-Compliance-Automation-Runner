apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscar
  labels:
    app.kubernetes.io/name: oscar
    app.kubernetes.io/component: server
spec:
  # ONE replica, always. OSCAR keeps its database in SQLite on the data
  # volume, its run queue in memory, and takes an in-process lock before every
  # data file write: a second pod would corrupt the first one's work, not share
  # it. It grows with more CPU and memory for this pod (see resources below).
  replicas: 1
  # Recreate, not RollingUpdate: the new pod must not start while the old one
  # still has the database open. An update therefore stops OSCAR for the time
  # the new pod takes to start; runs it cut off are marked as such at start
  # (worker/reconcile.js), as after a restart of the VPS.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oscar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oscar
        app.kubernetes.io/component: server
    spec:
      # OSCAR never calls the Kubernetes API.
      automountServiceAccountToken: false
      # No OSCAR_SERVICE_HOST / OSCAR_PORT_… variables from the Service.
      enableServiceLinks: false
      # Kubernetes' "restricted" pod security and OpenShift's restricted-v2
      # SCC both accept this pod. No runAsUser here: the image's USER is uid
      # 1000, and OpenShift gives its own uid (the image allows any uid in
      # group 0 to write its data directory).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: oscar
          # The overlay names the real image (its `images:`). It is the
          # bundle: the server image with the Bruno collection and
          # compatibility.json of the same release (Dockerfile.bundle).
          image: oscar-bundle
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: oscar-settings
            - secretRef:
                name: oscar-secrets
          env:
            # The key the runner container asks for (below). A Secret of its
            # own, oscar-runner, so that the runner never receives
            # oscar-secrets: kubectl create secret generic oscar-runner
            #   --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
            - name: RUN_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oscar-runner
                  key: RUN_AGENT_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Not read-only yet: the root file system of the image is not
            # written today (data on the volume, /tmp below), but nothing
            # proves it for every path yet.
            readOnlyRootFilesystem: false
          # /health checks the database, the data directory and the free
          # space. In production OSCAR redirects plain http to https unless
          # the request names localhost: the probes do, as the VPS's Docker
          # health check does.
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 5
            # Up to 5 minutes for the database migrations of a large database.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # The server alone: the runs are the runner container's.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The database, data files and run reports.
            - name: data
              mountPath: /app/data
            # The runs' working folders, shared with the runner.
            - name: run-workspaces
              mountPath: /app/run-workspaces
            # HOME points here (settings.env): an OpenShift uid has no home.
            - name: tmp
              mountPath: /tmp
        # The runner: the same image, running the runner agent, which starts
        # the Bruno CLI of each run (RUN_ISOLATION=isolated in settings.env).
        # It gets none of the server's settings, secrets or data: not the data
        # volume, not oscar-secrets, not the server's /tmp. The containers of a
        # pod share the network (the agent listens on 127.0.0.1 only, Bruno
        # calls the server back on 127.0.0.1) but not their processes: the
        # code of a run cannot see the server's process or its environment.
        - name: runner
          image: oscar-bundle
          imagePullPolicy: IfNotPresent
          command: ["node", "src/runner-agent/agent.js"]
          env:
            - name: RUN_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oscar-runner
                  key: RUN_AGENT_TOKEN
            - name: RUN_WORKSPACES_DIR
              value: /app/run-workspaces
            - name: BRU_CMD
              value: /usr/local/bin/bru
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: TZ
              value: Europe/Paris
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          # The agent listens on the pod's loopback only, which a kubelet
          # tcpSocket probe (the pod's address) cannot reach.
          startupProbe:
            exec:
              command: ["node", "-e", "require('node:net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["node", "-e", "require('node:net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # One run (a Bruno process) takes about 0.2 CPU and 250 MB, so
          # MAX_CONCURRENT_RUNS (settings.env) is about 4 per CPU of this
          # limit. Raise the limits and that setting together.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: run-workspaces
              mountPath: /app/run-workspaces
            - name: runner-tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oscar-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: run-workspaces
          emptyDir:
            sizeLimit: 4Gi
        - name: runner-tmp
          emptyDir:
            sizeLimit: 1Gi
