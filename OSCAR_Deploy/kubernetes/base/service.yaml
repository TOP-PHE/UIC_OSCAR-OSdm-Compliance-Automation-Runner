# Inside the cluster only: the overlay's Ingress or Route is the way in.
# Prometheus scrapes http://oscar:3001/metrics with the METRICS_TOKEN.
apiVersion: v1
kind: Service
metadata:
  name: oscar
  labels:
    app.kubernetes.io/name: oscar
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oscar
  ports:
    - name: http
      port: 3001
      targetPort: http
