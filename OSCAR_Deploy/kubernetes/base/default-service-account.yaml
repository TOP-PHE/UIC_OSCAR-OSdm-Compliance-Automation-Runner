# The namespace's default ServiceAccount mounts no token (#1438, the CIS
# benchmark's 5.1.5): OSCAR's pod uses it and mounts none
# (deployment.yaml); the dispatcher has an account of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
