# CI only (.github/workflows/ci-kubernetes.yml, job "k3s on one machine"):
# monitoring/stack on the runner's k3s, as the guide applies it, with no
# Let's Encrypt (the runner has no public name: Traefik serves its own
# certificate). The host stays oscar.example.org, the CI's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../monitoring/stack

patches:
  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: remove
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.tls.certresolver
