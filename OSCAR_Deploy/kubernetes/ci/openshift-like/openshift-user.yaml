# What OpenShift's restricted-v2 SCC does to the pod: a uid from the
# project's range, group 0, the volume's group from the same range. The image
# was built for uid 1000; it must work under this one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscar
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000740000
        runAsGroup: 0
        fsGroup: 1000740000
      containers:
        - name: oscar
          # Loaded into kind by the workflow, never pulled.
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
