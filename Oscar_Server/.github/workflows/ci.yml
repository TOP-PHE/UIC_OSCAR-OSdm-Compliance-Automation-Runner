name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt JavaScript-based actions (checkout, setup-node, etc.) into Node.js 24 now.
# GitHub will force this default starting June 2nd, 2026; setting it explicitly
# silences the deprecation warning and ensures consistent runtime behavior.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-test:
    name: Lint, audit, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit (high+ severity only)
        # `audit-level=high` keeps the build from failing on transitive
        # low/moderate issues we can't immediately fix. Tighten later.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      - name: Run tests
        # Tests are added in a separate phase. For now, succeed if no test script.
        run: npm test --if-present
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: oscar-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
