info:
  name: 01d. POST Get Offer Individual
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_base}}/offers"
  headers:
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: "{{OfferCollectionRequestIndividual}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // ── Group tariffs (#599) — the same offer request, INDIVIDUAL ─────────
        // Reached only through routeAfterOfferStep() after a COLLECTIVE
        // request: the request of 01 is sent again in the INDIVIDUAL mode, and
        // the chosen group offer's price is compared with the same passengers
        // alone.
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);
        const { individualRequest } = require(bru.getEnvVar("library_base") + "groupOffers.js");
        const _request = JSON.parse(bru.getEnvVar("OfferCollectionRequest") || "{}");
        bru.setEnvVar("OfferCollectionRequestIndividual", JSON.stringify(individualRequest(_request)));
    - type: after-response
      code: |-
        // A failed comparison never stops the scenario: the offer of 01 is
        // still the one booked.
        let _body;
        try { _body = res.getBody(); } catch (_e) { _body = null; }
        const { compareGroupOfferIndividual, routeAfterOfferStep } = require(bru.getEnvVar("library_base") + "offers.js");
        compareGroupOfferIndividual(res.getStatus(), _body);
        routeAfterOfferStep();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
