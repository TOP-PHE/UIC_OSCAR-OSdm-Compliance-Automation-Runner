info:
  name: 12. PATCH Booking Purchaser
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{api_base}}/bookings/{{bookingId}}/purchaser"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: |
      {{bookingPurchaserBody}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // #258 / #203: set the purchaser on an already-existing booking via
        // PATCH (patchBookingPurchaser). Reached only when the scenario chose
        // bookingPurchaserMode = 'deferred' (happy: supply it) or 'invalid'
        // (negative: supply a bad purchaser → expect rejection). The purchaser
        // was deliberately OMITTED from 02. POST Create Booking.
        //
        // NB OSDM offers two write ops on this sub-resource: POST (create a
        // purchaser for a booking that has none) and PATCH (update an existing
        // one). For a booking created WITHOUT a purchaser, POST-create is the
        // canonical call — but several providers (e.g. Bileto) already
        // materialise an (empty) purchaser on the booking, so a POST-create hits
        // an existing resource and 500s; PATCH-update is the call that works.
        // We therefore use PATCH here. The body is a best-effort assembly from
        // the scenario's purchaser (bookingPurchaserSpecifications) + any update*
        // overrides the booking-level RI handler produced (purchaserAdditionalData).
        console.log("⏩ [STEP] Executing request : " + req.getName());

        const mode = String(bru.getEnvVar("bookingPurchaserMode") || "inline").toLowerCase();

        let base = {};
        try { base = JSON.parse(bru.getEnvVar("bookingPurchaserSpecifications") || "{}") || {}; } catch (_e) { base = {}; }
        let add = {};
        try { add = JSON.parse(bru.getEnvVar("purchaserAdditionalData") || "{}") || {}; } catch (_e) { add = {}; }

        // Deep-copy the scenario purchaser so we never mutate the stored spec.
        const body = JSON.parse(JSON.stringify(base || {}));
        body.detail = (body.detail && typeof body.detail === "object") ? body.detail : {};
        body.detail.contact = (body.detail.contact && typeof body.detail.contact === "object") ? body.detail.contact : {};

        // Overlay update* overrides: a value present replaces the field; an empty
        // string means "withhold" (probe omit) → remove the field.
        const setOrClear = (obj, key, val) => {
          if (val === undefined) return;
          if (val === "") { delete obj[key]; } else { obj[key] = val; }
        };
        if ("updateFirstName"   in add) setOrClear(body.detail,         "firstName",   add.updateFirstName);
        if ("updateLastName"    in add) setOrClear(body.detail,         "lastName",    add.updateLastName);
        if ("updateEmail"       in add) setOrClear(body.detail.contact, "email",       add.updateEmail);
        if ("updatePhoneNumber" in add) setOrClear(body.detail.contact, "phoneNumber", add.updatePhoneNumber);
        if ("updateGender"      in add) setOrClear(body.detail,         "gender",      add.updateGender);
        if ("updateDateOfBirth" in add) setOrClear(body.detail,         "dateOfBirth", add.updateDateOfBirth);

        // Invalid probe without a purchaser-specific demand → still send a clearly
        // invalid value so the provider must reject (deterministic negative test).
        if (mode === "invalid" && !body.detail.contact.email) {
          body.detail.contact.email = "not-an-email";
        }

        bru.setVar("bookingPurchaserBody", JSON.stringify(body));
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");

        const mode = String(bru.getEnvVar("bookingPurchaserMode") || "inline").toLowerCase();
        const endpoint = "/bookings/{id}/purchaser";
        const status = res.getStatus();
        let body;
        try { body = res.getBody(); } catch (_e) { body = null; }

        if (mode === "invalid") {
          // ── Negative probe (Group N): expect a 4xx RFC-9457 Problem ──────────
          const { validateProblemResponse } = require(bru.getEnvVar("library_base") + "requestedInformation.js");
          let targets = [];
          try { targets = JSON.parse(bru.getEnvVar("requestedInfoPurchaserProbeTargets") || "[]"); } catch (_e) { targets = []; }
          validationLogger(`[INFO] Purchaser negative probe (invalid) — expecting PATCH ${endpoint} to be rejected.`);
          validateProblemResponse({
            status: status,
            body: body,
            targets: targets,
            assert: (name, ok, msg) => { bruTest(name, () => { expect(ok, msg).to.be.true; }); },
            log: (lvl, msg) => validationLogger(`[${lvl}] ${msg}`),
          });
        } else {
          // ── Happy path (deferred): expect 2xx PurchaserResponse ──────────────
          const ok2xx = status >= 200 && status < 300;
          if (ok2xx) {
            bruTest(`PATCH ${endpoint} → ${status} (purchaser set on the booking)`, () => {
              expect(ok2xx, `Expected 2xx, got ${status}`).to.be.true;
            });
            validationLogger(`[INFO] PATCH ${endpoint} → ${status} — purchaser set on the booking after deferral.`);
            const hasPurchaser = !!(body && typeof body === "object" && body.purchaser);
            bruTest(`PATCH ${endpoint} response carries 'purchaser' (PurchaserResponse)`, () => {
              expect(hasPurchaser, "no 'purchaser' in the PurchaserResponse").to.be.true;
            });
          } else {
            validationLogger(`[ERROR] PATCH ${endpoint} → ${status} (expected 2xx setting the deferred purchaser)`);
            bruTest(`PATCH ${endpoint} → ${status} (FAIL)`, () => {
              expect(ok2xx, `Expected 2xx, got ${status}`).to.be.true;
            });
          }
        }

        // Mark done so the smart-run filter does not re-run this step if the flow
        // later falls through to it, then continue to the pre-fulfillment GET.
        bru.setEnvVar("__purchaserStepDone", "true");
        bru.runner.setNextRequest("05. GET Booking before Fulfillments");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
