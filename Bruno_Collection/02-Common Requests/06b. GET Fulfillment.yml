info:
  name: 06b. GET Fulfillment
  type: http
  seq: 6

http:
  method: GET
  url: "{{api_base}}/fulfillments/{{fulfillmentToReadId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // ── Fulfilment documents (#603) ────────────────────────────────────────
        // Reached only from 06 (and from itself): each fulfillment of the
        // booking in turn. A provider may answer with a document that covers
        // more than this fulfillment (one PDF merged for the booking): that is
        // a warning, as is every document check.
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);
        require(bru.getEnvVar("library_base") + "fulfillmentSteps.js").readNextFulfillment();
    - type: after-response
      code: |-
        let _body;
        try { _body = res.getBody(); } catch (_e) { _body = null; }
        bru.runner.setNextRequest(require(bru.getEnvVar("library_base") + "fulfillmentSteps.js").checkFulfillmentReadStep(res.getStatus(), _body));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
