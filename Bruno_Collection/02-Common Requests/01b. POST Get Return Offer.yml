info:
  name: 01b. POST Get Return Offer
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_base}}/offers"
  headers:
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: "{{ReturnOfferCollectionRequest}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // ── Two-step return (#178, #594), leg 2 — the INWARD (return) offer ────
        // Reached only when "01. POST Get Offer" detected a return scenario and
        // routed here (after capturing the outbound offer and its trip). Build
        // the inward request: O&D swapped, departureTime = the inbound date,
        // related to the outbound by returnSearchParameters.outwardOfferIds
        // (SEPARATE) or .outboundTripIds (COMBINED).
        const { buildReturnOfferCollectionRequest } = require(bru.getEnvVar("library_base") + "requestsBuilder.js");
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);
        buildReturnOfferCollectionRequest();
    - type: after-response
      code: |-
        const { postOfferResponse } = require(bru.getEnvVar("library_base")+"offers.js");
        const { displayOfferResponse } = require(bru.getEnvVar("library_base")+"displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base")+"testCapture.js");

        // Mark the inbound step done up-front so a failure here never loops back
        // into another return fetch.
        bru.setEnvVar('__returnInboundDone', 'true');

        bruTest(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        if (res.getStatus() !== 200) {
          bruTest("Return offer — status 200 (STOP on failure)", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Return Offer");
          return;
        }

        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            bruTest("Return offer — JSON parsing should succeed", () => { throw e; });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Get Return Offer (JSON parse)");
            return;
        }

        // Capture + validate the inward offer. postOfferResponse sets offer /
        // offerId to the chosen inbound offer. SEPARATE: offerId is copied into
        // inboundOfferId so the booking references BOTH offers. COMBINED: that
        // one offer covers both directions and is booked alone, as a one-way
        // offer is. On "no offers" it throws → skip.
        const _model = bru.getEnvVar("returnModel") || "SEPARATE";
        try {
          postOfferResponse(jsonData);
          if (_model === "COMBINED") {
            console.log("[INFO] 🔁 Return offer covering both directions captured: " + bru.getEnvVar("offerId") + " — booked alone.");
          } else {
            bru.setEnvVar("inboundOfferId", bru.getEnvVar("offerId"));
            console.log("[INFO] 🔁 Inbound (return) offer captured: " + bru.getEnvVar("offerId"));
          }
        } catch (noOffersErr) {
          bruTest("Return offers found in response", () => { throw noOffersErr; });
          console.log("[INFO] No inbound (return) offers returned — skipping this scenario");
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Return Offer (no offers)");
          return;
        }
        displayOfferResponse(jsonData);

        // #598: no inbound offer holds the expected product: stop, as at 01.
        if (bru.getEnvVar("__productNotOffered") === "true") {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Return Offer (expected product not offered)");
          return;
        }

        // #594: the inbound response against the outbound call: a trip back,
        // the same passengers, and what each model's offers must cover.
        const { checkReturnOffers } = require(bru.getEnvVar("library_base") + "returnJourney.js");
        let _outboundCriteria = {};
        let _passengerRefs = [];
        try { _outboundCriteria = JSON.parse(bru.getEnvVar("offerTripSearchCriteria") || "{}"); } catch (_e) { _outboundCriteria = {}; }
        try { _passengerRefs = (JSON.parse(bru.getEnvVar("offerPassengerSpecifications") || "[]") || []).map((p) => p && p.externalRef).filter(Boolean); } catch (_e) { _passengerRefs = []; }
        checkReturnOffers(jsonData, {
          model: _model,
          outboundCriteria: _outboundCriteria,
          outboundTripId: bru.getEnvVar("outboundTripId"),
          passengerRefs: _passengerRefs,
        }).forEach((c) => {
          if (c.level === "warn") {
            if (!c.ok) console.log("[WARNING] " + c.name + " — " + c.message);
            return;
          }
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // #597: the chosen inbound offer applied each passenger's card too.
        require(bru.getEnvVar("library_base") + "offers.js").checkOfferCards("Inbound offer");

        // Return trips book outbound + inbound together; no pre-booking place map.
        bru.setGlobalEnvVar("skipPlaceMaps", true);
        bru.runner.setNextRequest("02. POST Create Booking");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
