info:
  name: 03. PATCH Multi Passenger
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{api_base}}/bookings/{{bookingId}}/passengers/{{passengerId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: |-
      {
        "id": "{{passengerId}}",
        "externalRef": "{{passengerSpecificationExternalRef}}",
        "dateOfBirth": "{{patchDateOfBirth}}",
        "type": "PERSON",
        "gender": "{{patchGender}}",
        "detail": {
          "firstName": "{{patchFirstName}}",
          "lastName": "{{patchLastName}}",
          "contact": {
            "email": "{{patchEmail}}",
            "phoneNumber": "{{patchPhoneNumber}}"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);

        // #258 PASSENGER NEGATIVE SWEEP — gated strictly to requestedInformationProbe
        // === 'invalid'. Tests each passenger field ONE AT A TIME on passenger 0: a
        // valid baseline for every field with exactly ONE corrupted per pass; the
        // after-response grades it and loops back here for the next field. off / omit /
        // happy paths are untouched (this branch returns before the normal logic).
        if (String(bru.getEnvVar("requestedInformationProbe") || "off").toLowerCase() === "invalid") {
            const { sampleValueForField, invalidValueForField } = require(bru.getEnvVar("library_base") + "requestedInformation.js");
            const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
            const SWEEP = ["gender", "dateOfBirth", "firstName", "lastName", "email", "phoneNumber"];
            bru.setEnvVar("__passengerSweepTotal", String(SWEEP.length));
            let sIdx = parseInt(bru.getEnvVar("__passengerSweepIndex") || "0", 10);
            if (isNaN(sIdx) || sIdx < 0) sIdx = 0;
            if (sIdx > SWEEP.length - 1) sIdx = SWEEP.length - 1;
            const sField = SWEEP[sIdx];

            const _idList = bru.getEnvVar("passengerIdList") || [];
            const _refs = JSON.parse(bru.getEnvVar("bookingPassengerReferences") || "[]");
            bru.setEnvVar("passengerId", _idList[0]);
            bru.setEnvVar("passengerSpecificationExternalRef", _refs[0]);

            // Valid baseline for every field, then corrupt ONLY the swept one.
            const v = {
                gender:      sampleValueForField("gender", 0, "PERSON"),
                dateOfBirth: sampleValueForField("dateOfBirth", 0, "PERSON"),
                firstName:   sampleValueForField("firstName", 0),
                lastName:    sampleValueForField("lastName", 0),
                email:       sampleValueForField("email", 0),
                phoneNumber: sampleValueForField("phoneNumber", 0),
            };
            const bad = invalidValueForField(sField);
            let target;
            if (bad !== null) { v[sField] = bad; target = { index: 0, scenarioField: sField, value: bad }; }
            else { v[sField] = ""; target = { index: 0, scenarioField: sField }; } // firstName/lastName → omit (required)

            bru.setEnvVar("patchGender",      v.gender);
            bru.setEnvVar("patchDateOfBirth", v.dateOfBirth);
            bru.setEnvVar("patchFirstName",   v.firstName);
            bru.setEnvVar("patchLastName",    v.lastName);
            bru.setEnvVar("patchEmail",       v.email);
            bru.setEnvVar("patchPhoneNumber", v.phoneNumber);
            bru.setEnvVar("__passengerSweepTarget", JSON.stringify(target));
            validationLogger(`[WARNING] Passenger negative sweep ${sIdx + 1}/${SWEEP.length}: `
                + (target.value !== undefined ? `INVALID '${sField}' = '${target.value}'` : `OMIT required '${sField}'`)
                + ` on passenger 0 — expecting the provider to reject.`);
            return;
        }

        const passengerIdList             = bru.getEnvVar("passengerIdList");
        const passengerAdditionalData     = JSON.parse(bru.getEnvVar("passengerAdditionalData") || "[]");
        const bookingPassengerSpecs       = JSON.parse(bru.getEnvVar("bookingPassengerSpecifications") || "[]");
        const bookingPassengerReferences  = JSON.parse(bru.getEnvVar("bookingPassengerReferences") || "[]");
        const totalPassengers             = bru.getEnvVar("offerPassengerNumber") || 0;
        const currentIndex                = bru.getEnvVar("currentPassengerIndex") || 0;

        if (currentIndex >= totalPassengers) {
            console.log("[INFO] ✅ All passengers processed");
            return;
        }

        const passengerId   = passengerIdList[currentIndex];
        const data          = passengerAdditionalData[currentIndex];
        const passengersRef = bookingPassengerReferences[currentIndex];
        const passengerGender = bookingPassengerSpecs[currentIndex];

        bru.setEnvVar("passengerId",                      passengerId);
        bru.setEnvVar("passengerSpecificationExternalRef", passengersRef);
        bru.setEnvVar("patchDateOfBirth",  data.updateDateOfBirth  || "");
        bru.setEnvVar("patchFirstName",    data.updateFirstName    || "");
        bru.setEnvVar("patchLastName",     data.updateLastName     || "");
        bru.setEnvVar("patchEmail",        data.updateEmail        || "");
        bru.setEnvVar("patchPhoneNumber",  data.updatePhoneNumber  || "");
        bru.setEnvVar("patchGender",       data.updateGender || passengerGender.gender);
    - type: after-response
      code: |-
        const { patchMultiPassengerResponse } = require(bru.getEnvVar("library_base") + "passengers.js");

        // #258 PASSENGER NEGATIVE SWEEP (requestedInformationProbe === 'invalid'):
        // grade the single field corrupted this pass, then loop back to PATCH
        // passenger 0 for the next field; stop after the last. Severity comes from
        // validateProblemResponse (enum/format → FAIL, unconstrained string → WARN,
        // missing required → FAIL). off/omit/happy never enter here.
        if (String(bru.getEnvVar("requestedInformationProbe") || "off").toLowerCase() === "invalid") {
            const { validateProblemResponse } = require(bru.getEnvVar("library_base") + "requestedInformation.js");
            const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
            let _t = null;
            try { _t = JSON.parse(bru.getEnvVar("__passengerSweepTarget") || "null"); } catch (_e) { _t = null; }
            const _f = (_t && _t.scenarioField) ? _t.scenarioField : "passenger";
            validationLogger(`[INFO] Passenger negative sweep — expecting the PATCH to reject '${_f}' on passenger 0.`);
            validateProblemResponse({
                status: res.getStatus(),
                body: res.getBody(),
                targets: _t ? [_t] : [],
                label: "passenger0." + _f,
                assert: (name, ok, msg) => { test(name, () => { expect(ok, msg).to.be.true; }); },
                log: (lvl, msg) => validationLogger(`[${lvl}] ${msg}`),
            });
            let _i = parseInt(bru.getEnvVar("__passengerSweepIndex") || "0", 10); if (isNaN(_i)) _i = 0;
            const _tot = parseInt(bru.getEnvVar("__passengerSweepTotal") || "1", 10) || 1;
            if (_i < _tot - 1) {
                bru.setEnvVar("__passengerSweepIndex", String(_i + 1));
                bru.runner.setNextRequest("03. PATCH Multi Passenger");
                return;
            }
            bru.setEnvVar("__passengerSweepIndex", "0");
            bru.runner.setNextRequest(null);
            return;
        }

        // RI negative probe — OMIT (#258 Phase 3c): when the omit probe withheld a
        // required field at the offer/booking step, the PATCH MUST be rejected. Grade
        // the error (N1-N4) and stop the chain. off/happy → skipped (happy unchanged).
        const _riProbe = String(bru.getEnvVar("requestedInformationProbe") || "off").toLowerCase();
        const _riTargets = JSON.parse(bru.getEnvVar("requestedInfoProbeTargets") || "[]");
        if (_riProbe === "omit" && _riTargets.length > 0) {
            const { validateProblemResponse } = require(bru.getEnvVar("library_base") + "requestedInformation.js");
            const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
            validationLogger(`[INFO] RI negative probe '${_riProbe}' active — expecting the PATCH to be rejected for: ${_riTargets.map(t => t.scenarioField + "@p" + t.index).join(", ")}`);
            validateProblemResponse({
                status: res.getStatus(),
                body: res.getBody(),
                targets: _riTargets,
                assert: (name, ok, msg) => { test(name, () => { expect(ok, msg).to.be.true; }); },
                log: (lvl, msg) => validationLogger(`[${lvl}] ${msg}`),
            });
            bru.runner.setNextRequest(null);
            return;
        }

        test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        if (res.getStatus() !== 200) {
          test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("PATCH Multi Passenger");
          return;
        }

        const jsonData = res.getBody();

        if (!jsonData.passenger) {
            throw new Error("⛔ Exiting script, no passenger available in the response");
        }

        const totalPassengers = Number(bru.getEnvVar("offerPassengerNumber"));
        let currentIndex = Number(bru.getEnvVar("currentPassengerIndex"));
        if (isNaN(currentIndex)) currentIndex = 0;

        patchMultiPassengerResponse(jsonData, currentIndex);

        currentIndex++;
        bru.setEnvVar("currentPassengerIndex", currentIndex);

        if (currentIndex < totalPassengers) {
            bru.runner.setNextRequest(req.getName());
        } else {
            bru.runner.setNextRequest("06. GET Passenger");
            bru.setEnvVar("currentPassengerIndex", 0);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
