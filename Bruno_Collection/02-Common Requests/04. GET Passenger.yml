info:
  name: 04. GET Passenger
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}/passengers/{{passengerId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);

        const totalPassengers = bru.getEnvVar("offerPassengerNumber") || 0;
        const currentIndex    = bru.getEnvVar("currentPassengerIndex") || 0;

        if (currentIndex >= totalPassengers) return;

        const passengerIdList            = bru.getEnvVar("passengerIdList");
        const passengerAdditionalData    = JSON.parse(bru.getEnvVar("passengerAdditionalData") || "[]");
        const bookingPassengerSpecs      = JSON.parse(bru.getEnvVar("bookingPassengerSpecifications") || "[]");
        const bookingPassengerReferences = JSON.parse(bru.getEnvVar("bookingPassengerReferences") || "[]");

        const passengerId     = passengerIdList[currentIndex];
        const data            = passengerAdditionalData[currentIndex];
        const passengersRef   = bookingPassengerReferences[currentIndex];
        const passengerGender = bookingPassengerSpecs[currentIndex];

        bru.setEnvVar("passengerId",                      passengerId);
        bru.setEnvVar("passengerSpecificationExternalRef", passengersRef);
        bru.setEnvVar("patchDateOfBirth",  data.updateDateOfBirth  || "");
        bru.setEnvVar("patchFirstName",    data.updateFirstName    || "");
        bru.setEnvVar("patchLastName",     data.updateLastName     || "");
        bru.setEnvVar("patchEmail",        data.updateEmail        || "");
        bru.setEnvVar("patchPhoneNumber",  data.updatePhoneNumber  || "");
        bru.setEnvVar("patchGender",       data.updateGender || passengerGender.gender);
    - type: after-response
      code: |-
        const { patchMultiPassengerResponse } = require(bru.getEnvVar("library_base") + "passengers.js");

        test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        // #361: on failure, the step-failure policy decides — HARD_STOP
        // (default) abandons the scenario; CONTINUE records the failure and
        // routes to the same successor the success path uses (the booking
        // already exists; fulfillment needs nothing from this response).
        const _policyNext = (() => {
          const _pm = String(bru.getEnvVar("bookingPurchaserMode") || "inline").toLowerCase();
          const _due = (_pm === "deferred" || _pm === "invalid") && bru.getEnvVar("__purchaserStepDone") !== "true";
          // #361: the pre-fulfillment GET's real request name is
          // "05. GET Booking before Fulfillments" — the historical
          // "07. …" target never existed (the flow only worked because
          // Bruno falls through to natural file order on an unknown name).
          return _due ? "12. GET Booking Purchaser" : "05. GET Booking before Fulfillments";
        })();

        if (res.getStatus() !== 200) {
          // #383: the status test above already recorded this failure once —
          // a second identical registration only double-counted it.
          const { failStepOrContinue } = require(bru.getEnvVar("library_base") + "loopback.js");
          failStepOrContinue("GET Passenger", _policyNext);
          return;
        }

        const jsonData = res.getBody();

        if (!jsonData.passenger) {
            // #361: registered failure + policy routing instead of a bare
            // throw that killed the script before any setNextRequest.
            test("GET Passenger response carries a passenger object", () => {
              throw new Error("No passenger in the 200 response body — see the HTTP-traffic viewer.");
            });
            const { failStepOrContinue } = require(bru.getEnvVar("library_base") + "loopback.js");
            failStepOrContinue("GET Passenger", _policyNext);
            return;
        }

        const totalPassengers = Number(bru.getEnvVar("offerPassengerNumber"));
        let currentIndex = Number(bru.getEnvVar("currentPassengerIndex"));
        if (isNaN(currentIndex)) currentIndex = 0;

        patchMultiPassengerResponse(jsonData, currentIndex);

        currentIndex++;
        bru.setEnvVar("currentPassengerIndex", currentIndex);

        if (currentIndex < totalPassengers) {
            bru.runner.setNextRequest(req.getName());
        } else {
            // #258 / #203: when the scenario deferred the purchaser, run the
            // purchaser create-or-update flow before fulfillment. 12. GET Booking
            // Purchaser probes whether one exists, then routes to PATCH (update)
            // or POST (create). 'deferred' supplies it (happy), 'invalid' probes
            // it (expects rejection). 'inline'/'omit' skip it → straight to the
            // pre-fulfillment GET (unchanged).
            const _purMode = String(bru.getEnvVar("bookingPurchaserMode") || "inline").toLowerCase();
            const _purStepDue = (_purMode === "deferred" || _purMode === "invalid")
                && bru.getEnvVar("__purchaserStepDone") !== "true";
            // #361: same name fix as _policyNext above — the request is
            // "05. GET Booking before Fulfillments" ("07. …" never existed).
            bru.runner.setNextRequest(_purStepDue ? "12. GET Booking Purchaser" : "05. GET Booking before Fulfillments");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
