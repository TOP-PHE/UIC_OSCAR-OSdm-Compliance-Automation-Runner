info:
  name: 02. POST Create Booking
  type: http
  seq: 2

http:
  method: POST
  url: "{{api_base}}/bookings"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: |
      {{BookingRequest}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { buildBookingRequest } = require(bru.getEnvVar("library_base") + "requestsBuilder.js");
        console.log("⏩ [STEP] Executing request : " + req.getName());
        buildBookingRequest();
    - type: after-response
      code: |-
        const { postCreateBookingResponse } = require(bru.getEnvVar("library_base") + "bookings.js");
        const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");

        const _status = res.getStatus();
        let _body = null;
        try { _body = res.getBody(); } catch (_e) { _body = null; }

        // ── Two-step return booking (#178/#180), adaptive ─────────────────────
        // Return scenarios first attempt a COMBINED booking (both offers). OSDM
        // permits this, but some vendors don't (Bileto: "Only one offer can be
        // booked at a time, for now"). On that rejection we emit a clearly-named
        // FAILING assertion (so the vendor gap is easy to track in the report)
        // and fall back to two SEPARATE bookings: outbound, then inbound.
        const _isReturn = !!bru.getEnvVar("inboundOfferId") && !!bru.getEnvVar("outboundOfferId");
        const _mode = bru.getEnvVar("__returnBookMode") || "";

        function _isMultiOfferRejected(b, st) {
          if (st !== 400 || !b || typeof b !== "object") return false;
          const t = ((b.title || "") + " " + (b.detail || "")).toLowerCase();
          return t.includes("too many offers") || t.includes("one offer") || t.includes("multiple offer");
        }

        if (_isReturn && _mode === "") {
          // First attempt = combined (both offers in one booking).
          if (_status === 200) {
            test("[OSDM] Vendor books a round trip (both offers) in a single booking", () => {
              expect(_status).to.eql(200);
            });
            postCreateBookingResponse(bru.getEnvVar("offer"), _body, ["PREBOOKED"], ["ON_HOLD", "AVAILABLE"]);
            bru.deleteEnvVar("currentPassengerIndex");
          } else if (_isMultiOfferRejected(_body, _status)) {
            // Trackable vendor-gap finding (intentionally FAILS).
            test("[OSDM] Vendor supports booking multiple offers (round trip) in one booking", () => {
              expect(false, `Vendor rejected the combined round-trip booking — ${(_body && _body.title) || ""}: ${(_body && _body.detail) || ""}. OSDM allows multiple offers; falling back to two separate bookings.`).to.be.true;
            });
            console.log("⚠️ [VENDOR GAP] Provider does not support multiple offers in one booking request — falling back to two separate bookings (outbound, then inbound).");
            bru.setEnvVar("__returnBookMode", "sep-out");
            bru.runner.setNextRequest("02. POST Create Booking");
            return;
          } else {
            test("Status code is 200", () => { throw new Error(`[ERROR] Wrong response status: ${_status}`); });
            loopbackOrStop("POST Create Booking (combined return)");
            return;
          }
        } else if (_isReturn && _mode === "sep-out") {
          // Separate booking, leg 1 (outbound).
          test("Return — outbound booking created (status 200)", () => { expect(_status).to.eql(200); });
          if (_status !== 200) { loopbackOrStop("POST Create Booking (outbound leg)"); return; }
          const _ob = _body && _body.booking;
          if (_ob && _ob.id) { bru.setEnvVar("outboundBookingId", _ob.id); console.log("🔁 Outbound booking created: " + _ob.id); }
          bru.setEnvVar("__returnBookMode", "sep-in");
          bru.runner.setNextRequest("02. POST Create Booking");
          return;
        } else if (_isReturn && _mode === "sep-in") {
          // Separate booking, leg 2 (inbound) — becomes the "current" booking
          // and continues through the normal post-booking flow below.
          test("Return — inbound booking created (status 200)", () => { expect(_status).to.eql(200); });
          if (_status !== 200) { loopbackOrStop("POST Create Booking (inbound leg)"); return; }
          bru.setEnvVar("__returnBookMode", "done");
          postCreateBookingResponse(bru.getEnvVar("offer"), _body, ["PREBOOKED"], ["ON_HOLD", "AVAILABLE"]);
          console.log("🔁 Inbound booking created: " + bru.getEnvVar("bookingId") + " — round trip booked as 2 bookings (outbound=" + bru.getEnvVar("outboundBookingId") + ").");
          bru.deleteEnvVar("currentPassengerIndex");
        } else {
          // One-way (unchanged behaviour), or the combined-200 success path.
          test("Status code is 200", () => {
              expect(_status, "[ERROR] Wrong response status").to.eql(200);
          });
          if (_status !== 200) {
            test("Status code is 200", () => { throw new Error(`[ERROR] Wrong response status: ${_status}`); });
            loopbackOrStop("POST Create Booking");
            return;
          }
          postCreateBookingResponse(bru.getEnvVar("offer"), _body, ["PREBOOKED"], ["ON_HOLD", "AVAILABLE"]);
          bru.deleteEnvVar("currentPassengerIndex");
        }

        // Routing after POST Create Booking:
        //   1. Legacy `skipPatchPassengerRequest` still wins for explicit
        //      test-harness overrides.
        //   2. New per-scenario opt-out `salesFlow_patchPassengers` — set by
        //      scenarioParser from the data file's scenario.salesFlowActions.
        //      Missing / unset → defaults to "true" so scenarios that predate
        //      the flag retain their historic behaviour.
        //   3. Default → run the PATCH Multi Passenger step.
        //
        // NOTE: the previous numbering ("05. PATCH Multi Passenger" /
        // "06. GET Passenger") in this routing block was a silent bug — the
        // collection was re-numbered to 03 / 04 at some point and Bruno's
        // setNextRequest accepts the call but when the named request does
        // not exist it just continues to the next request in sequence. As a
        // consequence the skip path (old `skipPatchPassengerRequest === true`)
        // silently never worked either. Fixed here to match the actual
        // request names in the collection.
        // 4. Post-booking add-reservation (ADD_TO_BOOKING, issue #104 Stage B):
        //    when the scenario chose ADD_TO_BOOKING place selection, insert the
        //    add-reservation step before the passenger steps. It then continues
        //    to PATCH/GET Passenger itself. Inert for every current scenario.
        //    Optional post-booking add-offer-part steps chain in order:
        //    [Add Reservation] → [Add Ancillary] → PATCH/GET. Each runs only
        //    when its gate is on; both default off → straight to PATCH/GET.
        //    Adaptive fallback (#182): when the pre-booking seat map failed at
        //    offer time (08. GET Place Maps set __placeMapAtOfferFailed), the
        //    seat could not be picked before booking. We still want the customer
        //    to pick a place, so route to the post-booking add-reservation step
        //    here even though the scenario's nominal mode was SEATMAP_AT_OFFER —
        //    "pre-book, then pick the seat" (the customer-natural flow that
        //    providers like Bileto support).
        const _addRes = (bru.getEnvVar("placeSelectionMode") === "ADD_TO_BOOKING"
                          || bru.getEnvVar("__placeMapAtOfferFailed") === "true")
            && String(bru.getEnvVar("salesFlow_placeSelection")) === "true"
            && bru.getEnvVar("__addReservationDone") !== "true";
        const _addAnc = String(bru.getEnvVar("salesFlow_addAncillary")) === "true"
            && bru.getEnvVar("__addAncillaryDone") !== "true";
        // #184: when an add-reservation is due, first fetch the BOOKING-context
        // seat map (08b) so the reservation can carry an AVAILABLE place. 08b
        // runs once then routes to 09 itself; if it already ran we go straight
        // to 09. The pre-booking SEATMAP_AT_OFFER path (picks already made at
        // offer time) does not enter here — it is not an add-reservation flow.
        const _postBookMap = _addRes
            && bru.getEnvVar("__postBookingPlaceMapDone") !== "true";
        if (_postBookMap) {
            bru.runner.setNextRequest("08b. GET Place Map Post-Booking");
        } else if (_addRes) {
            bru.runner.setNextRequest("09. POST Add Reservation to Booking");
        } else if (_addAnc) {
            bru.runner.setNextRequest("11. Add Ancillary - Get Additional Offers");
        } else if (bru.getEnvVar("skipPatchPassengerRequest") === "true"
            || bru.getEnvVar("salesFlow_patchPassengers") === "false") {
            bru.runner.setNextRequest("04. GET Passenger");
        } else {
            bru.runner.setNextRequest("03. PATCH Multi Passenger");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
