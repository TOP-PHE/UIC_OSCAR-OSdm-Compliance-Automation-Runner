info:
  name: 14. POST Booking Purchaser
  type: http
  seq: 14

http:
  method: POST
  url: "{{api_base}}/bookings/{{bookingId}}/purchaser"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: |
      {{bookingPurchaserBody}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // #258/#203 — CREATE the purchaser (postBookingPurchaser). Reached only
        // when 12. GET Booking Purchaser found NO purchaser (non-2xx) and set
        // __purchaserWriteMethod=POST. Body is the shared assembly (scenario
        // purchaser + booking-level RI overrides).
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);
        const { buildBookingPurchaserBody } = require(bru.getEnvVar("library_base") + "requestsBuilder.js");
        buildBookingPurchaserBody();
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");

        const mode = String(bru.getEnvVar("bookingPurchaserMode") || "inline").toLowerCase();
        const endpoint = "/bookings/{id}/purchaser";
        const status = res.getStatus();
        let body;
        try { body = res.getBody(); } catch (_e) { body = null; }

        if (mode === "invalid") {
          // Negative SWEEP (#258): one purchaser field corrupted per pass; grade it,
          // then loop back to 12. GET Booking Purchaser for the next field.
          const { validateProblemResponse } = require(bru.getEnvVar("library_base") + "requestedInformation.js");
          let target = null;
          try { target = JSON.parse(bru.getEnvVar("bookingPurchaserSweepTarget") || "null"); } catch (_e) { target = null; }
          const field = (target && target.scenarioField) ? target.scenarioField : "purchaser";
          validationLogger(`[INFO] Purchaser negative sweep — expecting POST ${endpoint} to reject '${field}'.`);
          validateProblemResponse({
            status: status,
            body: body,
            targets: target ? [target] : [],
            label: "purchaser." + field,
            assert: (name, ok, msg) => { bruTest(name, () => { expect(ok, msg).to.be.true; }); },
            log: (lvl, msg) => validationLogger(`[${lvl}] ${msg}`),
          });
          // Advance to the next field (re-probe via GET); finish after the last one.
          let idx = parseInt(bru.getEnvVar("__purchaserSweepIndex") || "0", 10); if (isNaN(idx)) idx = 0;
          const total = parseInt(bru.getEnvVar("__purchaserSweepTotal") || "1", 10) || 1;
          if (idx < total - 1) {
            bru.setEnvVar("__purchaserSweepIndex", String(idx + 1));
            bru.runner.setNextRequest("12. GET Booking Purchaser");
            return;
          }
          bru.setEnvVar("__purchaserSweepIndex", "0");
          bru.setEnvVar("__purchaserStepDone", "true");
          bru.runner.setNextRequest("05. GET Booking before Fulfillments");
          return;
        }

        // Happy path (deferred): expect a 2xx PurchaserResponse.
        const ok2xx = status >= 200 && status < 300;
        if (ok2xx) {
          bruTest(`POST ${endpoint} → ${status} (purchaser created on the booking)`, () => {
            expect(ok2xx, `Expected 2xx, got ${status}`).to.be.true;
          });
          validationLogger(`[INFO] POST ${endpoint} → ${status} — purchaser created on the booking after deferral.`);
          const hasPurchaser = !!(body && typeof body === "object" && body.purchaser);
          bruTest(`POST ${endpoint} response carries 'purchaser' (PurchaserResponse)`, () => {
            expect(hasPurchaser, "no 'purchaser' in the PurchaserResponse").to.be.true;
          });
        } else {
          validationLogger(`[ERROR] POST ${endpoint} → ${status} (expected 2xx creating the deferred purchaser)`);
          bruTest(`POST ${endpoint} → ${status} (FAIL)`, () => {
            expect(ok2xx, `Expected 2xx, got ${status}`).to.be.true;
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Booking Purchaser");
          return;
        }

        bru.setEnvVar("__purchaserStepDone", "true");
        bru.runner.setNextRequest("05. GET Booking before Fulfillments");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
