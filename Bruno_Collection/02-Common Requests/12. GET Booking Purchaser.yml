info:
  name: 12. GET Booking Purchaser
  type: http
  seq: 12

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}/purchaser"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);
    - type: after-response
      code: |-
        // #258/#203 — purchaser create-or-update probe. We deliberately omitted
        // the purchaser from 02. POST Create Booking (bookingPurchaserMode =
        // deferred/invalid). OSDM offers POST (create) and PATCH (update) on
        // /bookings/{id}/purchaser, and providers disagree on which applies after
        // a purchaser-less booking: some materialise an (empty) purchaser
        // (PATCH-update works; POST-create 500s), others have none (POST-create
        // works; PATCH 404s). Rather than guess, GET the resource and decide:
        //   2xx  → purchaser exists → UPDATE via PATCH (13)
        //   else → no purchaser     → CREATE via POST (14)
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");

        const endpoint = "/bookings/{id}/purchaser";
        const status = res.getStatus();
        const exists = status >= 200 && status < 300;

        if (exists) {
          bru.setEnvVar("__purchaserWriteMethod", "PATCH");
          validationLogger(`[INFO] GET ${endpoint} → ${status}: a purchaser already exists on the booking → updating it via PATCH.`);
          bru.runner.setNextRequest("13. PATCH Booking Purchaser");
        } else {
          bru.setEnvVar("__purchaserWriteMethod", "POST");
          validationLogger(`[INFO] GET ${endpoint} → ${status}: no purchaser on the booking → creating it via POST.`);
          bru.runner.setNextRequest("14. POST Booking Purchaser");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
