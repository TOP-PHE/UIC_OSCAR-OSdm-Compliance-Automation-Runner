info:
  name: 10. POST Add Ancillary to Booking
  type: http
  seq: 10

http:
  method: POST
  url: "{{api_base}}/bookings/{{bookingId}}/booked-offers/{{bookedOfferId}}/{{addAncillaryResource}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: |
      {{addAncillaryBody}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Add-ancillary step (OPT-ANCILLARY, issue #108). Adds an ancillary
        // offer part to an existing booking. Version-aware endpoint: the unified
        // /offer-parts (OSDM >= 3.7, body uses ancillaryOfferIds[]) else the
        // /ancillaries endpoint (all versions, body uses a single
        // ancillaryOfferId). Reached only when a scenario enabled "Add ancillary"
        // (salesFlow_addAncillary) AND the offer carried ancillary parts;
        // otherwise the smart run filter skips it.
        const { resolveEffectiveVersion, atLeast } = require(bru.getEnvVar("library_base") + "osdmVersion.js");
        console.log("⏩ [STEP] Executing request : " + req.getName());

        const useOfferParts = atLeast(resolveEffectiveVersion(), '3.7.0');
        bru.setVar('addAncillaryResource', useOfferParts ? 'offer-parts' : 'ancillaries');

        // ── Request body ───────────────────────────────────────────────────
        // Schemas:
        //   >=3.7 BookedOfferPartRequest:      offerId*, passengerRefs* (+ ancillaryOfferIds)
        //   any   BookedOfferAncillaryRequest: offerId*, ancillaryOfferId*, passengerRefs*
        // PREFER the ids captured by step 11 from GET .../additional-offers
        // (offerId + ancillaryOfferIds valid for THIS booking, #150) — the
        // pre-booking offer's ancillary ids are rejected with "ancillary not
        // valid for bookedOfferId". Fall back to the original offer's ids when
        // step 11 didn't run / found none (keeps the step usable standalone).
        const offerId = bru.getEnvVar('addAncillaryParentOfferId') || bru.getEnvVar('offerId');
        let passengerRefs = [];
        try { passengerRefs = JSON.parse(bru.getEnvVar('bookingPassengerReferences') || '[]'); } catch (_e) {}

        let ancillaryOfferIds = [];
        try { ancillaryOfferIds = JSON.parse(bru.getEnvVar('addAncillaryOfferIds') || '[]'); } catch (_e) {}
        ancillaryOfferIds = Array.isArray(ancillaryOfferIds) ? ancillaryOfferIds.filter(Boolean) : [];

        // Fallback 1: admission-linked ancillary refs (offers.js).
        if (ancillaryOfferIds.length === 0) {
          try { ancillaryOfferIds = JSON.parse(bru.getEnvVar('referencedAncillaryIds') || '[]'); } catch (_e) {}
          ancillaryOfferIds = Array.isArray(ancillaryOfferIds) ? ancillaryOfferIds.filter(Boolean) : [];
        }
        // Fallback 2: the selected offer's own top-level ancillaryOfferParts
        // (e.g. Sqills), for standalone/pre-booking use.
        if (ancillaryOfferIds.length === 0) {
          let _offer = bru.getEnvVar('offer');
          try { if (typeof _offer === 'string') _offer = JSON.parse(_offer); } catch (_e) { _offer = null; }
          const _parts = (_offer && Array.isArray(_offer.ancillaryOfferParts)) ? _offer.ancillaryOfferParts : [];
          ancillaryOfferIds = _parts.map((p) => p && p.id).filter(Boolean);
        }

        const body = useOfferParts
          ? { offerId: offerId, passengerRefs: passengerRefs, ancillaryOfferIds: ancillaryOfferIds }
          : { offerId: offerId, ancillaryOfferId: ancillaryOfferIds[0], passengerRefs: passengerRefs };
        bru.setVar('addAncillaryBody', JSON.stringify(body));

        // #expired-add-ancillary-offer test (Phase 5b): when armed, wait until
        // just past the earliest validUntil on the ancillary offer-parts this
        // POST will send. The PRIMARY capture happens in 11.yml's after-response
        // (additional-offers source); the FALLBACK below covers scenarios that
        // never went through 11 (referencedAncillaryIds / original-offer source).
        if (String(bru.getEnvVar("expiredAddAncillaryOfferTest")) === "true") {
          const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
          const { planExpiredFlow, runExpiredFlowWait } = require(bru.getEnvVar("library_base") + "expiredFlow.js");

          // Fallback capture: if 11.yml did not stash a deadline, derive it
          // from the selected offer's ancillaryOfferParts (matching the ids
          // about to be sent).
          if (!bru.getEnvVar("addAncillaryOfferValidUntil")) {
            let _offer = bru.getEnvVar('offer');
            try { if (typeof _offer === 'string') _offer = JSON.parse(_offer); } catch (_e) { _offer = null; }
            const _parts = (_offer && Array.isArray(_offer.ancillaryOfferParts)) ? _offer.ancillaryOfferParts : [];
            const _wantIds = new Set(ancillaryOfferIds);
            let _earliestMs = Infinity, _earliestRaw = null, _earliestSrc = null;
            _parts.forEach(function (p, i) {
              if (!p || !p.id || !_wantIds.has(p.id) || !p.validUntil) return;
              const t = new Date(p.validUntil).getTime();
              if (!isNaN(t) && t < _earliestMs) {
                _earliestMs  = t;
                _earliestRaw = p.validUntil;
                _earliestSrc = `selectedOffer.ancillaryOfferParts[${i}].validUntil`;
              }
            });
            if (_earliestRaw) {
              bru.setEnvVar("addAncillaryOfferValidUntil", String(_earliestRaw));
              bru.setEnvVar("addAncillaryOfferValidUntilSource", String(_earliestSrc));
              validationLogger(`[INFO] Fallback capture: add-ancillary offer-part validUntil = ${_earliestRaw} (${_earliestSrc}).`);
            }
          }

          const limitRaw   = bru.getEnvVar("addAncillaryOfferValidUntil");
          const limitSrc   = bru.getEnvVar("addAncillaryOfferValidUntilSource") || "ancillary offer-part validUntil";
          const maxWaitMin = parseInt(bru.getEnvVar("expiredAddAncillaryOfferMaxWaitMinutes") || "0", 10) || 0;
          const plan = planExpiredFlow({
            deadlineRaw:    limitRaw,
            maxWaitMinutes: maxWaitMin,
            resourceLabel:  "add-ancillary offer-part (" + limitSrc + ")",
          });
          if (!plan.armed) {
            validationLogger(`[WARNING] expiredAddAncillaryOfferTest SKIPPED: ${plan.reason}`);
            bru.setEnvVar("__expiredAddAncillaryOfferArmed", "false");
          } else {
            await runExpiredFlowWait({ plan, deadlineRaw: limitRaw, scenarioLabel: "expiredAddAncillaryOfferTest (POST /bookings/{id}/.../add-ancillary)" });
            bru.setEnvVar("__expiredAddAncillaryOfferArmed", "true");
            validationLogger(`[INFO] expiredAddAncillaryOfferTest: attempting POST add-ancillary, expecting the provider to reject it (ancillary offer-part validUntil passed).`);
          }
        }

    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { validateBookedOfferPartResponse } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        // #expired-add-ancillary-offer: when armed, the POST MUST be rejected —
        // adding an expired ancillary offer-part to the booking must not
        // succeed. Grade here and short-circuit (skip the compliance validator
        // + the routing tail to PATCH / GET Passenger) so the next scenario
        // fires cleanly. The booking continues to exist without the ancillary.
        if (String(bru.getEnvVar("__expiredAddAncillaryOfferArmed")) === "true") {
            const { gradeExpiredFlowResponse } = require(bru.getEnvVar("library_base") + "expiredFlow.js");
            const _grade = gradeExpiredFlowResponse({ res: res, scenarioLabel: "Expired add-ancillary offer" });
            const _resource = bru.getVar('addAncillaryResource') || 'offer-parts';
            test(`Expired add-ancillary offer: POST /.../${_resource} (ancillary) is rejected with a client error (4xx) — an expired ancillary offer-part must not be addable to the booking (got ${_grade.status})`, () => {
                expect(_grade.isClientError, `expected a 4xx rejection, got ${_grade.status}`).to.be.true;
            });
            if (_grade.isClientError && !_grade.isAuthFailure) {
                test("Expired add-ancillary offer: error body is an RFC-9457 Problem (title/detail/code present)", () => {
                    expect(_grade.hasProblemBody, "response body did not contain title/detail/code").to.be.true;
                });
            }
            // Multi-scenario tail: loop to next scenario or stop.
            const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            if (_scList.length > 0 && _scNextIdx < _scList.length) {
                bru.setEnvVar('__loopback', 'true');
                bru.runner.setNextRequest('01. POST Get Offer');
            } else {
                bru.runner.stopExecution();
            }
            return;
        }

        const resource = bru.getVar('addAncillaryResource') || 'offer-parts';
        const endpoint = `/bookings/{id}/booked-offers/{id}/${resource}`;
        const statusCode = res.getStatus();
        let body;
        try { body = res.getBody(); } catch (_e) {}

        // ── Status ────────────────────────────────────────────────────────
        if (statusCode === 200) {
          bruTest(`POST ${endpoint} (ancillary) → 200 OK`, () => { expect(statusCode).to.eql(200); });
          validationLogger(`[INFO] POST ${endpoint} (ancillary) → 200 OK`);
        } else {
          validationLogger(`[ERROR] POST ${endpoint} (ancillary) → ${statusCode} (expected 200 adding an ancillary to the booking)`);
          bruTest(`POST ${endpoint} (ancillary) → ${statusCode} (FAIL)`, () => {
            expect(statusCode, `Expected 200, got ${statusCode}`).to.eql(200);
          });
        }

        // ── OSDM compliance (Layer 1): BookedOfferPart/Ancillary response ──
        // BookedOfferAncillaryResponse shares the { warnings?, problems[],
        // bookedOffers[] } envelope with BookedOfferPartResponse.
        validateBookedOfferPartResponse(body, endpoint).forEach((c) => {
          bruTest(c.name, () => { expect(c.ok, c.message).to.be.true; });
        });

        // Mark done so the smart run filter does not re-run this post-booking
        // step if the flow falls through to it again at the end of the scenario.
        bru.setEnvVar('__addAncillaryDone', 'true');

        // Continue the sale flow — same PATCH-vs-GET decision as Create Booking.
        if (bru.getEnvVar("skipPatchPassengerRequest") === "true"
            || bru.getEnvVar("salesFlow_patchPassengers") === "false") {
          bru.runner.setNextRequest("04. GET Passenger");
        } else {
          bru.runner.setNextRequest("03. PATCH Multi Passenger");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
