info:
  name: 01. POST Get Offer
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_base}}/offers"
  headers:
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: "{{OfferCollectionRequest}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // ── Multi-scenario loop-back: reset env vars and load next scenario ────
        // When __loopback is 'true' the runner has been routed back here from the
        // terminal step of the previous scenario.  Reset all business env vars,
        // load the next scenario's data, and initialise a fresh HTML report so
        // each scenario produces its own independent report file.
        if (bru.getEnvVar('__loopback') === 'true') {
          bru.setEnvVar('__loopback', null);
          try {
            const { getScenarioData, resetScenarioEnvVars } = require(bru.getEnvVar('library_base') + 'scenarioParser.js');
            const { initReport } = require(bru.getEnvVar('library_base') + 'reportGenerator.js');
            resetScenarioEnvVars();
            await getScenarioData();
            initReport(bru.getEnvVar('library_base'));
            bru.setEnvVar('__reportInitDone', 'true');
            // #833: this request was prepared before the next scenario was read.
            require(bru.getEnvVar('library_base') + 'requestHeaders.js').applySimulatorFaults(req, bru.getEnvVar('simulatorFaults'));
            const _list = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _idx  = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            console.log('🔄 Loop-back — starting scenario: ' + (bru.getEnvVar('scenarioCode') || '?') +
              ' [' + _idx + '/' + _list.length + ' remaining]');
          } catch (_lbErr) {
            console.log('[ERROR] Loop-back setup failed: ' + (_lbErr && _lbErr.message));
            const { loopbackOrStop } = require(bru.getEnvVar('library_base') + 'loopback.js');
            loopbackOrStop('Loop-back setup');
          }
        }

        // #204 token-watchdog: refresh the access token at scenario start.
        // The endpoint respects the server-side cache — when the cached token
        // is still valid this is a ~50ms no-op; when the cache is within the
        // safety margin OSCAR refetches a new token from the OAuth server.
        // This guards against long-batch runs where the original token might
        // outlive its TTL between scenarios.
        try {
          const { refreshAccessTokenIfNeeded } = require(bru.getEnvVar("library_base") + "auth.js");
          await refreshAccessTokenIfNeeded({ callerLabel: 'POST /offers (scenario start)' });
        } catch (_e) { /* helper is best-effort; checkAuthRejection covers 401/403 downstream */ }

        const { postOfferResponsePreRequest, prepareOfferRequestByTripIds } = require(bru.getEnvVar("library_base")+"offers.js");
        postOfferResponsePreRequest();
        // #602: offers asked for a trip of POST /trips-collection, by its id.
        await prepareOfferRequestByTripIds();
        // #904: requested sections that do not lie inside the trip.
        require(bru.getEnvVar("library_base") + "fares.js").prepareSectionCheck();
        // #703: negative probe, the offer request with no passenger.
        require(bru.getEnvVar("library_base") + "passengerLimit.js").prepareEmptyPassengers();
    - type: after-response
      code: |-
        const { postOfferResponse } = require(bru.getEnvVar("library_base")+"offers.js");
        const { displayOfferResponse } = require(bru.getEnvVar("library_base")+"displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base")+"testCapture.js");

        // #904: a requested section outside the trip is the scenario's fault;
        // the answer is not checked.
        if (require(bru.getEnvVar("library_base") + "fares.js").stopOnSectionsOutside()) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (requested sections outside the trip)");
          return;
        }

        // #602: the checks of POST /trips-collection and of the offers asked by
        // trip id, or the grading of the unknown trip id probe, which ends the
        // scenario here (as does a trip search that gave no trip).
        let _tripIdsBody = null;
        try { _tripIdsBody = res.getBody(); } catch (_e) { _tripIdsBody = null; }
        if (require(bru.getEnvVar("library_base") + "offers.js").checkOfferRequestByTripIds(res.getStatus(), _tripIdsBody)) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (by trip id)");
          return;
        }

        // #703: no passenger at all must be refused; the scenario ends here.
        if (require(bru.getEnvVar("library_base") + "passengerLimit.js").checkEmptyPassengersRefused(res.getStatus(), _tripIdsBody)) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (no passenger probe)");
          return;
        }

        // #704: a departure in the past or beyond the sales horizon must not
        // be sold; the scenario ends here either way.
        if (require(bru.getEnvVar("library_base") + "departureLimit.js").checkDepartureRefused(res.getStatus(), _tripIdsBody)) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (departure date probe)");
          return;
        }

        // #781: a currency the provider does not sell must not be sold; the
        // scenario ends here either way.
        if (require(bru.getEnvVar("library_base") + "currencies.js").checkCurrencyNotSold(res.getStatus(), _tripIdsBody)) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (currency probe)");
          return;
        }

        // #780 PR C: an offer search option value the framework leaves out
        // must not be taken silently; the scenario ends here either way.
        if (require(bru.getEnvVar("library_base") + "optionNotDeclared.js").checkUndeclaredOption(res.getStatus(), _tripIdsBody)) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (undeclared option probe)");
          return;
        }

        // #699: one passenger over the provider's maximum. A refusal here, or
        // no offer, ends the scenario; offers given go on to the booking,
        // where the refusal is then expected.
        if (require(bru.getEnvVar("library_base") + "passengerLimit.js").checkOffersOverLimit(res.getStatus(), _tripIdsBody)) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (passenger limit probe)");
          return;
        }

        // #887 PR 3: a group too large for its product may be refused; the
        // scenario ends here then.
        if (require(bru.getEnvVar("library_base") + "groupOffers.js").checkGroupRefused(res.getStatus(), _tripIdsBody)) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (group size probe)");
          return;
        }

        // Validate HTTP response status
        bruTest(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        // Stop flow if status != 200
        if (res.getStatus() !== 200) {
          bruTest("Status code is 200 — STOP on failure", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            bruTest("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Get Offer (JSON parse)");
            return;
        }

        // #903: fare offers. A request asking for fares has them checked here
        // and ends (booking a fare comes with #906); otherwise fares that were
        // not asked are a failure, and fare-only offers leave the product checks.
        // #906: a fare offer that passed its checks is booked: straight to 02.
        if (require(bru.getEnvVar("library_base") + "fares.js").checkFareOffers(jsonData)) {
          if (require(bru.getEnvVar("library_base") + "fares.js").isFareSale()) {
            bru.runner.setNextRequest("02. POST Create Booking");
            return;
          }
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (fare offers)");
          return;
        }

        // Catch "no offers": retry up to 3 times, then skip to next scenario
        try {
          postOfferResponse(jsonData);
          bru.setEnvVar('__offerRetryCount', '0'); // reset on success
        } catch (noOffersErr) {
          bruTest("Offers found in response", () => { throw noOffersErr; });
          const _retryCount = parseInt(bru.getEnvVar('__offerRetryCount') || '0', 10) + 1;
          bru.setEnvVar('__offerRetryCount', String(_retryCount));
          if (_retryCount < 3) {
            console.log('⚠️ No offers (attempt ' + _retryCount + '/3) — retrying...');
            bru.runner.setNextRequest('01. POST Get Offer');
          } else {
            console.log('[INFO] No offers returned after 3 attempts — skipping this scenario');
            bru.setEnvVar('__offerRetryCount', '0');
            // #385: a skipped expired-flow sub-run must not behead the queue —
            // hand the remaining timers their pass before the next scenario.
            if (require(bru.getEnvVar("library_base") + "expiredFlow.js").advanceExpiredFlowQueueAfterSkip()) return;

            const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            if (_scList.length > 0 && _scNextIdx < _scList.length) {
              console.log('⏭️ Skipping to next scenario [' + (_scNextIdx + 1) + '/' + _scList.length + ']: ' + _scList[_scNextIdx]);
              bru.setEnvVar('__loopback', 'true');
              bru.runner.setNextRequest('01. POST Get Offer');
            } else {
              console.log('[INFO] ✅ No more scenarios — stopping run');
              bru.runner.stopExecution();
            }
          }
          return;
        }
        displayOfferResponse(jsonData);

        // #598: no offer holds the product the scenario expects (already a
        // failed check): booking another tariff would test nothing. #599: a
        // scenario that expects the product absent ends here too.
        if (bru.getEnvVar("__productNotOffered") === "true") {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (expected product check)");
          return;
        }

        // #600: one check per leg of the chosen offer. #762: when no offer
        // gave the classes asked (a warning), the sale goes on and the booking
        // is held to the classes of the offer chosen.
        require(bru.getEnvVar("library_base") + "offers.js").checkOfferLegClasses(jsonData);
        // #766: what the offer says of the scenario's place selection flow.
        require(bru.getEnvVar("library_base") + "offers.js").checkOfferPlaceSelection();
        // #780: the offers keep to the offer search criteria sent (warnings;
        // tests in an offer search probe, which ends here).
        require(bru.getEnvVar("library_base") + "offers.js").checkOfferSearchCriteria(jsonData);
        // #781: the offers are in the currency asked (or the default one).
        require(bru.getEnvVar("library_base") + "offers.js").checkOfferCurrency(jsonData);
        if (bru.getEnvVar("offerSearchProbe") === "true") {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer (offer search probe)");
          return;
        }
        // #705: passengers on the edges of the age ranges, priced as expected.
        require(bru.getEnvVar("library_base") + "passengerAges.js").checkOfferAges();

        //swaggerSchemaValidatorContent();

        // ── OSDM compliance (Layer 1): offer-time AncillaryOfferPart shape (#108) ──
        // No-op for offers without ancillaries; validates id/type/category on the
        // selected offer's ancillaryOfferParts when present (e.g. Sqills).
        const { validateAncillaryOfferParts } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
        validateAncillaryOfferParts(bru.getEnvVar("offer"), '/offers → ancillaryOfferParts').forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // ── Reduction cards (#597) ────────────────────────────────────────────
        // The chosen offer applied each passenger's card. When a passenger holds
        // one, 01c asks the same offers without cards to compare the prices,
        // then routes on as this step would.
        // ── Routing: the inbound offer of a return (#178, #594), the seat map
        // before booking (#104), or the booking — routeAfterOfferStep().
        // ── Group tariffs (#599): a COLLECTIVE request's chosen offer is one
        // admission for the whole group; routeAfterOfferStep() then goes to
        // 01d to compare its price with the same passengers alone.
        const { checkOfferCards, checkGroupOffer, routeAfterOfferStep } = require(bru.getEnvVar("library_base") + "offers.js");
        checkGroupOffer();
        if (checkOfferCards("Offer", { compare: true })) {
          bru.runner.setNextRequest("01c. POST Get Offer without Cards");
        } else {
          routeAfterOfferStep();
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
