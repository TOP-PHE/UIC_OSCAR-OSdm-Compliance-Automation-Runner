info:
  name: 01. POST Get Offer
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_base}}/offers"
  headers:
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: "{{OfferCollectionRequest}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // ── Multi-scenario loop-back: reset env vars and load next scenario ────
        // When __loopback is 'true' the runner has been routed back here from the
        // terminal step of the previous scenario.  Reset all business env vars,
        // load the next scenario's data, and initialise a fresh HTML report so
        // each scenario produces its own independent report file.
        if (bru.getEnvVar('__loopback') === 'true') {
          bru.setEnvVar('__loopback', null);
          try {
            const { getScenarioData, resetScenarioEnvVars } = require(bru.getEnvVar('library_base') + 'scenarioParser.js');
            const { initReport } = require(bru.getEnvVar('library_base') + 'reportGenerator.js');
            resetScenarioEnvVars();
            await getScenarioData();
            initReport(bru.getEnvVar('library_base'));
            bru.setEnvVar('__reportInitDone', 'true');
            const _list = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _idx  = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            console.log('🔄 Loop-back — starting scenario: ' + (bru.getEnvVar('scenarioCode') || '?') +
              ' [' + _idx + '/' + _list.length + ' remaining]');
          } catch (_lbErr) {
            console.log('[ERROR] Loop-back setup failed: ' + (_lbErr && _lbErr.message));
            const { loopbackOrStop } = require(bru.getEnvVar('library_base') + 'loopback.js');
            loopbackOrStop('Loop-back setup');
          }
        }

        // #204 token-watchdog: refresh the access token at scenario start.
        // The endpoint respects the server-side cache — when the cached token
        // is still valid this is a ~50ms no-op; when the cache is within the
        // safety margin OSCAR refetches a new token from the OAuth server.
        // This guards against long-batch runs where the original token might
        // outlive its TTL between scenarios.
        try {
          const { refreshAccessTokenIfNeeded } = require(bru.getEnvVar("library_base") + "auth.js");
          await refreshAccessTokenIfNeeded({ callerLabel: 'POST /offers (scenario start)' });
        } catch (_e) { /* helper is best-effort; checkAuthRejection covers 401/403 downstream */ }

        const { postOfferResponsePreRequest } = require(bru.getEnvVar("library_base")+"offers.js");
        postOfferResponsePreRequest();
    - type: after-response
      code: |-
        const { postOfferResponse } = require(bru.getEnvVar("library_base")+"offers.js");
        const { displayOfferResponse } = require(bru.getEnvVar("library_base")+"displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base")+"testCapture.js");

        // Validate HTTP response status
        bruTest(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        // Stop flow if status != 200
        if (res.getStatus() !== 200) {
          bruTest("Status code is 200 — STOP on failure", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Get Offer");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            bruTest("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Get Offer (JSON parse)");
            return;
        }

        // Catch "no offers": retry up to 3 times, then skip to next scenario
        try {
          postOfferResponse(jsonData);
          bru.setEnvVar('__offerRetryCount', '0'); // reset on success
        } catch (noOffersErr) {
          bruTest("Offers found in response", () => { throw noOffersErr; });
          const _retryCount = parseInt(bru.getEnvVar('__offerRetryCount') || '0', 10) + 1;
          bru.setEnvVar('__offerRetryCount', String(_retryCount));
          if (_retryCount < 3) {
            console.log('⚠️ No offers (attempt ' + _retryCount + '/3) — retrying...');
            bru.runner.setNextRequest('01. POST Get Offer');
          } else {
            console.log('[INFO] No offers returned after 3 attempts — skipping this scenario');
            bru.setEnvVar('__offerRetryCount', '0');
            // #385: a skipped expired-flow sub-run must not behead the queue —
            // hand the remaining timers their pass before the next scenario.
            if (require(bru.getEnvVar("library_base") + "expiredFlow.js").advanceExpiredFlowQueueAfterSkip()) return;

            const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            if (_scList.length > 0 && _scNextIdx < _scList.length) {
              console.log('⏭️ Skipping to next scenario [' + (_scNextIdx + 1) + '/' + _scList.length + ']: ' + _scList[_scNextIdx]);
              bru.setEnvVar('__loopback', 'true');
              bru.runner.setNextRequest('01. POST Get Offer');
            } else {
              console.log('[INFO] ✅ No more scenarios — stopping run');
              bru.runner.stopExecution();
            }
          }
          return;
        }
        displayOfferResponse(jsonData);

        //swaggerSchemaValidatorContent();

        // ── OSDM compliance (Layer 1): offer-time AncillaryOfferPart shape (#108) ──
        // No-op for offers without ancillaries; validates id/type/category on the
        // selected offer's ancillaryOfferParts when present (e.g. Sqills).
        const { validateAncillaryOfferParts } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
        validateAncillaryOfferParts(bru.getEnvVar("offer"), '/offers → ancillaryOfferParts').forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // ── Place-selection routing (issue #104) ──────────────────────────────
        // Pre-booking seat map (SEATMAP_AT_OFFER) runs only when the scenario
        // opted into Place selection AND chose the SEATMAP_AT_OFFER mode (both
        // authorised by the Test Framework, issue #107). Legacy requiresPlaceSelection
        // is kept as an OR-fallback for backward compatibility. When the gate is
        // off (every current scenario) we route straight to Create Booking and
        // set skipPlaceMaps — the historic behaviour, unchanged.
        // ── Two-step return (#178) ────────────────────────────────────────────
        // On the OUTBOUND offer of a return scenario, capture the chosen outbound
        // offer and route to the inward (return) offer step BEFORE booking.
        // Detected from the outbound tripSearchCriteria's
        // returnSearchParameters.inwardReturnDate (SEARCH returns only).
        const _isReturn = (function () {
          try {
            const t = JSON.parse(bru.getEnvVar("offerTripSearchCriteria") || "{}");
            return !!(t.returnSearchParameters && t.returnSearchParameters.inwardReturnDate);
          } catch (_) { return false; }
        })();

        if (_isReturn && bru.getEnvVar("__returnInboundDone") !== "true") {
          bru.setEnvVar("outboundOfferId", bru.getEnvVar("offerId"));
          bru.setGlobalEnvVar("skipPlaceMaps", true);
          console.log("[INFO] 🔁 Return scenario — outbound offer captured (" + bru.getEnvVar("offerId") + "); fetching the inward (return) offer.");
          bru.runner.setNextRequest("01b. POST Get Return Offer");
        } else {
          const _psMode   = bru.getEnvVar("placeSelectionMode");
          const _psOptIn  = String(bru.getEnvVar("salesFlow_placeSelection")) === "true";
          const _reqPlace = bru.getEnvVar("requiresPlaceSelection");
          const _runPlaceMap = (_psMode === "SEATMAP_AT_OFFER" && _psOptIn)
                            || (_reqPlace === true || _reqPlace === "true");

          if (_runPlaceMap) {
            bru.setGlobalEnvVar("skipPlaceMaps", false);
            bru.runner.setNextRequest("08. GET Place Maps");
          } else {
            bru.runner.setNextRequest("02. POST Create Booking");
            bru.setGlobalEnvVar("skipPlaceMaps", true);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
