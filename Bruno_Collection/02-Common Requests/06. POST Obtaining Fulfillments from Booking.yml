info:
  name: 06. POST Obtaining Fulfillments from Booking
  type: http
  seq: 6

http:
  method: POST
  url: "{{api_base}}/bookings/{{bookingId}}/fulfillments"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log("⏩ [STEP] Executing request : " + req.getName());

        // #204 EXPIRED-BOOKING TEST: when armed, wait until just past the booking's
        // confirmation deadline, THEN let the fulfillment fire — the after-response
        // asserts the provider rejects it. The deadline is read from a single env
        // var (bookingConfirmationTimeLimit) populated by bookings.js from one of:
        //   1. booking.confirmationTimeLimit (OSDM-standard at booking level)
        //   2. booking.confirmableUntil (Bileto-style at booking level)
        //   3. earliest bookedOffers[].{admissions|reservations|ancillaries}[].confirmableUntil
        //      (Paxone-style — the OSDM schema's actual placement for the field)
        // Skips (with a WARNING) when the wait would overrun the run budget, or
        // when the provider exposes no deadline anywhere.
        if (String(bru.getEnvVar("expiredBookingTest")) === "true") {
          const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
          const limitRaw = bru.getEnvVar("bookingConfirmationTimeLimit");
          const nowMs = Date.now();
          const BUFFER_MS = 15000;       // wait 15s past the deadline to be safely expired
          const POST_MARGIN_MS = 45000;  // leave budget for the fulfillment + GET booking + report
          const hardDeadlineMs = parseInt(bru.getEnvVar("runHardDeadlineMs") || "0", 10) || 0;

          // Per-scenario tester-set budget — when expiredBookingMaxWaitMinutes
          // is set, use it instead of runHardDeadlineMs as the wait budget
          // (the runner has already extended the worker SIGTERM to cover it).
          const maxWaitMin = parseInt(bru.getEnvVar("expiredBookingMaxWaitMinutes") || "0", 10) || 0;
          const perScenarioBudgetEndMs = maxWaitMin > 0 ? (nowMs + maxWaitMin * 60 * 1000) : 0;
          const budgetEndMs = perScenarioBudgetEndMs
            || hardDeadlineMs
            || (nowMs + 480000); // conservative 8-min cap when nothing was injected
          const budgetSource = perScenarioBudgetEndMs
            ? `scenario expiredBookingMaxWaitMinutes=${maxWaitMin}`
            : (hardDeadlineMs ? "server RUN_TIMEOUT_MS" : "conservative 8-min fallback");

          if (!limitRaw) {
            validationLogger("[WARNING] expiredBookingTest: provider returned no booking-level confirmation deadline (neither booking.confirmationTimeLimit nor booking.confirmableUntil) — cannot deterministically test expiry. Proceeding without the expiry assertion.");
            bru.setEnvVar("__expiredBookingArmed", "false");
          } else {
            const limitMs = new Date(limitRaw).getTime();
            const wakeAtMs = limitMs + BUFFER_MS;
            const waitMs = wakeAtMs - nowMs;
            if (isNaN(limitMs)) {
              validationLogger(`[WARNING] expiredBookingTest: confirmationTimeLimit '${limitRaw}' is not a valid date — skipping the expiry assertion.`);
              bru.setEnvVar("__expiredBookingArmed", "false");
            } else if (waitMs <= 0) {
              validationLogger(`[INFO] expiredBookingTest: confirmationTimeLimit already passed (${limitRaw}) — attempting fulfillment now, expecting rejection.`);
              bru.setEnvVar("__expiredBookingArmed", "true");
            } else if ((wakeAtMs + POST_MARGIN_MS) > budgetEndMs) {
              const needS  = Math.ceil((wakeAtMs + POST_MARGIN_MS - nowMs) / 1000);
              const needMin = Math.ceil(needS / 60);
              const hint = perScenarioBudgetEndMs
                ? `Raise the scenario's Max wait to >= ${needMin} min and re-run.`
                : `Set the scenario's Max wait to >= ${needMin} min (or raise RUN_TIMEOUT_MS to >= ${needS}s) and re-run.`;
              validationLogger(`[WARNING] expiredBookingTest SKIPPED: waiting ~${Math.ceil(waitMs/1000)}s until past confirmationTimeLimit (${limitRaw}) would exceed this run's budget (source: ${budgetSource}). ${hint} Proceeding without the expiry assertion.`);
              bru.setEnvVar("__expiredBookingArmed", "false");
            } else {
              validationLogger(`[INFO] expiredBookingTest: waiting ~${Math.ceil(waitMs/1000)}s until just past confirmationTimeLimit (${limitRaw}) before attempting fulfillment... (budget source: ${budgetSource})`);
              await new Promise((r) => setTimeout(r, waitMs));
              validationLogger(`[INFO] expiredBookingTest: wait complete — refreshing access token before attempting fulfillment.`);

              // #204 token-TTL fix: the OAuth access token issued at run start
              // may have expired during the long wait — Paxone returned 403
              // "not authenticated" on the late POST /fulfillments, masking
              // the booking-expiry semantics the test is grading. Call OSCAR's
              // loopback refresh-access-token endpoint (force=true) to obtain
              // a fresh token and replace {{access_token}} in this env before
              // Bruno fires the request.
              const _runId           = bru.getEnvVar("__runId");
              const _loopbackBase    = bru.getEnvVar("oscar_loopback_base") || "http://127.0.0.1:3001";
              if (_runId) {
                try {
                  const _refreshUrl = `${_loopbackBase}/v1/runs/${_runId}/refresh-access-token`;
                  const _resp = await new Promise((resolve, reject) => {
                    bru.sendRequest(
                      { url: _refreshUrl, method: "POST", proxy: false, headers: { "Content-Type": "application/json" } },
                      (err, res) => { if (err) reject(err); else resolve(res); }
                    );
                  });
                  const _status = (_resp && (_resp.status || _resp.statusCode)) || 0;
                  let _body;
                  try {
                    _body = typeof _resp.body === "string" ? JSON.parse(_resp.body) : (_resp.body || _resp.data || null);
                  } catch (_) { _body = null; }
                  if (_status >= 200 && _status < 300 && _body && _body.access_token) {
                    bru.setEnvVar("access_token", _body.access_token);
                    validationLogger(`[INFO] expiredBookingTest: access_token refreshed via OSCAR loopback endpoint — fulfillment will use the fresh token.`);
                  } else {
                    validationLogger(`[WARNING] expiredBookingTest: token-refresh endpoint returned ${_status} — fulfillment will use the original (possibly expired) token. The provider may reject with 401/403; if so, distinguish auth failure from booking-expiry failure in the report.`);
                  }
                } catch (_e) {
                  const _msg = (_e && _e.message) ? _e.message : String(_e);
                  validationLogger(`[WARNING] expiredBookingTest: token-refresh request failed (${_msg}) — fulfillment will use the original (possibly expired) token.`);
                }
              } else {
                validationLogger(`[WARNING] expiredBookingTest: __runId env var is not set — cannot call the OSCAR loopback refresh endpoint. Fulfillment will use the original token (may have expired during the wait).`);
              }

              validationLogger(`[INFO] expiredBookingTest: attempting fulfillment, expecting the provider to reject it (booking expired).`);
              bru.setEnvVar("__expiredBookingArmed", "true");
            }
          }
        }
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { validateFulfillments } = require(bru.getEnvVar("library_base")+"bookings.js");

        // #204 EXPIRED-BOOKING: if the wait armed the test, the fulfillment MUST be
        // rejected — an expired booking must not be fulfillable. Grade the rejection
        // and fall through to 07. GET Booking after Fulfillments to verify the
        // admissions/reservations are EXPIRED/RELEASED/CANCELLED.
        if (String(bru.getEnvVar("__expiredBookingArmed")) === "true") {
            const _status = res.getStatus();
            let _body; try { _body = res.getBody(); } catch (_e) { _body = null; }
            const _isClientError = _status >= 400 && _status < 500;
            test(`Expired booking: fulfillment is rejected with a client error (4xx) — an expired booking must not be fulfillable (got ${_status})`, () => {
                expect(_isClientError, `expected a 4xx rejection, got ${_status}`).to.be.true;
            });
            if (_status === 401 || _status === 403) {
                // #204: a 401/403 typically means the OAuth access token expired
                // DURING the long wait (auth problem), NOT that the booking was
                // rejected for being expired. 06.yml's before-request refreshes
                // the token from the OSCAR loopback endpoint after the wait; if
                // we still see auth failure here the refresh probably failed.
                // Flag explicitly so the tester doesn't read "rejection" as
                // "test passed" when the provider never got to evaluate the booking.
                validationLogger(`[WARNING] Expired booking: provider returned ${_status} (auth error) — this typically means the access token expired during the long wait, not that the booking was rejected for being expired. Look for an earlier "[WARNING] expiredBookingTest: token-refresh ..." line; if the refresh failed, the OSCAR loopback endpoint at /v1/runs/{id}/refresh-access-token did not return a fresh token. Distinguishing this from a genuine booking-expiry rejection requires a re-run with a successful refresh.`);
            } else if (_status >= 400) {
                const _isObj = _body !== null && typeof _body === "object";
                const _hasMsg = _isObj && (_body.title || _body.detail || _body.code);
                test("Expired booking: error body is an RFC-9457 Problem (title/detail/code present)", () => {
                    expect(!!_hasMsg, "response body did not contain title/detail/code").to.be.true;
                });
                const _blob = _isObj ? JSON.stringify(_body).toLowerCase() : "";
                if (/expir|time ?limit|deadline|too late|no longer|timed? ?out/.test(_blob)) {
                    validationLogger("[INFO] Expired booking: the error message indicates the booking/confirmation expired.");
                } else {
                    validationLogger("[WARNING] Expired booking: the provider rejected the fulfillment but the error does not clearly indicate expiry — recommended for diagnosability.");
                }
            } else {
                validationLogger(`[ERROR] Expired booking: provider returned ${_status} and may have FULFILLED an expired booking — this should have been rejected.`);
            }
            // Continue to 07 (GET booking) to assert the parts are expired/released.
            return;
        }

        // Validate HTTP response status
        test('Status code is 200 or 202', () => {
            expect([200, 202]).to.include(res.getStatus());
        });

        if (![200, 202].includes(res.getStatus())) {
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Obtaining Fulfillments");
            return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Obtaining Fulfillments (JSON parse)");
            return;
        }

        // #253: pass the sibling FulfillmentResponse.fulfillmentDocuments[] (v3.8)
        // so each fulfillment.fulfillmentDocumentRef can be checked against its sibling id.
        validateFulfillments(jsonData.fulfillments, 0, expectedFulfillmentStatus=["FULFILLED", "CONFIRMED"], false, jsonData.fulfillmentDocuments)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
