opencollection: 1.0.0

info:
  name: OTST_V2.0.1_RFND_EXCH_ALL
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: |-
        /*
        Copyright UIC, Union Internationale des Chemins de fer
        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.

        No reproduction nor distribution shall be allowed without the following notice
        “This material is copyrighted by UIC, Union Internationale des Chemins de fer © 2023  – 2024 , OSDM is a trademark belonging to UIC, and any use of this trademark is strictly prohibited unless otherwise agreed by UIC.”
        */

        // ── SMART RUN FILTER + MAIN BEFORE-REQUEST ────────────────────────────
        // Labeled block: break RUNSCRIPT jumps to the closing brace, skipping
        // all remaining bru.* calls.  This is critical because bru.runner.skipRequest()
        // clears the bru context — any bru.getEnvVar() call after it returns undefined.
        // By calling skipRequest() as the LAST statement before break, we avoid that.
        //
        // ACCESS TOKEN filter
        //   Only the token whose name contains the active sandbox name runs.
        //   e.g. active env = OTST_Chaps_Env → only "Chaps access Token" executes.
        //
        // SCENARIO FOLDER filter (driven by scenarioType env var)
        //   SALE          → Common Requests only (Place Map excluded)
        //   SALE+PLACEMAP → Common Requests incl. Place Map
        //   REFUND        → Common Requests + Refund  (Exchange excluded)
        //   EXCHANGE      → Common Requests + Exchange (Refund excluded)
        RUNSCRIPT: {

        // ── 0. OSCAR credential seeding (#306) ───────────────────────────────
        // The OSCAR runner no longer writes credentials into the ephemeral env
        // yml on disk; it hands them to the Bruno child process via its
        // environment (OSCAR_ACCESS_TOKEN / OSCAR_SUBSCRIPTION_KEY /
        // OSCAR_OAUTH_EXTRA). Seed each runtime var only while it is still
        // empty — a token refreshed mid-run via the OSCAR loopback (#204,
        // auth.js) must never be clobbered by the stale spawn-time value.
        // Standalone Bruno (no OSCAR_* env vars) is a strict no-op.
        try {
          var _pTok = bru.getProcessEnv('OSCAR_ACCESS_TOKEN');
          if (_pTok && !bru.getEnvVar('access_token')) bru.setEnvVar('access_token', _pTok);
          var _pSub = bru.getProcessEnv('OSCAR_SUBSCRIPTION_KEY');
          if (_pSub && !bru.getEnvVar('Ocp-Apim-Subscription-Key')) bru.setEnvVar('Ocp-Apim-Subscription-Key', _pSub);
          var _pXtr = bru.getProcessEnv('OSCAR_OAUTH_EXTRA');
          if (_pXtr) {
            if (!bru.getEnvVar('oauth_extra'))     bru.setEnvVar('oauth_extra', _pXtr);
            if (!bru.getEnvVar('auth_key_secret')) bru.setEnvVar('auth_key_secret', _pXtr);
          }
        } catch (_credErr) {
          console.log('[WARNING] OSCAR credential seeding from process env failed: ' + (_credErr && _credErr.message));
        }

        // ── Per-request console capture for HTML report ─────────────────────
        // Captures console.log/warn/error messages emitted during this request
        // so they can be rendered in the request "Console Log" sub-section.
        try {
          bru.setVar('__rptLogs', '[]');

          if (!globalThis.__rptConsolePatched) {
            const _origLog = console.log.bind(console);
            const _origWarn = console.warn ? console.warn.bind(console) : _origLog;
            const _origError = console.error ? console.error.bind(console) : _origLog;

            globalThis.__rptOrigConsole = {
              log: _origLog,
              warn: _origWarn,
              error: _origError
            };

            function _capture(level, args) {
              try {
                const msg = args.map(a => {
                  if (typeof a === 'string') return a;
                  try { return JSON.stringify(a); } catch (_e) { return String(a); }
                }).join(' ');

                const existing = JSON.parse(bru.getVar('__rptLogs') || '[]');
                existing.push({ level, message: msg });
                bru.setVar('__rptLogs', JSON.stringify(existing));
              } catch (_e) {
                // Never block request execution on log capture issues
              }
            }

            console.log = function () {
              const args = Array.from(arguments);
              _capture('log', args);
              return _origLog.apply(console, args);
            };
            console.warn = function () {
              const args = Array.from(arguments);
              _capture('warn', args);
              return _origWarn.apply(console, args);
            };
            console.error = function () {
              const args = Array.from(arguments);
              _capture('error', args);
              return _origError.apply(console, args);
            };

            globalThis.__rptConsolePatched = true;
          }
        } catch (_lcErr) {
          // Continue without console capture if sandbox blocks patching
        }

        // ── 1. Smart run filter ───────────────────────────────────────────────
        try {
          var _rn = ''; try { _rn = String(req.getName()).toLowerCase(); } catch (_e) {}
          var _ru = String(req.getUrl ? req.getUrl() : (req.url || '')).toLowerCase();
          var _sandbox = String(typeof bru.getEnvName === 'function' ? bru.getEnvName() : '')
                           .replace(/^OTST_/i, '').replace(/_Env$/i, '').toLowerCase();

          var _isToken    = _rn.includes('token') || _rn.includes('access');
          var _isPlaceMap = _ru.includes('place-map') || _rn.includes('place map');
          // Two seat-map variants share the /availabilities/place-map endpoint
          // (#184): the OFFER-context map (08, pre-booking) and the
          // BOOKING-context map (08b, post-booking). Detect the post-booking one
          // by its contextType=BOOKING query (or its name) so the two are gated
          // independently below.
          var _isPostBookingPlaceMap = _isPlaceMap && (_ru.includes('contexttype=booking') || _rn.includes('post-booking'));
          var _isOfferPlaceMap = _isPlaceMap && !_isPostBookingPlaceMap;
          var _isAddReservation = _rn.includes('add reservation');
          var _isAddAncillary   = _rn.includes('add ancillary');
          var _isPurchaserGet   = _rn.includes('get booking purchaser');
          var _isPurchaserPatch = _rn.includes('patch booking purchaser');
          var _isPurchaserPost  = _rn.includes('post booking purchaser');
          var _isPurchaserStep  = _isPurchaserGet || _isPurchaserPatch || _isPurchaserPost;
          var _isReturnOffer    = _rn.includes('return offer');
          var _isRefund   = _ru.includes('refund')   && !_isToken;
          var _isExchange = _ru.includes('exchange') && !_isToken;
          var _st         = (bru.getEnvVar('scenarioType') || '').toUpperCase().trim();

          // Two-step return (#178): the inward "01b. POST Get Return Offer" step
          // runs only for return scenarios — detected from the outbound
          // tripSearchCriteria the scenarioParser built (returnSearchParameters
          // .inwardReturnDate). For one-way scenarios it is skipped wherever it
          // sits in the flow.
          var _isReturnScenario = (function () {
            try {
              var _t = JSON.parse(bru.getEnvVar('offerTripSearchCriteria') || '{}');
              return !!(_t.returnSearchParameters && _t.returnSearchParameters.inwardReturnDate);
            } catch (_e) { return false; }
          })();

          // Place maps run only when the scenario enabled Place selection in the
          // SEATMAP_AT_OFFER mode (issues #104/#107); legacy requiresPlaceSelection
          // and the SALE+PLACEMAP scenario type are kept as OR-fallbacks. When the
          // gate is off (every current scenario) the place-map request is skipped
          // wherever it sits in the flow.
          var _runPlaceMap = (bru.getEnvVar('placeSelectionMode') === 'SEATMAP_AT_OFFER'
                               && String(bru.getEnvVar('salesFlow_placeSelection')) === 'true')
                          || (bru.getEnvVar('requiresPlaceSelection') === true || bru.getEnvVar('requiresPlaceSelection') === 'true')
                          || _st === 'SALE+PLACEMAP';

          // Post-booking add-reservation runs only in ADD_TO_BOOKING mode
          // (issues #104 Stage B / #107), and only once per scenario.
          // Adaptive fallback (#182): also runs when the pre-booking seat map
          // failed at offer time (08. GET Place Maps set __placeMapAtOfferFailed)
          // — the seat is then selected AFTER pre-booking via add-reservation.
          var _runAddReservation = ((bru.getEnvVar('placeSelectionMode') === 'ADD_TO_BOOKING')
                                    || bru.getEnvVar('__placeMapAtOfferFailed') === 'true')
                                 && String(bru.getEnvVar('salesFlow_placeSelection')) === 'true';

          // Post-booking add-ancillary runs only when the scenario enabled it
          // (salesFlow_addAncillary, authorised by the framework #107), once.
          var _runAddAncillary = String(bru.getEnvVar('salesFlow_addAncillary')) === 'true';

          // Post-booking purchaser step (#258 / #203) runs only when the scenario
          // deferred the purchaser ('deferred' supplies it, 'invalid' probes it).
          // 'inline' (default) and 'omit' never run the dedicated step.
          var _purMode = String(bru.getEnvVar('bookingPurchaserMode') || 'inline').toLowerCase();
          var _runPurchaserStep = (_purMode === 'deferred' || _purMode === 'invalid');
          // The GET probe (12) decides create-vs-update and sets the method; the
          // two write steps run only for the method the probe selected.
          var _purWriteMethod = String(bru.getEnvVar('__purchaserWriteMethod') || '');

          var _skipReason = null;
          if (_isToken && _sandbox && _rn && !_rn.includes(_sandbox)) {
            // Log-audit round 2: on OSCAR the env name is the company env
            // ("bileto-sandbox_afc035bc"), which never contains a vendor word
            // like "bileto access token" → ALL manual vendor token requests
            // skip here, including the one matching the company's own vendor.
            // That is CORRECT (the runner injects access_token fetched
            // server-side from the API Config credentials) but the old
            // wording — 'not for "bileto-sandbox_…" sandbox' — read as a
            // sandbox-matching bug. Say what actually happened, and pick the
            // standalone-Bruno wording only when no token was pre-provided.
            _skipReason = bru.getEnvVar('access_token')
              ? 'access token already provided by OSCAR (server-side OAuth from API Config) — manual vendor token requests never run on OSCAR'
              : 'vendor token request for a different sandbox (env "' + _sandbox + '") — runs only in standalone Bruno with the matching vendor env';
          } else if (_isOfferPlaceMap && !_runPlaceMap)                  { _skipReason = 'place selection not enabled (SEATMAP_AT_OFFER)'; }
            else if (_isOfferPlaceMap && bru.getEnvVar('bookingId'))      { _skipReason = 'offer-context place map is pre-booking only (booking already created)'; }
            else if (_isPostBookingPlaceMap && !_runAddReservation)       { _skipReason = 'post-booking place map not enabled (ADD_TO_BOOKING / #182 fallback)'; }
            else if (_isPostBookingPlaceMap && !bru.getEnvVar('bookingId')) { _skipReason = 'post-booking place map needs a booking first'; }
            else if (_isPostBookingPlaceMap && bru.getEnvVar('__postBookingPlaceMapDone') === 'true') { _skipReason = 'post-booking place map already done this scenario'; }
            else if (_isPlaceMap && !bru.getEnvVar('reservationId')) { _skipReason = 'no reservation offer-part in this offer — seat map not applicable (resourceId would be unresolved)'; }
            else if (_isAddReservation && !_runAddReservation)            { _skipReason = 'add-reservation not enabled (ADD_TO_BOOKING)'; }
            else if (_isAddReservation && bru.getEnvVar('__addReservationDone') === 'true') { _skipReason = 'add-reservation already done this scenario'; }
            else if (_isAddAncillary && !_runAddAncillary)                { _skipReason = 'add-ancillary not enabled (salesFlow_addAncillary)'; }
            else if (_isAddAncillary && bru.getEnvVar('__addAncillaryDone') === 'true') { _skipReason = 'add-ancillary already done this scenario'; }
            else if (_isPurchaserStep && !_runPurchaserStep)              { _skipReason = 'purchaser step not enabled (bookingPurchaserMode is inline/omit)'; }
            else if (_isPurchaserStep && !bru.getEnvVar('bookingId'))     { _skipReason = 'purchaser step needs a booking first'; }
            else if (_isPurchaserStep && bru.getEnvVar('__purchaserStepDone') === 'true') { _skipReason = 'purchaser step already done this scenario'; }
            else if (_isPurchaserPatch && _purWriteMethod !== 'PATCH')    { _skipReason = 'purchaser exists-check selected POST (or has not run yet)'; }
            else if (_isPurchaserPost && _purWriteMethod !== 'POST')      { _skipReason = 'purchaser exists-check selected PATCH (or has not run yet)'; }
            else if (_isReturnOffer && !_isReturnScenario)                { _skipReason = 'not a return-trip scenario'; }
            else if (_isReturnOffer && bru.getEnvVar('__returnInboundDone') === 'true') { _skipReason = 'inward (return) offer already fetched this scenario'; }
            else if (_st === 'SALE'         && (_isRefund || _isExchange)) { _skipReason = 'not in SALE scope'; }
            else if (_st === 'SALE+PLACEMAP' && (_isRefund || _isExchange)) { _skipReason = 'not in SALE+PLACEMAP scope'; }
            else if (_st === 'REFUND'        && _isExchange)               { _skipReason = 'Exchange excluded for REFUND scenario'; }
            else if (_st === 'EXCHANGE'      && _isRefund)                 { _skipReason = 'Refund excluded for EXCHANGE scenario'; }

          if (_skipReason) {
            // Token skips are routine plumbing (6 of them at the top of every
            // OSCAR run) — the tester doesn't act on them → [DEBUG]. The other
            // skip reasons SHAPE the test flow (scope gates, place-map modes,
            // purchaser steps) and stay [INFO] so the report explains why a
            // step is absent.
            // #355: respect the dataset loggingType — this direct console.log
            // bypassed the validationLogger pyramid, so the [DEBUG] token
            // skips still appeared on INFO-typed runs.
            const _lt = String(bru.getEnvVar('loggingType') || 'INFO').toUpperCase();
            const _debugOn = _lt === 'DEBUG' || _lt === 'FULL';
            if (!_isToken || _debugOn) {
              console.log((_isToken ? '[DEBUG]' : '[INFO]') + ' ⏭️  Skipping [' + (_rn || _ru) + '] — ' + _skipReason);
            }
            // skipRequest() MUST be the last bru call — it clears the bru context.
            // break RUNSCRIPT immediately after so no further bru.* calls run.
            if (bru.runner && typeof bru.runner.skipRequest === 'function') bru.runner.skipRequest();
            break RUNSCRIPT;
          }
        } catch (_sfErr) {
          console.log('[INFO] Smart run filter error: ' + (_sfErr && _sfErr.message));
        }

        // ── 2. Normal before-request (only reaches here for non-skipped requests) ──

        const { getScenarioData } = require(bru.getEnvVar("library_base") + "scenarioParser.js");

        // ── Reset test accumulator for this request ───────────────────────────
        // bruTest() in library files accumulates results into bru.setVar('__rptTests').
        // bru.setVar is shared across ALL script phases for a single request,
        // so the global after-response can read everything that ran.
        try {
          const { resetTests } = require(bru.getEnvVar("library_base") + "testCapture.js");
          resetTests();
        } catch (_te) { bru.setVar('__rptTests', '[]'); }

        // ── Init HTML report at scenario start (/versions), with safe fallback ──
        // This prevents report entries from previous scenarios leaking into the
        // current scenario HTML when multiple scenarios run in sequence.
        try {
          const _rqName = String(req.getName ? req.getName() : '').toLowerCase();
          const _rqUrl = String(req.getUrl ? req.getUrl() : (req.url || '')).toLowerCase();
          const _isScenarioStart = /\/versions(\?|$)/.test(_rqUrl)
            || _rqName.includes('system version check');

          // ── __reportInitDone uses setEnvVar (not setVar) so it persists across ALL
          // requests within a single run.  bru.setVar is request-scoped and would
          // reset to undefined between requests, causing initReport() — and the
          // destructive .report_tmp.json delete — to fire on every request instead
          // of only once at the /versions scenario-start.
          if (_isScenarioStart || bru.getEnvVar('__reportInitDone') !== 'true') {
            if (_isScenarioStart) {
              // ── Full env reset + scenario data pre-load at collection start ──
              // Calling getScenarioData() here (not at /offers) ensures osdmVersion
              // is set before 00. GET System Version Check executes (seq:0).
              console.log("🛠️  New Collection Execution — clearing env vars and loading scenario data...");
              const _deleteList = [
                // Scenario / trip
                "loggingType", "scenarioType", "scenarioAction", "osdmVersion", "stepFailurePolicy",
                "selectedAccommodation",
                "desiredFlexibility", "accommodationSelection", "accommodationGenderPreference", "bookMandatoryReservations", "optionalReservationSelections", "requiresPlaceSelection",
                "overruleCode", "refundDate", "TripType",
                "tripStartStopPlaceRef", "tripEndStopPlaceRef", "tripStartDatetime", "tripEndDatetime",
                "tripOperatorCode", "tripVehicleNumber", "tripProductCategoryRef",
                "tripProductCategoryName", "tripProductCategoryShortName",
                // Offer
                "offer", "offerId", "offers", "OfferCollectionRequest",
                "offerSearchCriteria", "offerTripSearchCriteria", "offerTripSpecifications",
                "offerFulfillmentOptions", "offerPassengerSpecifications",
                // Two-step return (#178/#180)
                "outboundOfferId", "inboundOfferId", "outboundOfferTag",
                "ReturnOfferCollectionRequest", "__returnInboundDone",
                "outboundBookingId", "__returnBookMode",
                "admissionReservationAncillaryOfferPartsIds",
                "admissionReservationAncillaryOfferPartsAftersalesConditions",
                "overallFlexibility", "coveredTripId", "minimalPrice",
                "admissionPartsPrice", "reservationPartsPrice", "ancillaryPartsPrice",
                "referencedAncillaryIds", "passengerCount",
                // Booking
                "BookingRequest", "bookingId", "bookedOfferId", "__addReservationDone", "__addAncillaryDone",
                "addAncillaryParentOfferId", "addAncillaryOfferIds",
                "admissionReservationAncillaryBookingPartsIds",
                "provisionalPrice", "provisionalPriceAmount",
                "confirmedPriceAmount", "bookingConfirmedPrice",
                // Passengers
                "passengerIdList", "passengerId", "passengerSpecificationExternalRef",
                "passengerAdditionalData", "bookingPassengerSpecifications",
                "bookingPassengerReferences", "bookingPurchaserSpecifications",
                "currentPassengerIndex", "skipPatchPassengerRequest",
                "patchDateOfBirth", "patchFirstName", "patchLastName",
                "patchEmail", "patchPhoneNumber", "patchGender",
                // Place selection
                "placeSelectionMode", "__placeMapAtOfferFailed", "__postBookingPlaceMapDone",
                "placeSelections", "layoutId", "preselectedCoach", "preselectedPlace", "preselectedPlaces",
                "reservationId", "reservationIds", "tripLegCoverage",
                "placeSelectionProbes", "__placeProbeIndex", "placeProbeTarget", "__placeProbeSkipWarned",
                "__bookingFindingKeys",
                // Fulfillment
                "fulfillmentIds",
                // Exchange / Refund
                "exchangeOffersOfferId", "exchangeOperationId",
                "requestExchangeOffersBodyData", "requestExchangeOperationsBodyData",
                "refundOffersOfferId", "refundRefundAmount", "refundFee", "isRefundConfirmed",
                "requestRefundOffersBodyData",
                // Partial refund (#218) — runtime-only side channels
                "__bookingForRefund",
                "__partialRefundDegradedToFull", "__partialRefundResolvedSpec",
                "__partialRefundExpectedAmount", "__partialRefundExpectedPartIds",
                "__partialRefundScopeFulfillmentId",
                "__refundOfferRetryCount",
                "afterSaleCondition_EXCHANGE_amount", "afterSaleCondition_EXCHANGE_currency", "afterSaleCondition_EXCHANGE_scale",
                "afterSaleCondition_REFUND_amount",   "afterSaleCondition_REFUND_currency",   "afterSaleCondition_REFUND_scale",
                // Misc
                "data_base_tmp", "scriptContent", "swaggerJson",
                "scenarioCode"
              ];
              _deleteList.forEach(key => bru.deleteEnvVar(key));
              console.log("✅ All environment variables cleared");
              // ── Always restart from scenario 0 on every fresh collection run ───
              // Multi-scenario mode: every "Run Collection" click iterates through
              // ALL scenarios in scenariosToRun from the beginning.
              // Reset the loop flag and the index so the run always starts clean.
              bru.setEnvVar('scenariosToRunIndex', '0');
              bru.setEnvVar('__loopback', null);
              console.log('[INFO] Multi-scenario run initialised — scenariosToRunIndex reset to 0');
              try {
                await getScenarioData();
                console.log("✅ Scenario data loaded — osdmVersion: " + (bru.getEnvVar("osdmVersion") || "not set"));
              } catch (_gsErr) {
                console.log("[WARNING] getScenarioData at collection start failed: " + (_gsErr && _gsErr.message));
              }
            }

            const { initReport } = require(bru.getEnvVar("library_base") + "reportGenerator.js");
            initReport(bru.getEnvVar("library_base"));
            bru.setEnvVar('__reportInitDone', 'true');  // persists across requests in this run
            console.log(_isScenarioStart
              ? "📊 HTML report initialised for this scenario."
              : "📊 HTML report initialised for this run.");
          }
        } catch (_rErr) {
          console.log("[WARNING] Report init error: " + (_rErr && _rErr.message));
        }

        // ── Load scenario data for unitary runs (no /versions trigger) ───────
        // When a single OSDM request is run outside a full collection run,
        // getScenarioData() never fires via the /versions route.
        // Fires when:
        //   - scenarioCode is not set yet (first Send after env load), OR
        //   - scenariosToRunIndex changed since the last unitary load
        //     (user manually set a different index to pick a specific scenario).
        // The index is NOT advanced — repeated "Send" on the same request re-runs
        // the same scenario. The user must change scenariosToRunIndex manually
        // to switch to a different scenario in unitary mode.
        try {
          const _rqUrlForScenario = String(req.getUrl ? req.getUrl() : (req.url || '')).toLowerCase();
          const _rqNameForScenario = String(req.getName ? req.getName() : '').toLowerCase();
          const _isAuthReq = /\/(token|login|auth|logon|oauth)/.test(_rqUrlForScenario)
            || _rqNameForScenario.includes('token') || _rqNameForScenario.includes('access');

          let   _idxNow = bru.getEnvVar('scenariosToRunIndex') || '0';
          const _targetNow = (bru.getEnvVar('scenarioTarget') || '').trim();
          const _lastUnitaryIdx = bru.getEnvVar('__unitaryLoadedIdx');
          const _lastUnitaryTarget = bru.getEnvVar('__unitaryLoadedTarget') || '';
          const _isScenarioStartLocal = /\/versions(\?|$)/.test(_rqUrlForScenario)
            || _rqNameForScenario.includes('system version check');

          // Reload when:
          //   - scenarioCode not yet set (first Send after env load), OR
          //   - scenarioTarget changed (user typed a new name/index), OR
          //   - scenarioTarget is empty AND scenariosToRunIndex changed
          const _needsLoad = !bru.getEnvVar('scenarioCode')
            || (_targetNow !== '' && _targetNow !== _lastUnitaryTarget)
            || (_targetNow === '' && _lastUnitaryIdx !== _idxNow);

          if (!_isAuthReq && !_isScenarioStartLocal && _needsLoad) {
            // Defensive clamp: if scenariosToRunIndex is at or past the end of
            // __scenariosList (typically because /versions just advanced it on
            // a 1-scenario list), reset it to 0 BEFORE calling getScenarioData.
            // Without this, getScenarioData() detects idx >= length and calls
            // bru.runner.stopExecution(), which halts every subsequent request
            // in the run — observed on Bileto/Sqills where the run silently
            // truncated after /coach-deck-layouts. Only applies in sequential
            // mode; scenarioTarget mode looks up by name/explicit index and
            // does not depend on scenariosToRunIndex being in-range.
            if (_targetNow === '') {
              try {
                const _scList0 = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
                const _idxInt = parseInt(_idxNow, 10) || 0;
                if (_scList0.length > 0 && _idxInt >= _scList0.length) {
                  bru.setEnvVar('scenariosToRunIndex', '0');
                  _idxNow = '0';
                  console.log('[INFO] ↩ scenariosToRunIndex was at/past end of __scenariosList — clamped to 0 before unitary load');
                }
              } catch (_ce) { /* ignore — fallthrough lets getScenarioData handle malformed list */ }
            }

            const _loadDesc = _targetNow !== '' ? ('target="' + _targetNow + '"') : ('index ' + _idxNow);
            console.log('[INFO] 🔄 Loading scenario for unitary run (' + _loadDesc + ')...');
            await getScenarioData();
            if (_targetNow !== '') {
              // scenarioTarget mode: never advance the index — same scenario re-runs
              // until the user changes scenarioTarget.
              bru.setEnvVar('scenariosToRunIndex', _idxNow);
            }
            // v1.11.10: the previous wrap-to-0 branch was REMOVED here. In an
            // OSCAR collection run, the terminal .bru steps (e.g. "14. GET
            // Booking after Patch Refund") and the multi-scenario loop-back in
            // loopback.js / "01. POST Get Offer" decide between looping back
            // and stopping by comparing `scenariosToRunIndex < __scenariosList.length`.
            // Wrapping the index back to 0 here defeated that check: the
            // condition was always true and the run looped forever, only
            // ending via SIGTERM from RUN_TIMEOUT_MS (which also prevented
            // Bruno from flushing its --reporter-json file, breaking the
            // JSON download). For unitary Bruno-UI use it is acceptable for
            // the index to grow past the list length: the parseScenarioData()
            // branch in scenarioParser.js handles "idx >= length" by either
            // calling stopExecution() (multi-scenario completed) or wrapping
            // to 0 (fresh / unitary). Letting that branch own the decision
            // keeps the OSCAR runner's terminal-stop machinery working.
            // Store _idxNow (the index that was CONSUMED), NOT the post-load value.
            // This way the next Send sees _idxNow !== _lastUnitaryIdx and reloads.
            bru.setEnvVar('__unitaryLoadedIdx', _idxNow);
            bru.setEnvVar('__unitaryLoadedTarget', _targetNow);
            console.log('[INFO] ✅ Unitary run — scenario loaded: ' + bru.getEnvVar('scenarioCode') + ' (' + _loadDesc + ') — next index: ' + bru.getEnvVar('scenariosToRunIndex'));
          }
        } catch (_uErr) {
          console.log('[WARNING] Unitary run scenario load: ' + (_uErr && _uErr.message));
        }

        // Env-sanity guards (api_base / library_base / data_base).
        // Log-audit round 2: these used to register three PASSING tests on
        // EVERY request — 3 "✓ … is available" rows under Pre-Request Tests
        // PLUS 3 bare console echoes, ×~21 requests ≈ 120+ identical lines
        // per run, and 3×21 filler assertions inflating every report count.
        // Now: silent per-request check; the environment is announced ONCE
        // per run at [INFO]; a test is registered ONLY when a variable is
        // actually missing — failing exactly where it broke, with the fix
        // path in the message.
        {
          const _envSanity = [
            ['api_base',     'API base',     'check API Config → Company API Endpoint'],
            ['library_base', 'Library base', 'collection environment issue — library_base should be ./library-bruno/'],
            ['data_base',    'Data file',    'check the company data file (Test Config) / data_base env var'],
          ];
          const _missing = _envSanity.filter(([k]) => {
            const v = bru.getEnvVar(k);
            return v == null || v === '';
          });
          if (_missing.length > 0) {
            _missing.forEach(([k, label, fix]) => {
              test(`${label} env var "${k}" is set`, function () {
                throw new Error(`${label} ("${k}") is not set — ${fix}.`);
              });
            });
          } else if (bru.getEnvVar('__envSanityAnnounced') !== 'true') {
            bru.setEnvVar('__envSanityAnnounced', 'true');
            console.log(`[INFO] Environment OK — API: ${bru.getEnvVar("api_base")} | data file: ${bru.getEnvVar("data_base")} | library: ${bru.getEnvVar("library_base")}`);
          }
        }

        // Initialise scenario data only on the root collection offer search endpoint.
        // Using a broad "/offers" match also catches "/refund-offers" and
        // "/exchange-offers", which would wrongly advance scenariosToRunIndex
        // again within the same collection run.
        if (/\/offers(\?|$)/.test(req.getUrl().toString().toLowerCase())) {
            // Scenario data was already loaded at collection start (/versions).
            // Only log the milestone here for traceability.
            console.log(`
            ####################################
            # 🛠️  POST Get Offer — ${bru.getEnvVar("scenarioCode") || "N/A"} 🛠️ #
            ####################################
            `);
        }

        // SBB OSDM REQUIRED HEADERS
        if (bru.getEnvVar("API") === "SBB") {
            req.setHeader('accept-language', 'en');
            req.setHeader('traceparent', bru.getEnvVar("traceparent"));
            req.setHeader('tracestate', bru.getEnvVar("tracestate"));
        }

        // Azure APIM subscription key — required by some sandboxes (e.g. Benerail)
        // Injected on every request when the env variable is set and non-empty.
        const _subscriptionKey = bru.getEnvVar("Ocp-Apim-Subscription-Key");
        if (_subscriptionKey) {
            req.setHeader('Ocp-Apim-Subscription-Key', _subscriptionKey);
        }

        // Dedicated headers (issue #426) — company-wide custom headers configured
        // by the Test Manager in API Config and carried here as JSON in the
        // __extraHeaders env var. Each entry is { name, value }; the value may
        // contain {{var}} templates resolved against the env at send time
        // (e.g. {{requestor}}, {{access_token}}, {{Ocp-Apim-Subscription-Key}}).
        // This generalises the hardcoded subscription-key block above so new
        // operator-specific headers no longer need a collection edit.
        try {
            const _ehRaw = bru.getEnvVar("__extraHeaders");
            if (_ehRaw) {
                const _extraHeaders = JSON.parse(_ehRaw);
                if (Array.isArray(_extraHeaders)) {
                    for (const _hdr of _extraHeaders) {
                        if (!_hdr || !_hdr.name) continue;
                        const _resolved = String(_hdr.value == null ? '' : _hdr.value)
                            .replace(/\{\{\s*([\w.\-]+)\s*\}\}/g, (_m, _k) => {
                                const _v = bru.getEnvVar(_k);
                                return _v == null ? '' : String(_v);
                            });
                        req.setHeader(_hdr.name, _resolved);
                    }
                }
            }
        } catch (_ehErr) {
            console.log('[WARNING] dedicated headers injection failed: ' + (_ehErr && _ehErr.message));
        }

        } // end RUNSCRIPT
    - type: after-response
      code: |-
        // ── Shared response status ────────────────────────────────────────────
        const _rptStatus = res && (typeof res.getStatus === 'function' ? res.getStatus() : res.status);

        // ── #208: auth-rejection fail-fast ────────────────────────────────────
        // A 401/403 on any (non-token) request means the access/bearer token was
        // rejected — typically a stale/expired token pasted in the API config, or
        // rotated OAuth credentials. Stop the run with a clear message rather than
        // cascading the same failure across every following request. We do NOT
        // return early: the report still records THIS request + the failing auth
        // assertion; stopExecution() just prevents the next request from running.
        try {
          const { checkAuthRejection } = require(bru.getEnvVar("library_base") + "auth.js");
          checkAuthRejection(res,
            (req && typeof req.getName === 'function') ? req.getName() : '',
            (req && typeof req.getUrl === 'function') ? String(req.getUrl()) : '');
        } catch (_authGuardErr) { console.log(`[WARNING] auth guard: ${_authGuardErr && _authGuardErr.message}`); }

        // ── H1/H2: run via bruTest so results accumulate in __rptTests ────────
        try {
          const { bruTest: _bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");

          // H1: Content-Type is JSON (OSDM). Accept application/json AND any
          // media type using the +json structured-syntax suffix — the OSDM
          // vendor type application/vnd.uic.osdm+json (with any ;version) and
          // RFC 9457 application/problem+json (error bodies) are all JSON.
          if (_rptStatus && _rptStatus !== 204 && _rptStatus !== 304) {
            const _ct = (res.headers || {})['content-type'] || (res.headers || {})['Content-Type'] || '';
            const _mediaType = String(_ct).split(';')[0].trim().toLowerCase();
            const _isJson = /^application\/(.*\+)?json$/.test(_mediaType);
            _bruTest(`[OSDM] Content-Type is JSON`, () => {
              expect(_isJson, `Expected a JSON media type (application/json or application/...+json), got: '${_ct}'`).to.be.true;
            });
          }

          // H2: RFC 9457 Problem object on error responses (OSDM spec)
          if (_rptStatus && [400, 401, 403, 404, 409, 415, 500, 501, 503].includes(_rptStatus)) {
            let _eb;
            try { _eb = res.json ? res.json() : JSON.parse(res.body || res.getBody()); } catch (_pe) {}
            if (_eb && typeof _eb === 'object') {
              _bruTest(`[OSDM] Error body (${_rptStatus}) is a valid RFC 9457 Problem object`, () => {
                expect(_eb).to.be.an('object');
                expect(_eb.status).to.be.a('number');
                if (_eb.title !== undefined) expect(_eb.title).to.be.a('string').and.not.be.empty;
              });
            }
          }
        } catch (_e) { console.log(`[WARNING] H1/H2 check: ${_e && _e.message}`); }

        // ── HTML Report: append this request/response ─────────────────────────
        // __rptTests was accumulated via bruTest() across ALL script phases for this request.
        try {
          const { appendRequest } = require(bru.getEnvVar("library_base") + "reportGenerator.js");

          const _rawEnvName = (typeof bru.getEnvName === 'function' ? bru.getEnvName() : null)
            || bru.getEnvVar("api_base") || "Unknown";
          const _envName  = _rawEnvName.replace(/^OTST_/i, '').replace(/_Env$/i, '');
          const _dateStr  = new Date().toISOString().slice(0, 10).replace(/-/g, '');
          const _rptMethod = req.getMethod ? req.getMethod() : (req.method || '');
          const _rptUrl    = req.getUrl    ? req.getUrl()    : (req.url    || '');
          const _rptName   = (req && typeof req.getName === 'function' ? req.getName() : '') || '';

          let _rptReqBody = '';
          try { _rptReqBody = req.getBody ? req.getBody() : (req.body || ''); } catch (_be) {}

          let _rptResBody = '';
          try {
            const _rb = res.getBody ? res.getBody() : null;
            _rptResBody = _rb != null ? JSON.stringify(_rb) : (res.body || '');
          } catch (_re) { _rptResBody = res.body || ''; }

          const _isAuth = /\/(token|login|auth|logon|oauth)/.test(_rptUrl.toLowerCase().split('?')[0])
            || /(token|access|auth|login|oauth)/.test(_rptName.toLowerCase());

          // Collect ALL request headers for the report
          let _rptReqHeaders = {};
          try { _rptReqHeaders = req.headers || {}; } catch (_he) {}

          // Read ALL accumulated test results from bru.setVar (survives across all script phases)
          let _testResults = [];
          try { _testResults = JSON.parse(bru.getVar('__rptTests') || '[]'); } catch (_te) {}

          // Read per-request console logs captured in global before-request
          let _consoleLogs = [];
          try { _consoleLogs = JSON.parse(bru.getVar('__rptLogs') || '[]'); } catch (_le) {}

          const _htmlPath = appendRequest({
            envName:        _envName,
            dateStr:        _dateStr,
            scenarioCode:   bru.getEnvVar("scenarioCode")   || '',
            scenarioType:   bru.getEnvVar("scenarioType")   || '',
            scenarioAction: bru.getEnvVar("scenarioAction") || '',
            osdmVersion:    bru.getEnvVar("osdmVersion")    || '',
            requestName:    _rptName
                              || _rptUrl.split('?')[0].split(/\//).filter(Boolean).slice(-1)[0] || _rptMethod,
            requestMethod:  _rptMethod,
            requestUrl:     _rptUrl,
            requestHeaders: _rptReqHeaders,
            requestBody:    _rptReqBody,
            responseStatus: _rptStatus,
            responseHeaders:res.headers || {},
            responseBody:   _rptResBody,
            responseTime:   (res.responseTime != null ? res.responseTime : 0),
            group:          _isAuth ? 'auth' : 'osdm',
            testResults:    _testResults,
            consoleLogs:    _consoleLogs
          });

          // Log-audit round 2: fires after EVERY request (incremental report
          // write) and shows a container-internal path — testers reach the
          // report via the run page's Artifacts section → [DEBUG].
          // #355: gate on the dataset loggingType — this direct console.log
          // bypassed the validationLogger pyramid and appeared on INFO runs.
          const _rptLt = String(bru.getEnvVar('loggingType') || 'INFO').toUpperCase();
          if (_htmlPath && (_rptLt === 'DEBUG' || _rptLt === 'FULL')) {
            console.log(`[DEBUG] 📊 Report updated → ${_htmlPath} (${_testResults.length} assertions)`);
          }
        } catch (_re) {
          console.log(`[WARNING] Report generation error: ${_re && _re.message}`);
        }

docs:
  content: bru run --reporter-html report.html --env SMAPI-DB-OTST_SBB_Env --sandbox=developer
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
