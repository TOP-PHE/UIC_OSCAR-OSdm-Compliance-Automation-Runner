info:
  name: 11. POST Exchange Operations
  type: http
  seq: 2

http:
  method: POST
  url: "{{api_base}}/bookings/{{bookingId}}/exchange-operations"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
    - name: Content-Type2
      value: application/json;version={{osdm-version}}
      disabled: true
  body:
    type: json
    data: "{{requestExchangeOperationsBodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { requestExchangeOperationsBody } = require(bru.getEnvVar("library_base")+"requestsBuilder.js");

        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);

        requestExchangeOperationsBody();

        // #expired-exchange-offer test (Phase 4): when armed, wait until just
        // past the exchangeOffers[0].preBookableUntil (stashed by exchanges.js
        // postPatchExchangeOffersResponse on the prior POST /exchange-offers).
        // OSDM names this field `preBookableUntil` (NOT `validUntil`) — see
        // Deviations doc #25 for the naming-inconsistency context.
        if (String(bru.getEnvVar("expiredExchangeOfferTest")) === "true") {
          const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
          const { planExpiredFlow, runExpiredFlowWait } = require(bru.getEnvVar("library_base") + "expiredFlow.js");
          const limitRaw   = bru.getEnvVar("exchangeOfferPreBookableUntil");
          const limitSrc   = bru.getEnvVar("exchangeOfferPreBookableUntilSource") || "exchange offer preBookableUntil";
          const maxWaitMin = parseInt(bru.getEnvVar("expiredExchangeOfferMaxWaitMinutes") || "0", 10) || 0;
          const plan = planExpiredFlow({
            deadlineRaw:    limitRaw,
            maxWaitMinutes: maxWaitMin,
            resourceLabel:  "exchange offer (" + limitSrc + ")",
          });
          if (!plan.armed) {
            validationLogger(`[WARNING] expiredExchangeOfferTest SKIPPED: ${plan.reason}`);
            bru.setEnvVar("__expiredExchangeOfferArmed", "false");
          } else {
            await runExpiredFlowWait({ plan, deadlineRaw: limitRaw, scenarioLabel: "expiredExchangeOfferTest (POST /exchange-operations)" });
            bru.setEnvVar("__expiredExchangeOfferArmed", "true");
            validationLogger(`[INFO] expiredExchangeOfferTest: attempting POST /exchange-operations, expecting the provider to reject it (exchange offer preBookableUntil passed).`);
          }
        }
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchExchangeOperationsResponse } = require(bru.getEnvVar("library_base")+"exchanges.js");

        // #expired-exchange-offer: when armed, the POST MUST be rejected — an
        // expired (preBookableUntil-passed) exchange offer must not be
        // turnable into a booking. Grade the rejection here and short-circuit
        // (skip postPatchExchangeOperationsResponse + the downstream
        // GET booking / POST fulfillments) so the next scenario fires cleanly.
        if (String(bru.getEnvVar("__expiredExchangeOfferArmed")) === "true") {
            const { gradeExpiredFlowResponse, advanceExpiredFlowQueueOrFinish, nhfTestPrefix } = require(bru.getEnvVar("library_base") + "expiredFlow.js");
            const _grade = gradeExpiredFlowResponse({ res: res, scenarioLabel: "Expired exchange offer" });
            const _tag = nhfTestPrefix();
            test(`${_tag}Expired exchange offer: POST /exchange-operations is rejected with a client error (4xx) — an exchange offer whose preBookableUntil has passed must not be bookable (got ${_grade.status})`, () => {
                expect(_grade.isClientError, `expected a 4xx rejection, got ${_grade.status}`).to.be.true;
            });
            if (_grade.isClientError && !_grade.isAuthFailure) {
                test(`${_tag}Expired exchange offer: error body is an RFC-9457 Problem (title/detail/code present)`, () => {
                    expect(_grade.hasProblemBody, "response body did not contain title/detail/code").to.be.true;
                });
            }
            // PR B: auto-expansion — advance the queue if more timers are armed.
            if (advanceExpiredFlowQueueOrFinish({ scenarioLabel: "Expired exchange offer" })) return;
            // Multi-scenario tail: loop to next scenario or stop. We do NOT
            // continue the exchange-flow validation because the exchange was
            // (correctly) never turned into a booking.
            const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            if (_scList.length > 0 && _scNextIdx < _scList.length) {
                bru.setEnvVar('__loopback', 'true');
                bru.runner.setNextRequest('01. POST Get Offer');
            } else {
                bru.runner.stopExecution();
            }
            return;
        }

        // Validate HTTP response status
        test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Exchange Operations");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Exchange Operations (JSON parse)");
            return;
        }
        if (!jsonData.exchangeOperation) {
            throw new Error("⛔ Exiting script, no exchangeOperation available in the response");
        }
        test('Successfully received exchangeOperation', () => expect(res.getStatus()).to.eql(200));

        postPatchExchangeOperationsResponse(jsonData, expectedexchangeOperationStatus = ["PREBOOKED"], expectedFulfillmentStatus=["CONFIRMED", "FULFILLED"]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
