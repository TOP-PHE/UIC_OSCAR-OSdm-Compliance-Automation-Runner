info:
  name: 12. GET Exchange Offer
  type: http
  seq: 3

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}/exchange-operations/{{exchangeOperationId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);'
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchExchangeOperationsResponse } = require(bru.getEnvVar("library_base")+"exchanges.js");

        // #398 known-deviation baseline. A documented non-200 here (e.g. Turnit
        // GET /exchange-operations/{id} -> 405: it creates the offer on 10. POST
        // Exchange Offers but does not allow GET retrieval) is reported as a
        // PASSING "known deviation" + WARNING and the flow proceeds — the
        // operation id came from 11. POST Exchange Operations. Any UNdocumented
        // non-200 still hard-stops below.
        const { knownDeviationFor, noteKnownDeviation } = require(bru.getEnvVar("library_base") + "loopback.js");
        const _kdStatus = res.getStatus();
        const _kdMatch  = _kdStatus !== 200 ? knownDeviationFor("12. GET Exchange Offer", _kdStatus) : null;
        if (_kdMatch) {
            test(`HTTP response status — known deviation (documented): 12. GET Exchange Offer returns ${_kdStatus}`, () => {});
            noteKnownDeviation("12. GET Exchange Offer", _kdStatus, _kdMatch);
            return;   // proceed to 13. GET Booking before Fulfillment (natural file order)
        }

        // Validate HTTP response status
        test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        if (res.getStatus() !== 200) {
          test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("GET Exchange Offer");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Exchange Offer (JSON parse)");
            return;
        }
        if (!jsonData.exchangeOperation) {
            test("exchangeOperation exists in response (required for downstream steps)", () => {
                throw new Error("⛔ exchangeOperation missing in response — cannot proceed");
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Exchange Offer (missing exchangeOperation)");
            return;
        }

        postPatchExchangeOperationsResponse(jsonData, ["PREBOOKED"], ["CONFIRMED", "FULFILLED"]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
