info:
  name: 16. DEL Exchange Offer
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{api_base}}/bookings/{{bookingId}}/exchange-operations/{{exchangeOperationId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);'
    - type: after-response
      code: |-
        test("Status code is 204, offer is deleted", function () {
            expect(res.getStatus()).to.equal(204);
        });
        if (res.getStatus() !== 204) {
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("DEL Exchange Offer");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
