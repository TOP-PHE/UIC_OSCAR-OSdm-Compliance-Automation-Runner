info:
  name: 13. GET Booking before Fulfillment
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}?embed=ALL"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);'
    - type: after-response
      code: |-
        const { validationLogger, displayFulFilledBooking } = require(bru.getEnvVar("library_base")+"displays.js");

        // Validate HTTP response status
        test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        if (res.getStatus() !== 200) {
          test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("GET Booking before Fulfillment (Exchange)");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Booking before Fulfillment (Exchange, JSON parse)");
            return;
        }
        // #649: the parts sold first against the original offer, the exchange's own parts for their status.
        require(bru.getEnvVar("library_base") + "exchanges.js").checkBookingAroundExchange(jsonData, "prebooked");

        displayFulFilledBooking(jsonData);

        // #663: an exchange is confirmed by its fulfilment (14). PATCH, which
        // Test Config's wizard sets by default, used to stop here: every
        // exchange made with the wizard ended before its confirmation.
        if(bru.getEnvVar("scenarioAction")?.includes("DELETE")) {
            bru.runner.setNextRequest("16. DEL Exchange Offer");
            console.log("[INFO] scenarioAction in data file contains 'DELETE' keyword, executing 16. DEL Exchange Offer")    
        } else {
            console.log("[INFO] Confirming the exchange: 14. POST Obtaining Fulfillments from Booking");
            bru.runner.setNextRequest("14. POST Obtaining Fulfillments from Booking");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
