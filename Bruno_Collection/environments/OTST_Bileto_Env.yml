name: OTST_Bileto_Env
variables:
  - secret: true
    name: client_id
  - secret: true
    name: client_secret
  - secret: true
    name: access_token
  - name: api-host
    value: https://osdm-5.platform.bileto.zone/api
  - name: api_base
    value: https://osdm-5.platform.bileto.zone/api
  - name: library_base
    value: ./library-bruno/
  - name: data_base
    value: http://localhost:8080/Bruno_Collection/data_base/bileto_datafile.json
  - name: json_schema
    value: http://localhost:8080/Bruno_Collection/json_validator/datafile.schema.json
  - name: scenariosToRunIndex
    value: "0"
  - name: scenarioTarget
    value: ""
