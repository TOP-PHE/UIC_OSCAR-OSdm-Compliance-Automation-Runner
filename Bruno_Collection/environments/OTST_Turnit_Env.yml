name: OTST_Turnit_Env
variables:
  - secret: true
    name: client_id
  - secret: true
    name: client_secret
  - secret: true
    name: requestor
  - secret: true
    name: access_token
  - name: api-host
    value: https://identity.sandbox.turnit.tech
  - name: api_base
    value: https://api.sandbox.turnit.tech/retailer
  - name: library_base
    value: ./library-bruno/
  - name: data_base
    value: http://localhost:8080/Bruno_Collection/data_base/turnit_datafile.json
  - name: json_schema
    value: http://localhost:8080/Bruno_Collection/json_validator/datafile.schema.json
  - name: scenariosToRunIndex
    value: "0"
  - name: scenarioTarget
    value: ""
