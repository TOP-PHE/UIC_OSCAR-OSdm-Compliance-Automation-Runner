info:
  name: Bileto Access Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{api_base}}/oauth/token"
  headers:
    - name: Accept
      value: application/json
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
      - name: client_id
        value: "{{client_id}}"
      - name: client_secret
        value: "{{client_secret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // #208: clear, fail-fast handling of the token response (never logs the token).
        const { handleAccessTokenResponse } = require(bru.getEnvVar("library_base") + "auth.js");
        handleAccessTokenResponse(res, { vendor: "Bileto" });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
