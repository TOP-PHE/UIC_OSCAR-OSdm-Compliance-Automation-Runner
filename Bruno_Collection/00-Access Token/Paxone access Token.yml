info:
  name: Paxone access Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{api-host}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "accountName": "{{client_id}}",
          "accountSecret": "{{client_secret}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // #208: clear, fail-fast handling of the token response (never logs the token).
        const { handleAccessTokenResponse } = require(bru.getEnvVar("library_base") + "auth.js");
        handleAccessTokenResponse(res, { vendor: "Paxone" });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
