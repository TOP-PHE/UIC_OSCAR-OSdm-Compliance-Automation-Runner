info:
  name: Chaps access Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{api-host}}/"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: Host
      value: osdm-api-test.cd.cz
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: "{{client_id}}"
      - name: client_secret
        value: "{{client_secret}}"
      - name: grant_type
        value: client_credentials
      - name: scope
        value: uic_osdm
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Parse the response JSON
        const response = res.getBody();
        // Check if the response contains the access_token
        if (response.access_token) {
            // Set the access_token in the environment variable
            bru.setEnvVar("access_token", response.access_token);
            console.log("Access token saved to environment: ", response.accessToken);
        } else {
            // Log an error if access_token is not found
            console.error("No access_token found in the response");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
