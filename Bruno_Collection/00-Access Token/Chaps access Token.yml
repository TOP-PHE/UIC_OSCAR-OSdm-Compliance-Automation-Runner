info:
  name: Chaps access Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{api-host}}/"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: Host
      value: osdm-api-test.cd.cz
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: "{{client_id}}"
      - name: client_secret
        value: "{{client_secret}}"
      - name: grant_type
        value: client_credentials
      - name: scope
        value: uic_osdm
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // #208: clear, fail-fast handling of the token response (never logs the token).
        const { handleAccessTokenResponse } = require(bru.getEnvVar("library_base") + "auth.js");
        handleAccessTokenResponse(res, { vendor: "Chaps" });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
