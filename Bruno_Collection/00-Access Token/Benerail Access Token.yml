info:
  name: Benerail Access Token
  type: http
  seq: 1

http:
  method: POST
  url: https://benerail-stg-apim.azure-api.net/acc/logon-server/public/token
  headers:
    - name: Ocp-Apim-Subscription-Key
      value: "{{Ocp-Apim-Subscription-Key}}"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: urn:ietf:params:oauth:grant-type:jwt-bearer
      - name: assertion
        value: "{{benerail_assertion}}"
      - name: scope
        value: "{{benerail_scope}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // #208: clear, fail-fast handling of the token response (never logs the token).
        const { handleAccessTokenResponse } = require(bru.getEnvVar("library_base") + "auth.js");
        handleAccessTokenResponse(res, { vendor: "Benerail" });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
