info:
  name: Sqills Access Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{api-host}}/oauth/v2/token"
  headers:
    - name: Authorization
      value: Basic {{auth.key_secret}}
  body:
    type: json
    data: |-
      {
          "grant_type": "https://com.sqills.s3.oauth.agent",
          "username": "{{agent.username}}",
          "password": "{{agent.password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // #208: clear, fail-fast handling of the token response (never logs the token).
        const { handleAccessTokenResponse } = require(bru.getEnvVar("library_base") + "auth.js");
        handleAccessTokenResponse(res, { vendor: "Sqills" });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
