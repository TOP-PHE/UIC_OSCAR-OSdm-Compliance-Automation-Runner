info:
  name: 15. DEL Refund Offer
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{api_base}}/bookings/{{bookingId}}/refund-offers/{{refundOffersOfferId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);'
    - type: after-response
      code: |-
        // #613 F6: a confirmed refund offer cannot be deleted. OSDM answers 409
        // (DELETE /bookings/{id}/refund-offers/{id}); the old check expected 404.
        // The env var is the string "true" once 13. PATCH Refund Offer confirmed it.
        if (String(bru.getEnvVar("isRefundConfirmed")) === "true") {
            test("Status code is 409, refund offer has been confirmed", function () {
                expect(res.getStatus()).to.equal(409);
            });
        } else {
            test("Status code is 204, offer is deleted", function () {
                expect(res.getStatus()).to.equal(204);
            });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
