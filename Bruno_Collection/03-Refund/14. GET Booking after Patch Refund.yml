info:
  name: 14. GET Booking after Patch Refund
  type: http
  seq: 5

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
  params:
    - name: embed
      value: ALL
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);'
    - type: after-response
      code: |-
        const { validationLogger, displayFulFilledBooking } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postCreateBookingResponse } = require(bru.getEnvVar("library_base")+"bookings.js");

        // Validate HTTP response status
        test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            if (res.getStatus() !== 200) throw new Error("HTTP " + res.getStatus() + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        if (res.getStatus() !== 200) {
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Booking after Patch Refund");
            return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Booking after Patch Refund (JSON parse)");
            return;
        }
        if (!jsonData.booking) {
            test("booking exists in response (required for downstream steps)", () => {
                throw new Error("⛔ booking missing in GET response — cannot proceed");
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Booking after Patch Refund (missing booking)");
            return;
        }
        // #613 F2: a refund that leaves fulfillments out (partial, or one
        // fulfillment of several) must not expect the whole booking REFUNDED.
        // The generic checks then accept either state, and the scope check
        // below says exactly which fulfillment and part must be REFUNDED.
        const { isScopedRefundOnBooking, checkRefundScopeOnBooking } = require(bru.getEnvVar("library_base") + "refunds.js");
        const _scopedRefund = isScopedRefundOnBooking(jsonData.booking);
        const _afterRefund = _scopedRefund ? ["REFUNDED", "FULFILLED", "CONFIRMED"] : ["REFUNDED"];
        postCreateBookingResponse(
        bru.getEnvVar("offer"),
        jsonData,
        _afterRefund,
        _afterRefund);
        checkRefundScopeOnBooking(jsonData.booking);

        displayFulFilledBooking(jsonData);

        // #595: the next refund offer, when the provider gave several (one
        // per fulfillment): confirm it and read the booking again. When all
        // are confirmed, a full refund has refunded every fulfillment.
        const { nextRefundOfferToConfirm, checkFullRefundDone } = require(bru.getEnvVar("library_base") + "refunds.js");
        const _nextRefundOffer = nextRefundOfferToConfirm();
        if (_nextRefundOffer) {
          console.log(`[INFO] 🔁 Refund offer ${_nextRefundOffer.position}/${_nextRefundOffer.total} (${_nextRefundOffer.id}): confirming it.`);
          bru.runner.setNextRequest("13. PATCH Refund Offer");
          return;
        }
        checkFullRefundDone(jsonData.booking);
        // ── Multi-scenario: loop to next scenario or truly stop ────────────────
        // #385: a skipped expired-flow sub-run must not behead the queue —
        // hand the remaining timers their pass before the next scenario.
        if (require(bru.getEnvVar("library_base") + "expiredFlow.js").advanceExpiredFlowQueueAfterSkip()) return;

        const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
        const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
        if (_scList.length > 0 && _scNextIdx < _scList.length) {
          console.log('🔄 REFUND+PATCH complete — looping to [' + (_scNextIdx + 1) + '/' + _scList.length + ']: ' + _scList[_scNextIdx]);
          bru.setEnvVar('__loopback', 'true');
          bru.runner.setNextRequest('01. POST Get Offer');
        } else {
          console.log('[INFO] ✅ All scenarios complete — run finished');
          bru.runner.stopExecution();
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
