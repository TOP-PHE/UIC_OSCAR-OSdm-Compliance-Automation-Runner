info:
  name: 10. POST Refund Offers
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_base}}/bookings/{{bookingId}}/refund-offers"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
    - name: Content-Type2
      value: application/json;version={{osdm-version}}
      disabled: true
  body:
    type: json
    data: "{{requestRefundOffersBodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { requestRefundOffersBody } = require(bru.getEnvVar("library_base")+"requestsBuilder.js");
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");

        console.log("⏩ [STEP] Executing request : " + req.getName());

        // Partial refund (#218): when partialRefundByLeg or partialRefundByPax
        // is on for this scenario, resolve the OSDM RefundSpecification[]
        // payload from the booking-after-fulfillments JSON saved in 07.yml.
        // Degradation rules (per #218 design):
        //   - SEARCH-mode trips can return a single leg even though the scenario
        //     asked for per-leg; the helper detects "<2 admissions" and degrades.
        //   - Per-pax with a single-pax booking degrades.
        //   - The degraded run STILL produces a full refund (the historical
        //     behaviour); only the partial-scope assertions skip.
        let _refundSpecs = null;
        const _byLeg = String(bru.getEnvVar("partialRefundByLeg")) === "true";
        const _byPax = String(bru.getEnvVar("partialRefundByPax")) === "true";
        bru.setEnvVar("__partialRefundDegradedToFull", "false");
        bru.setEnvVar("__partialRefundResolvedSpec", "");
        if (_byLeg || _byPax) {
          const { resolvePartialRefundScope } = require(bru.getEnvVar("library_base") + "partialRefund.js");
          let _bk = null;
          try { _bk = JSON.parse(bru.getEnvVar("__bookingForRefund") || "null"); }
          catch (_e) { _bk = null; }
          if (!_bk) {
            validationLogger(`[WARNING] Partial refund requested but no booking JSON was captured in 07.yml — falling back to full refund.`);
            bru.setEnvVar("__partialRefundDegradedToFull", "true");
          } else {
            const _r = resolvePartialRefundScope(_bk, {
              byLeg: _byLeg, byPax: _byPax,
              legSel: bru.getEnvVar("partialRefundLegSelection") || "first",
              paxSel: bru.getEnvVar("partialRefundPaxSelection") || "first",
            });
            if (_r.degraded) {
              validationLogger(`[WARNING] Partial refund degraded to full: ${_r.reason}. The full-refund happy path runs; partial-scope assertions skip.`);
              bru.setEnvVar("__partialRefundDegradedToFull", "true");
            } else if (_r.armed) {
              _refundSpecs = [{ fulfillmentId: _r.fulfillmentId }];
              if (_r.bookingPartIds.length > 0) _refundSpecs[0].bookingPartIds = _r.bookingPartIds;
              if (_r.passengerIds.length   > 0) _refundSpecs[0].passengerIds   = _r.passengerIds;
              bru.setEnvVar("__partialRefundResolvedSpec", JSON.stringify(_refundSpecs));
              validationLogger(`[INFO] Partial refund resolved: fulfillmentId=${_r.fulfillmentId}, bookingPartIds=[${_r.bookingPartIds.join(", ")}], passengerIds=[${_r.passengerIds.join(", ")}]`);
            }
          }
        }

        if (bru.getEnvVar("refundDate") != null) {
            requestRefundOffersBody(bru.getEnvVar("overruleCode"), bru.getEnvVar("refundDate"), _refundSpecs);
        } else {
            requestRefundOffersBody(bru.getEnvVar("overruleCode"), null, _refundSpecs);
        }
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchRefundOfferResponse } = require(bru.getEnvVar("library_base")+"refunds.js");

        // Validate HTTP response status
        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test("Status code is 200", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Refund Offers");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Refund Offers (JSON parse)");
            return;
        }

        // Validate refundOffers and call response handler — retry up to 3 times if no offers
        try {
          if (!jsonData.refundOffers) {
              throw new Error("⛔ refundOffers property is missing in the response");
          }
          if (!Array.isArray(jsonData.refundOffers)) {
              jsonData.refundOffers = [jsonData.refundOffers];
          }
          if (jsonData.refundOffers.length === 0) {
              throw new Error("⛔ No refundOffers available in the response");
          }
          jsonData.refundOffers = jsonData.refundOffers.map(offer => {
              if (!offer || typeof offer !== 'object') {
                  throw new Error("⛔ Invalid refundOffer item in array");
              }
              return offer;
          });
          postPatchRefundOfferResponse(jsonData, expectedexchangeOperationStatus=["PROPOSED"], expectedFulfillmentStatus=["CONFIRMED", "FULFILLED"]);
          bru.setEnvVar('__refundOfferRetryCount', '0'); // reset on success
        } catch (noOffersErr) {
          test("Refund offers found in response", () => { throw noOffersErr; });
          const _retryCount = parseInt(bru.getEnvVar('__refundOfferRetryCount') || '0', 10) + 1;
          bru.setEnvVar('__refundOfferRetryCount', String(_retryCount));
          if (_retryCount < 3) {
            console.log('⚠️ No refund offers (attempt ' + _retryCount + '/3) — retrying...');
            bru.runner.setNextRequest('10. POST Refund Offers');
          } else {
            console.log('[INFO] No refund offers returned after 3 attempts — skipping this scenario');
            bru.setEnvVar('__refundOfferRetryCount', '0');
            const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            if (_scList.length > 0 && _scNextIdx < _scList.length) {
              console.log('⏭️ Skipping to next scenario [' + (_scNextIdx + 1) + '/' + _scList.length + ']: ' + _scList[_scNextIdx]);
              bru.setEnvVar('__loopback', 'true');
              bru.runner.setNextRequest('01. POST Get Offer');
            } else {
              console.log('✅ No more scenarios — stopping run');
              bru.runner.stopExecution();
            }
          }
          return;
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
