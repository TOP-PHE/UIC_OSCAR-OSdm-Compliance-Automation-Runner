info:
  name: 10. POST Refund Offers
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_base}}/bookings/{{bookingId}}/refund-offers"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
    - name: Content-Type2
      value: application/json;version={{osdm-version}}
      disabled: true
  body:
    type: json
    data: "{{requestRefundOffersBodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { requestRefundOffersBody } = require(bru.getEnvVar("library_base")+"requestsBuilder.js");
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");

        console.log("⏩ [STEP] Executing request : " + req.getName());

        // Partial refund (#218): when partialRefundByLeg or partialRefundByPax
        // is on for this scenario, resolve the OSDM RefundSpecification[]
        // payload from the booking-after-fulfillments JSON saved in 07.yml.
        // Degradation rules (per #218 design):
        //   - SEARCH-mode trips can return a single leg even though the scenario
        //     asked for per-leg; the helper detects "<2 admissions" and degrades.
        //   - Per-pax with a single-pax booking degrades.
        //   - The degraded run STILL produces a full refund (the historical
        //     behaviour); only the partial-scope assertions skip.
        let _refundSpecs = null;
        const _byLeg = String(bru.getEnvVar("partialRefundByLeg")) === "true";
        const _byPax = String(bru.getEnvVar("partialRefundByPax")) === "true";
        bru.setEnvVar("__partialRefundDegradedToFull", "false");
        bru.setEnvVar("__partialRefundResolvedSpec", "");
        bru.setEnvVar("__partialRefundExpectedAmount", "");
        bru.setEnvVar("__partialRefundExpectedPartIds", "");
        if (_byLeg || _byPax) {
          const { resolvePartialRefundScope } = require(bru.getEnvVar("library_base") + "partialRefund.js");
          let _bk = null;
          try { _bk = JSON.parse(bru.getEnvVar("__bookingForRefund") || "null"); }
          catch (_e) { _bk = null; }
          if (!_bk) {
            validationLogger(`[WARNING] Partial refund requested but no booking JSON was captured in 07.yml — falling back to full refund.`);
            bru.setEnvVar("__partialRefundDegradedToFull", "true");
          } else {
            const _r = resolvePartialRefundScope(_bk, {
              byLeg: _byLeg, byPax: _byPax,
              legSel: bru.getEnvVar("partialRefundLegSelection") || "first",
              paxSel: bru.getEnvVar("partialRefundPaxSelection") || "first",
            });
            if (_r.degraded) {
              validationLogger(`[WARNING] Partial refund degraded to full: ${_r.reason}. The full-refund happy path runs; partial-scope assertions skip.`);
              bru.setEnvVar("__partialRefundDegradedToFull", "true");
            } else if (_r.armed) {
              // OSDM-version guard: RefundSpecification[] only landed in v3.8.
              // Older negotiated versions (e.g. 3.5 = Paxone's current sandbox)
              // reject the field as OSDM_EXTRA_REQUEST_FIELDS_IGNORED and would
              // silently produce a full refund. Skip the field; scope only via
              // the trimmed fulfillmentIds[] (which v3.5+ already supports).
              const _osdm = String(bru.getEnvVar("osdmVersion") || "").trim();
              const _osdmParts = _osdm.split(".").map(p => parseInt(p, 10));
              const _osdmOk = _osdmParts.length >= 2 && !isNaN(_osdmParts[0]) && !isNaN(_osdmParts[1])
                && (_osdmParts[0] > 3 || (_osdmParts[0] === 3 && _osdmParts[1] >= 8));
              if (_osdmOk) {
                _refundSpecs = [{ fulfillmentId: _r.fulfillmentId }];
                if (_r.bookingPartIds.length > 0) _refundSpecs[0].bookingPartIds = _r.bookingPartIds;
                if (_r.passengerIds.length   > 0) _refundSpecs[0].passengerIds   = _r.passengerIds;
                bru.setEnvVar("__partialRefundResolvedSpec", JSON.stringify(_refundSpecs));
                validationLogger(`[INFO] Partial refund resolved: fulfillmentId=${_r.fulfillmentId}, bookingPartIds=[${_r.bookingPartIds.join(", ")}], passengerIds=[${_r.passengerIds.join(", ")}]`);
              } else {
                // Still scope via fulfillmentIds[] — requestRefundOffersBody
                // will trim the list down because _refundSpecs is non-null.
                // We attach the bare {fulfillmentId} so the trimmer keeps only
                // the target fulfillment but we don't actually send the field.
                _refundSpecs = [{ fulfillmentId: _r.fulfillmentId, __scopeOnly: true }];
                validationLogger(`[INFO] Partial refund scope resolved but osdmVersion=${_osdm || "(unset)"} < 3.8 — refundSpecifications[] omitted from the request; scoping via fulfillmentIds[] only.`);
              }
              // Compute the expected refundable amount for the after-response
              // alignment assertion. Sum the prices of every admission /
              // reservation / ancillary in the resolved bookingPartIds set —
              // crawl the booking we have in hand.
              const _wantIds = new Set((_r.bookingPartIds || []).map(String));
              let _expected = 0;
              let _currency = null;
              let _scale    = null;
              const _bos = Array.isArray(_bk.bookedOffers) ? _bk.bookedOffers : [];
              for (const _bo of _bos) {
                for (const _grp of ["admissions", "reservations", "ancillaries"]) {
                  const _arr = Array.isArray(_bo[_grp]) ? _bo[_grp] : [];
                  for (const _p of _arr) {
                    if (!_p || !_wantIds.has(String(_p.id))) continue;
                    const _pr = _p.price || {};
                    if (typeof _pr.amount === "number") _expected += _pr.amount;
                    if (!_currency && _pr.currency) _currency = _pr.currency;
                    if (_scale == null && typeof _pr.scale === "number") _scale = _pr.scale;
                  }
                }
              }
              bru.setEnvVar("__partialRefundExpectedAmount", JSON.stringify({ amount: _expected, currency: _currency, scale: _scale }));
              bru.setEnvVar("__partialRefundExpectedPartIds", JSON.stringify([...(_r.bookingPartIds || [])]));
              validationLogger(`[INFO] Partial refund expected refundableAmount=${_expected} ${_currency || ""} (scale=${_scale}); ${_wantIds.size} booking part(s) in scope.`);
            }
          }
        }
        // Strip the internal __scopeOnly marker before sending — requestsBuilder
        // checks Array.isArray()/length > 0 only, so a stripped/null value here
        // means "do NOT attach refundSpecifications to the body".
        if (Array.isArray(_refundSpecs) && _refundSpecs[0] && _refundSpecs[0].__scopeOnly) {
          // The trimmer in requestRefundOffersBody still needs the fulfillmentId
          // to scope fulfillmentIds[]; pass it via a side channel instead.
          bru.setEnvVar("__partialRefundScopeFulfillmentId", _refundSpecs[0].fulfillmentId);
          _refundSpecs = null;
        } else {
          bru.setEnvVar("__partialRefundScopeFulfillmentId", "");
        }

        if (bru.getEnvVar("refundDate") != null) {
            requestRefundOffersBody(bru.getEnvVar("overruleCode"), bru.getEnvVar("refundDate"), _refundSpecs);
        } else {
            requestRefundOffersBody(bru.getEnvVar("overruleCode"), null, _refundSpecs);
        }
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchRefundOfferResponse } = require(bru.getEnvVar("library_base")+"refunds.js");

        // Validate HTTP response status
        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test("Status code is 200", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("POST Refund Offers");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("POST Refund Offers (JSON parse)");
            return;
        }

        // Validate refundOffers and call response handler — retry up to 3 times if no offers
        try {
          if (!jsonData.refundOffers) {
              throw new Error("⛔ refundOffers property is missing in the response");
          }
          if (!Array.isArray(jsonData.refundOffers)) {
              jsonData.refundOffers = [jsonData.refundOffers];
          }
          if (jsonData.refundOffers.length === 0) {
              throw new Error("⛔ No refundOffers available in the response");
          }
          jsonData.refundOffers = jsonData.refundOffers.map(offer => {
              if (!offer || typeof offer !== 'object') {
                  throw new Error("⛔ Invalid refundOffer item in array");
              }
              return offer;
          });
          postPatchRefundOfferResponse(jsonData, expectedexchangeOperationStatus=["PROPOSED"], expectedFulfillmentStatus=["CONFIRMED", "FULFILLED"]);
          bru.setEnvVar('__refundOfferRetryCount', '0'); // reset on success

          // Partial-refund alignment check (#218 follow-up).
          // If the scenario armed partial scope AND we didn't have to degrade,
          // verify the provider honoured it: the returned refundableAmount
          // must match the sum of the in-scope booking-part prices computed
          // before-request. Any drift means the provider either ignored the
          // refundSpecifications field (Paxone OSDM_EXTRA_REQUEST_FIELDS_IGNORED
          // warning) or fell back to a full refund — both are bugs we want to
          // surface, not silently accept.
          try {
            const _degraded   = String(bru.getEnvVar("__partialRefundDegradedToFull")) === "true";
            const _expRaw     = bru.getEnvVar("__partialRefundExpectedAmount") || "";
            if (!_degraded && _expRaw) {
              const _exp = JSON.parse(_expRaw);
              const _firstOffer = jsonData.refundOffers[0] || {};
              const _refAmount  = (_firstOffer.refundableAmount && typeof _firstOffer.refundableAmount.amount === "number")
                ? _firstOffer.refundableAmount.amount : null;
              const _refCurrency = (_firstOffer.refundableAmount && _firstOffer.refundableAmount.currency) || null;

              test("Partial refund: response refundableAmount matches expected partial sum", () => {
                if (_refAmount == null) {
                  throw new Error("[ERROR] response refundOffers[0].refundableAmount.amount missing — cannot verify partial scope was honoured");
                }
                if (_exp.currency && _refCurrency && _exp.currency !== _refCurrency) {
                  throw new Error(`[ERROR] Currency mismatch: expected ${_exp.currency}, got ${_refCurrency}`);
                }
                if (_refAmount !== _exp.amount) {
                  throw new Error(
                    `[ERROR] Provider returned refundableAmount=${_refAmount} but partial scope expected ${_exp.amount}` +
                    ` (${_refCurrency || _exp.currency || ""}, scale=${_exp.scale}). ` +
                    `Provider likely ignored refundSpecifications[] (see response.warnings.OSDM_EXTRA_REQUEST_FIELDS_IGNORED) ` +
                    `or refunded the full booking instead of the requested scope.`
                  );
                }
                validationLogger(`[INFO] Partial refund alignment OK — refundableAmount=${_refAmount} matches expected partial sum.`);
              });
            } else if (_degraded) {
              validationLogger(`[INFO] Partial refund degraded earlier — alignment assertion skipped (full refund is the contract in that case).`);
            }
          } catch (_alignErr) {
            // Don't swallow — the test() above already emits the failure. The
            // try/catch is here so a JSON.parse glitch on the env var doesn't
            // crash the after-response handler.
            validationLogger(`[WARNING] Partial-refund alignment check threw: ${_alignErr && _alignErr.message}`);
          }
        } catch (noOffersErr) {
          test("Refund offers found in response", () => { throw noOffersErr; });
          const _retryCount = parseInt(bru.getEnvVar('__refundOfferRetryCount') || '0', 10) + 1;
          bru.setEnvVar('__refundOfferRetryCount', String(_retryCount));
          if (_retryCount < 3) {
            console.log('⚠️ No refund offers (attempt ' + _retryCount + '/3) — retrying...');
            bru.runner.setNextRequest('10. POST Refund Offers');
          } else {
            console.log('[INFO] No refund offers returned after 3 attempts — skipping this scenario');
            bru.setEnvVar('__refundOfferRetryCount', '0');
            const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            if (_scList.length > 0 && _scNextIdx < _scList.length) {
              console.log('⏭️ Skipping to next scenario [' + (_scNextIdx + 1) + '/' + _scList.length + ']: ' + _scList[_scNextIdx]);
              bru.setEnvVar('__loopback', 'true');
              bru.runner.setNextRequest('01. POST Get Offer');
            } else {
              console.log('✅ No more scenarios — stopping run');
              bru.runner.stopExecution();
            }
          }
          return;
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
