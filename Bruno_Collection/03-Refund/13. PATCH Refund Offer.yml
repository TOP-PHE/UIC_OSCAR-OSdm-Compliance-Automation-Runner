info:
  name: 13. PATCH Refund Offer
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{api_base}}/bookings/{{bookingId}}/refund-offers/{{refundOffersOfferId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: |-
      {
        "status": "CONFIRMED"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        require(bru.getEnvVar("library_base") + "displays.js").logStepStart(req);

        // #expired-refund-offer test (Phase 3): when armed, wait until just past
        // the refundOffers[0].validUntil (stashed by refunds.js
        // postPatchRefundOfferResponse on the prior POST /refund-offers), then
        // let the PATCH fire — the after-response asserts the provider correctly
        // rejects the confirmation of a stale refund offer.
        if (String(bru.getEnvVar("expiredRefundOfferTest")) === "true") {
          const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
          const { planExpiredFlow, runExpiredFlowWait } = require(bru.getEnvVar("library_base") + "expiredFlow.js");
          const limitRaw   = bru.getEnvVar("refundOfferValidUntil");
          const limitSrc   = bru.getEnvVar("refundOfferValidUntilSource") || "refund offer validUntil";
          const maxWaitMin = parseInt(bru.getEnvVar("expiredRefundOfferMaxWaitMinutes") || "0", 10) || 0;
          const plan = planExpiredFlow({
            deadlineRaw:    limitRaw,
            maxWaitMinutes: maxWaitMin,
            resourceLabel:  "refund offer (" + limitSrc + ")",
          });
          if (!plan.armed) {
            validationLogger(`[WARNING] expiredRefundOfferTest SKIPPED: ${plan.reason}`);
            bru.setEnvVar("__expiredRefundOfferArmed", "false");
          } else {
            await runExpiredFlowWait({ plan, deadlineRaw: limitRaw, scenarioLabel: "expiredRefundOfferTest (PATCH /refund-offers/{id})" });
            bru.setEnvVar("__expiredRefundOfferArmed", "true");
            validationLogger(`[INFO] expiredRefundOfferTest: attempting PATCH /refund-offers/{id}, expecting the provider to reject it (refund offer expired).`);
          }
        }
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchRefundOfferResponse } = require(bru.getEnvVar("library_base")+"refunds.js");

        // #expired-refund-offer: when armed, the PATCH MUST be rejected — an
        // expired refund offer must not be confirmable. Grade the rejection
        // here and short-circuit (skip postPatchRefundOfferResponse + downstream
        // GET booking after refund / DEL refund offer) so the next scenario in
        // the loop fires cleanly.
        if (String(bru.getEnvVar("__expiredRefundOfferArmed")) === "true") {
            const { gradeExpiredFlowResponse, advanceExpiredFlowQueueOrFinish, nhfTestPrefix } = require(bru.getEnvVar("library_base") + "expiredFlow.js");
            const _grade = gradeExpiredFlowResponse({ res: res, scenarioLabel: "Expired refund offer" });
            const _tag = nhfTestPrefix();
            test(`${_tag}Expired refund offer: PATCH /refund-offers/{id} is rejected with a client error (4xx) — an expired refund offer must not be confirmable (got ${_grade.status})`, () => {
                expect(_grade.isClientError, `expected a 4xx rejection, got ${_grade.status}`).to.be.true;
            });
            if (_grade.isClientError && !_grade.isAuthFailure) {
                test(`${_tag}Expired refund offer: error body is an RFC-9457 Problem (title/detail/code present)`, () => {
                    expect(_grade.hasProblemBody, "response body did not contain title/detail/code").to.be.true;
                });
            }
            // PR B: auto-expansion — advance the queue if more timers are armed.
            if (advanceExpiredFlowQueueOrFinish({ scenarioLabel: "Expired refund offer" })) return;
            // Multi-scenario tail: loop to next scenario or stop. We do NOT
            // continue the refund-flow validation because the refund was
            // (correctly) never confirmed.
            const _scList    = JSON.parse(bru.getEnvVar('__scenariosList') || '[]');
            const _scNextIdx = parseInt(bru.getEnvVar('scenariosToRunIndex') || '0', 10);
            if (_scList.length > 0 && _scNextIdx < _scList.length) {
                bru.setEnvVar('__loopback', 'true');
                bru.runner.setNextRequest('01. POST Get Offer');
            } else {
                bru.runner.stopExecution();
            }
            return;
        }

        // Validate HTTP response status
        test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test(`HTTP response status — expected 200, actual: ${res.getStatus()}`, () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("PATCH Refund Offer");
          return;
        }

        // Parse JSON safely
        let jsonData;
        let refundOffersArray = [];
        let jsonDataToArray;
        try {
            jsonData = res.getBody();
            if (jsonData.refundOffer) {
                refundOffersArray.push(jsonData.refundOffer);
            }
            jsonDataToArray = {
                refundOffers: refundOffersArray
            };    
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("PATCH Refund Offer (JSON parse)");
            return;
        }
        if (!jsonData.refundOffer) {
            throw new Error("⛔ Exiting script, no refundOffer available in the response");
        }
        postPatchRefundOfferResponse(jsonDataToArray, expectedexchangeOperationStatus = ["CONFIRMED"], expectedFulfillmentStatus=["REFUNDED"]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
