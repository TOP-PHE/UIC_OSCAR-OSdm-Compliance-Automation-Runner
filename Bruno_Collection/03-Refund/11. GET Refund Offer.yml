info:
  name: 11. GET Refund Offer
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}/refund-offers/{{refundOffersOfferId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Accept
      value: application/json
    - name: Requestor
      value: "{{requestor}}"
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchRefundOfferResponse } = require(bru.getEnvVar("library_base")+"refunds.js");

        // #398 known-deviation baseline. A documented non-200 here (e.g. Turnit
        // GET /refund-offers/{id} -> 405: it creates the offer on 10. POST Refund
        // Offers but does not allow GET retrieval) is reported as a PASSING
        // "known deviation" + WARNING and the flow proceeds — the refund offer id
        // came from step 10, so 12-16 (incl. 13. PATCH Refund Offer) don't need
        // this body. Any UNdocumented non-200 is checked next against the OSDM
        // "not implemented" signal before falling through to a real failure.
        const { knownDeviationFor, noteKnownDeviation } = require(bru.getEnvVar("library_base") + "loopback.js");
        const _kdStatus = res.getStatus();
        const _kdMatch  = _kdStatus !== 200 ? knownDeviationFor("11. GET Refund Offer", _kdStatus) : null;

        // #488/#489 field review: this GET is optional/read-only — reuse the
        // same "not implemented" classifier as System-Info endpoints and GET
        // Passenger (osdmCompliance.js), which now also trusts a bare
        // 403/404/405/500 (no confirming OSDM Problem body required; 406
        // deliberately excluded — 2026-09-03 standards review).
        let _niSkip = null;
        if (_kdStatus !== 200 && !_kdMatch) {
          const { classifySystemInfoStatus } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
          let _body = null;
          try { _body = res.getBody(); } catch (_e) {}
          const _cls = classifySystemInfoStatus(_kdStatus, "Refund Offer", _body);
          if (_cls.outcome === "skip") _niSkip = _cls;
        }

        if (_kdMatch) {
            test(`HTTP response status — known deviation (documented): 11. GET Refund Offer returns ${_kdStatus}`, () => {});
            noteKnownDeviation("11. GET Refund Offer", _kdStatus, _kdMatch);
            return;   // proceed to 12. GET Booking before Patch Refund (natural file order)
        }
        if (_niSkip) {
            if (_niSkip.log) validationLogger(_niSkip.log);
            test(`HTTP response status — not implemented by this provider (auto-detected): 11. GET Refund Offer returns ${_kdStatus}`, () => {});
            return;   // proceed to 12. GET Booking before Patch Refund (natural file order)
        }

        // Validate HTTP response status
        test(`HTTP response status — expected 200, actual: ${_kdStatus}`, () => {
            if (_kdStatus !== 200) throw new Error("HTTP " + _kdStatus + " received, expected 200 — see the response body in the HTTP-traffic viewer and any [ERROR]/[WARNING] envelope lines above.");
        });

        if (_kdStatus !== 200) {
          // #383: the status test above already recorded this failure once —
          // a second identical registration only double-counted it.
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("GET Refund Offer");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Refund Offer (JSON parse)");
            return;
        }
        if (!jsonData.refundOffer) {
            test("refundOffer exists in response (required for downstream steps)", () => {
                throw new Error("⛔ refundOffer missing in response — cannot proceed");
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Refund Offer (missing refundOffer)");
            return;
        }

        postPatchRefundOfferResponse(jsonData, ["PROPOSED"], ["CONFIRMED", "FULFILLED"]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
