info:
  name: 04. GET Passenger Categories
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_base}}/passenger-categories"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { handleSystemInfoStatus, validatePassengerCategories } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        const endpoint = '/passenger-categories';
        // Shared, version-aware status handling (passenger-categories is 3.6+ →
        // a 404 below 3.6 is reported as out of scope, not a failure).
        if (!handleSystemInfoStatus(res.getStatus(), endpoint, { bruTest, validationLogger })) return;

        let body;
        try { body = res.getBody(); } catch (_e) {}
        const bodyNotEmpty = Array.isArray(body)
          ? body.length > 0
          : (body != null && typeof body === 'object' && Object.keys(body).length > 0);
        bruTest(`GET ${endpoint} response body is present and not empty`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
          expect(bodyNotEmpty, 'Response array/object should not be empty').to.be.true;
        });
        validationLogger(`[INFO] GET ${endpoint} → 200 OK, ${Array.isArray(body) ? body.length + ' item(s)' : 'body received'}`);

        // ── OSDM compliance (Layer 1): array<PassengerCategory> ──
        // Bare array; every PassengerCategory has required title (Text object)
        // and specification (object); base/additional booleans when present.
        validatePassengerCategories(body).forEach((c) => {
          bruTest(c.name, () => { expect(c.ok, c.message).to.be.true; });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        validateSchema('PassengerCategory', body, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { expect(c.ok, c.message).to.be.true; });
        });
