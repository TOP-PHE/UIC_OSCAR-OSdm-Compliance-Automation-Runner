info:
  name: 02. GET Coach By Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_base}}/{{coachLayoutsResource}}/{{coachId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Endpoint selection by the NEGOTIATED OSDM version (>= 3.8 → the
        // coach-deck-layouts resource, else legacy coach-layouts). Version
        // resolution is centralised in osdmVersion.js (issue #105). NB this is
        // the negotiated/effective version, NOT the compliance version.
        const { resolveEffectiveVersion, atLeast } = require(bru.getEnvVar("library_base") + "osdmVersion.js");
        bru.setVar('coachLayoutsResource', atLeast(resolveEffectiveVersion(), '3.8.0') ? 'coach-deck-layouts' : 'coach-layouts');

        const cfgCoachId = bru.getEnvVar('coachId');
        const coachMissing = cfgCoachId == null || String(cfgCoachId).trim() === '' || /^null$/i.test(String(cfgCoachId).trim());
        if (coachMissing) {
          let candidates = [];
          try { candidates = JSON.parse(bru.getEnvVar('coachListCandidateIds') || '[]'); } catch (_e) {}
          candidates = Array.isArray(candidates) ? candidates.filter(Boolean) : [];

          if (candidates.length > 0) {
            const randomCoachId = candidates[Math.floor(Math.random() * candidates.length)];
            bru.setEnvVar('coachId', String(randomCoachId));
            console.log(`[INFO] coachId was null; picked random id from GET Coach response: ${randomCoachId}`);
          }
        }

    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");

        const resource = bru.getVar('coachLayoutsResource') || 'coach-layouts';
        const endpoint = `/${resource}/{id}`;
        const layoutId = bru.getEnvVar("coachId");
        const statusCode = res.getStatus();

        // ── Status classification FIRST (#355) — shared, version-aware and
        // Problem-body-aware (#353): a provider that 501s this endpoint (or
        // declares it unsupported via a Problem code) gets ONE skip line —
        // not a prerequisite-failure cascade; out-of-version 404s skip;
        // auth/4xx/5xx fail decoded without chai tails. Only a 200 proceeds.
        let body = null;
        try { body = res.getBody(); } catch (_e) {}
        const { handleSystemInfoStatus } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
        if (!handleSystemInfoStatus(statusCode, endpoint, { bruTest, validationLogger, body })) {
          // Cascade-kill: when the id came from a broken GET Coach, the root
          // cause already failed loudly THERE — add one context line here,
          // no extra failing assertion.
          const coachListReady = String(bru.getEnvVar('coachListHasValidData') || '').toLowerCase() === 'true';
          const coachMissing = layoutId == null || String(layoutId).trim() === '' || /^null$/i.test(String(layoutId).trim());
          if (!coachListReady || coachMissing) {
            validationLogger(`[INFO] Context: GET Coach did not provide a usable coach id (see GET Coach above) — this call used ${coachMissing ? 'no id' : `id ${layoutId}`}.`);
          }
          return;
        }

        // 200 — handleSystemInfoStatus already registered the "→ 200 OK"
        // assertion; validate the body (no prerequisite gate: a 200 with a
        // body is validatable regardless of how the id was obtained).
        bruTest(`GET ${endpoint} response body is present`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
        });
        validationLogger(`[DEBUG] GET ${endpoint} → 200 OK, ID=${layoutId}`);

        // ── OSDM compliance (Layer 1): Coach(Deck)LayoutResponse ──
        // coach-deck-layouts/{id} (>=3.8) wraps a CoachDeckLayout under
        // "coachDeckLayout"; coach-layouts/{id} wraps a CoachLayout under
        // "coachLayout".
        const osdmCompliance = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
        const coachChecks = (resource === 'coach-deck-layouts')
          ? osdmCompliance.validateCoachDeckLayout(body, endpoint)
          : osdmCompliance.validateCoachLayout(body, endpoint);
        coachChecks.forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        const coachComponent = (resource === 'coach-deck-layouts') ? 'CoachDeckLayout' : 'CoachLayout';
        const coachItem = (resource === 'coach-deck-layouts') ? body.coachDeckLayout : body.coachLayout;
        validateSchema(coachComponent, coachItem, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });
