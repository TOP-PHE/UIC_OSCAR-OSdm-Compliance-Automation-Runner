info:
  name: 03. GET Place Maps
  type: http
  seq: 3

http:
  method: GET
  url: "{{api_base}}/availabilities/place-map?contextId={{offerId}}&contextType=OFFER&resourceId={{reservationId}}&resourceType=RESERVATION"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  params:
    - name: contextId
      value: "{{offerId}}"
      type: query
    - name: contextType
      value: OFFER
      type: query
    - name: resourceId
      value: "{{reservationId}}"
      type: query
    - name: resourceType
      value: RESERVATION
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'console.log("⏩ [STEP] Executing request : " + req.getName());'
    - type: after-response
      code: |-
        // NOTE: /availabilities/place-map is NOT a System-Information endpoint —
        // it is transaction-scoped and requires an OFFER + RESERVATION context
        // (contextId=offerId, resourceId=reservationId), which only exist inside
        // the sale flow. Run standalone (e.g. a System-Info-only run) those vars
        // are empty, the API returns no vehicleAvailability, and the original
        // unguarded extraction threw. Relocation of this request into the sale
        // flow + PlaceAvailabilityResponse compliance is tracked separately.
        var jsonData = res.getBody();
        var vehicle = jsonData && jsonData.vehicleAvailability && jsonData.vehicleAvailability.vehicle;
        var coach = (vehicle && Array.isArray(vehicle.coaches)) ? vehicle.coaches[0] : null;
        if (!coach) {
          console.log("[WARNING] GET /availabilities/place-map: no vehicleAvailability in response — this endpoint needs an OFFER + RESERVATION context (sale flow). Skipping place pre-selection extraction.");
        } else {
          var preSelection = Array.isArray(coach.compartments) ? coach.compartments[0] : null;
          bru.setEnvVar("preselectedCoach", coach.coachNumber);
          if (preSelection) bru.setEnvVar("preselectedPlace", preSelection.place);
          bru.setEnvVar("layoutId", coach.layoutId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
