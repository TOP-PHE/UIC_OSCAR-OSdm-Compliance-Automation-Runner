info:
  name: 05. GET Promotion Codes
  type: http
  seq: 5

http:
  method: GET
  url: "{{api_base}}/promotion-codes"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { handleSystemInfoStatus, validatePromotionCodes } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        const endpoint = '/promotion-codes';
        // Shared, version-aware status handling (promotion-codes is 3.8+ → a 404
        // below 3.8 is reported as out of scope, not a failure).
        if (!handleSystemInfoStatus(res.getStatus(), endpoint, { bruTest, validationLogger, body: (() => { try { return res.getBody(); } catch (_e) { return null; } })() })) return;

        let body;
        try { body = res.getBody(); } catch (_e) {}
        const bodyNotEmpty = Array.isArray(body)
          ? body.length > 0
          : (body != null && typeof body === 'object' && Object.keys(body).length > 0);
        bruTest(`GET ${endpoint} response body is present and not empty`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
          expect(bodyNotEmpty, 'Response array/object should not be empty').to.be.true;
        });
        validationLogger(Array.isArray(body) ? `[INFO] GET ${endpoint} → 200 OK, ${body.length} item(s)` : `[DEBUG] GET ${endpoint} → 200 OK, body received`);

        // ── OSDM compliance (Layer 1): PromotionCodeCollectionResponse ──
        // Envelope object → "promotionCodes" array; every PromotionCode has
        // required code (string); issuer typed when present.
        validatePromotionCodes(body).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        validateSchema('PromotionCode', body.promotionCodes, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });
