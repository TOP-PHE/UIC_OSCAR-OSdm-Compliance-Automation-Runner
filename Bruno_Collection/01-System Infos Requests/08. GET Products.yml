info:
  name: 08. GET Products
  type: http
  seq: 8

http:
  method: GET
  url: "{{api_base}}/products"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { handleSystemInfoStatus, validateProducts } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        const endpoint = '/products';

        // Reset product list markers for this request execution
        bru.setEnvVar('productListHasValidData', 'false');
        bru.setEnvVar('productListCandidateIds', '[]');

        function pickProductIds(body) {
          const ids = [];
          const add = (v) => {
            const s = v == null ? '' : String(v).trim();
            if (!s || /^null$/i.test(s) || ids.includes(s)) return;
            ids.push(s);
          };

          const fromArr = (arr) => {
            if (!Array.isArray(arr)) return;
            arr.forEach(item => {
              if (!item || typeof item !== 'object') return;
              add(item.id);
            });
          };

          if (Array.isArray(body)) fromArr(body);
          if (body && typeof body === 'object') {
            fromArr(body.products);
            fromArr(body.items);
          }

          return ids;
        }

        // Shared, version-aware status handling (out-of-version 404 → skip, etc.).
        if (!handleSystemInfoStatus(res.getStatus(), endpoint, { bruTest, validationLogger, body: (() => { try { return res.getBody(); } catch (_e) { return null; } })() })) return;

        let body;
        try { body = res.getBody(); } catch (_e) {}
        const bodyNotEmpty = Array.isArray(body)
          ? body.length > 0
          : (body != null && typeof body === 'object' && Object.keys(body).length > 0);
        bruTest(`GET ${endpoint} response body is present and not empty`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
          expect(bodyNotEmpty, 'Response array/object should not be empty').to.be.true;
        });

        const productIds = pickProductIds(body);
        bruTest(`GET ${endpoint} response contains at least one product id`, () => {
          expect(productIds.length, 'No product id found in list response').to.be.greaterThan(0);
        });

        if (productIds.length > 0) {
          bru.setEnvVar('productListHasValidData', 'true');
          bru.setEnvVar('productListCandidateIds', JSON.stringify(productIds));
        }
        validationLogger(Array.isArray(body) ? `[INFO] GET ${endpoint} → 200 OK, ${body.length} item(s)` : `[DEBUG] GET ${endpoint} → 200 OK, body received`);

        // ── OSDM compliance (Layer 1): ProductCollectionResponse ──
        // Envelope object → "products" array; every Product has required id,
        // code (strings), owner (CompanyRef string), flexibility (string).
        // type/travelClass are x-extensible-enum strings (type-checked only).
        validateProducts(body).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        validateSchema('Product', body.products, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });
