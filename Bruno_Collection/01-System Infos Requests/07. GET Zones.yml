info:
  name: 07. GET Zones
  type: http
  seq: 7

http:
  method: GET
  url: "{{api_base}}/zones"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { handleSystemInfoStatus, validateZones } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        const endpoint = '/zones';
        // Shared, version-aware status handling (out-of-version 404 → skip, etc.).
        if (!handleSystemInfoStatus(res.getStatus(), endpoint, { bruTest, validationLogger })) return;

        let body;
        try { body = res.getBody(); } catch (_e) {}
        const bodyNotEmpty = Array.isArray(body)
          ? body.length > 0
          : (body != null && typeof body === 'object' && Object.keys(body).length > 0);
        bruTest(`GET ${endpoint} response body is present and not empty`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
          expect(bodyNotEmpty, 'Response array/object should not be empty').to.be.true;
        });
        validationLogger(`[INFO] GET ${endpoint} → 200 OK, ${Array.isArray(body) ? body.length + ' item(s)' : 'body received'}`);

        // ── OSDM compliance (Layer 1): ZoneCollectionResponse ──
        // Envelope object → "zones" array; every ZoneDefinition has required
        // id (string) and carrier (CompanyRef string); name/nutsCodes typed when present.
        validateZones(body).forEach((c) => {
          bruTest(c.name, () => { expect(c.ok, c.message).to.be.true; });
        });
