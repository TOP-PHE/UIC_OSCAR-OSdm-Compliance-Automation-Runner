info:
  name: 00. GET System Version Check
  type: http
  seq: 0

http:
  method: GET
  url: "{{api_base}}/versions"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Import library functions
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { handleSystemInfoStatus } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        // Shared, version-aware status handling. /versions is an OSDM 3.6+
        // endpoint — a 404 when the test-framework version is below 3.6 is
        // reported as out of scope (skipped), not a failure.
        if (!handleSystemInfoStatus(res.getStatus(), '/versions', { bruTest, validationLogger })) return;

        // Parse JSON response safely
        let versionsData;
        try {
          versionsData = res.getBody();
        } catch (e) {
          validationLogger(`[ERROR] Failed to parse /versions response: ${e.message}`);
          bruTest("Parse /versions response as JSON", () => {
            throw new Error(`Failed to parse response: ${e.message}`);
          });
          return;
        }

        // ── OSDM compliance (Layer 1): GET /versions → array<ApiVersion> ──
        // Structural conformance against the OSDM ApiVersion schema: response
        // is an array, has at least one entry, every entry carries a required
        // non-empty "version" string, and optional "sunset" (ISO-8601
        // date-time) / "nextVersion" (object) are well-typed when present.
        // Logic lives in osdmCompliance.js (pure + Jest unit-tested).
        const { validateApiVersions } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
        validateApiVersions(versionsData).forEach((c) => {
          bruTest(c.name, () => {
            if (!c.ok) throw new Error(c.message);
          });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        validateSchema('ApiVersion', versionsData, { endpoint: '/versions' }).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // Extract API versions from response
        const apiVersions = versionsData && versionsData.length > 0 
          ? versionsData.map(v => v.version || v.major + "." + v.minor + "." + (v.patch || "0")).join(", ")
          : "unknown";

        validationLogger(`[INFO] 📌 API versions available: [${apiVersions}]`);
        bru.setEnvVar("apiVersionsAvailable", apiVersions);

        // Get expected OSDM version from environment (set by parseScenarioData)
        const expectedVersion = bru.getEnvVar("osdmVersion");
        const scenarioCode = bru.getEnvVar("scenarioCode") || "N/A";
        
        if (!expectedVersion) {
          validationLogger(`[INFO] osdmVersion not set in environment — skipping consistency check`);
          bruTest("osdmVersion is available for consistency check", () => {
            expect(expectedVersion, "osdmVersion should be set by scenario parser").to.exist;
          });
          return;
        }

        validationLogger(`[INFO] 📋 Expected OSDM version (from data file): "${expectedVersion}"`);

        // Find matching version in response
        let foundMatch = false;
        if (Array.isArray(versionsData)) {
          foundMatch = versionsData.some(v => {
            const versionString = v.version || (v.major + "." + v.minor + "." + (v.patch || "0"));
            return versionString === expectedVersion;
          });
        }

        // Soft consistency check: a mismatch between the data file's
        // osdmVersion and the versions the API advertises is a TEST-CONFIG
        // issue, not provider non-conformance — so it warns without failing
        // the run.
        //
        // Log-audit round 2 rewrite. The old block had three defects:
        //   1. the mismatch narrative was logged at [INFO] — a discrepancy
        //      is a [WARNING];
        //   2. `expect(foundMatch).to.be.false` PASSED green on a mismatch
        //      (inverted assertion standing in for "soft") — the report
        //      showed ✓ with nothing flagging the discrepancy;
        //   3. the match confirmation was tagged `[✅ INFO]` — a malformed
        //      tag the level filter doesn't recognise, so it was DROPPED at
        //      the default INFO logging level (visible only at FULL).
        // Now: honest test title carrying both sides + the verdict, an
        // explicit always-pass body (soft by design), [WARNING] with the
        // action path on mismatch, well-formed [INFO] on match.
        if (!foundMatch) {
          validationLogger(`[WARNING] ⚠️ OSDM version mismatch — the data file expects "${expectedVersion}" but the API advertises [${apiVersions}]. Soft check: the run continues, but version-dependent validations (v3.8 fields, refundSpecifications, …) may not match this provider. Action: align Test Config → OSDM version with the provider's supported versions (or confirm the provider's /versions response).`);
        } else {
          validationLogger(`[INFO] ✅ Version match confirmed: API supports "${expectedVersion}"`);
        }
        bruTest(`OSDM version check (soft): data file "${expectedVersion}" vs API [${apiVersions}] — ${foundMatch ? 'match' : 'MISMATCH (run continues, see [WARNING] in log)'}`, () => {
          // Soft by design — the verdict lives in the title + log line above.
          expect(true).to.eql(true);
        });

        // Store version info for downstream requests to reference
        bru.setEnvVar("systemVersionCheckCompleted", "true");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
