info:
  name: 09. GET Product By ProductId
  type: http
  seq: 9

http:
  method: GET
  url: "{{api_base}}/products/{{productId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const cfgProductId = bru.getEnvVar('productId');
        const productMissing = cfgProductId == null || String(cfgProductId).trim() === '' || /^null$/i.test(String(cfgProductId).trim());
        if (productMissing) {
          let candidates = [];
          try { candidates = JSON.parse(bru.getEnvVar('productListCandidateIds') || '[]'); } catch (_e) {}
          candidates = Array.isArray(candidates) ? candidates.filter(Boolean) : [];

          if (candidates.length > 0) {
            const randomProductId = candidates[Math.floor(Math.random() * candidates.length)];
            bru.setEnvVar('productId', String(randomProductId));
            console.log(`[INFO] productId was null; picked random id from GET Products response: ${randomProductId}`);
          }
        }

    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");

        const endpoint = '/products/{productId}';
        const productId = bru.getEnvVar("productId");
        const statusCode = res.getStatus();

        // ── Status classification FIRST (#355) — shared, version-aware and
        // Problem-body-aware (#353): a provider that 501s this endpoint (or
        // declares it unsupported via a Problem code) gets ONE skip line —
        // not a prerequisite-failure cascade; out-of-version 404s skip;
        // auth/4xx/5xx fail decoded without chai tails. Only a 200 proceeds.
        let body = null;
        try { body = res.getBody(); } catch (_e) {}
        const { handleSystemInfoStatus } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
        if (!handleSystemInfoStatus(statusCode, endpoint, { bruTest, validationLogger, body })) {
          // Cascade-kill: when the id came from a broken GET Products, the
          // root cause already failed loudly THERE — add one context line,
          // no extra failing assertion.
          const productListReady = String(bru.getEnvVar('productListHasValidData') || '').toLowerCase() === 'true';
          const productIdMissing = productId == null || String(productId).trim() === '' || /^null$/i.test(String(productId).trim());
          if (!productListReady || productIdMissing) {
            validationLogger(`[INFO] Context: GET Products did not provide a usable product id (see GET Products above) — this call used ${productIdMissing ? 'no id' : `id ${productId}`}.`);
          }
          return;
        }

        // 200 — handleSystemInfoStatus already registered the "→ 200 OK"
        // assertion; validate the body (no prerequisite gate: a 200 with a
        // body is validatable regardless of how the id was obtained).
        bruTest(`GET ${endpoint} response body is present`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
        });
        validationLogger(`[DEBUG] GET ${endpoint} -> 200 OK, productId=${productId}`);

        // ── OSDM compliance (Layer 1): ProductResponse ──
        // Envelope object wrapping a single Product under "product"; the
        // Product has required id, code (strings), owner (object),
        // flexibility (string). Extensible-enum fields type-checked only.
        const { validateProduct } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");
        validateProduct(body).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        validateSchema('Product', body.product, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });
