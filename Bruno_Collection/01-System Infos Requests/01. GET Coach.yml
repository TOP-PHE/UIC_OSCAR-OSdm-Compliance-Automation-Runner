info:
  name: 01. GET Coach
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_base}}/{{coachLayoutsResource}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Endpoint selection by the NEGOTIATED OSDM version (>= 3.8 → the
        // coach-deck-layouts resource, else legacy coach-layouts). Version
        // resolution is centralised in osdmVersion.js (issue #105). NB this is
        // the negotiated/effective version, NOT the compliance version.
        const { resolveEffectiveVersion, atLeast } = require(bru.getEnvVar("library_base") + "osdmVersion.js");
        bru.setVar('coachLayoutsResource', atLeast(resolveEffectiveVersion(), '3.8.0') ? 'coach-deck-layouts' : 'coach-layouts');

    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { handleSystemInfoStatus, validateCoachLayouts, validateCoachDeckLayouts } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        const resource = bru.getVar('coachLayoutsResource') || 'coach-layouts';
        const endpoint = `/${resource}`;

        // Reset coach list markers for this request execution
        bru.setEnvVar('coachListHasValidData', 'false');
        bru.setEnvVar('coachListCandidateIds', '[]');

        function pickCoachIds(body) {
          const ids = [];
          const add = (v) => {
            const s = v == null ? '' : String(v).trim();
            if (!s || /^null$/i.test(s) || ids.includes(s)) return;
            ids.push(s);
          };

          const fromArr = (arr) => {
            if (!Array.isArray(arr)) return;
            arr.forEach(item => {
              if (!item || typeof item !== 'object') return;
              add(item.layoutId);
              add(item.id);
            });
          };

          const fromObj = (obj) => {
            if (!obj || typeof obj !== 'object') return;
            add(obj.layoutId);
            add(obj.id);
          };

          if (Array.isArray(body)) fromArr(body);
          if (body && typeof body === 'object') {
            fromArr(body.coachLayouts);
            fromArr(body.coachDeckLayouts);
            fromArr(body.layouts);
            fromArr(body.items);

            // Some implementations return a wrapped single layout even on list endpoint.
            fromObj(body.coachLayout);
            fromObj(body.coachDeckLayout);
            fromObj(body.layout);

            // Fallback when endpoint returns a single object directly.
            fromObj(body);
          }

          return ids;
        }

        // Shared, version-aware status handling (out-of-version 404 → skip, etc.).
        if (!handleSystemInfoStatus(res.getStatus(), endpoint, { bruTest, validationLogger })) return;

        let body;
        try { body = res.getBody(); } catch (_e) {}
        const bodyNotEmpty = Array.isArray(body)
          ? body.length > 0
          : (body != null && typeof body === 'object' && Object.keys(body).length > 0);
        bruTest(`GET ${endpoint} response body is present and not empty`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
          expect(bodyNotEmpty, 'Response array/object should not be empty').to.be.true;
        });

        const coachIds = pickCoachIds(body);
        bruTest(`GET ${endpoint} response contains at least one coach/layout id`, () => {
          expect(coachIds.length, 'No coach/layout id found in list response').to.be.greaterThan(0);
        });

        if (coachIds.length > 0) {
          bru.setEnvVar('coachListHasValidData', 'true');
          bru.setEnvVar('coachListCandidateIds', JSON.stringify(coachIds));
        }
        validationLogger(`[INFO] GET ${endpoint} → 200 OK, ${Array.isArray(body) ? body.length + ' item(s)' : 'body received'}`);

        // ── OSDM compliance (Layer 1): Coach(Deck)LayoutCollectionResponse ──
        // Resource depends on the effective OSDM version: coach-deck-layouts
        // (>=3.8) → CoachDeckLayout items under "coachDeckLayouts"; otherwise
        // coach-layouts → CoachLayout items under "layouts".
        const coachChecks = (resource === 'coach-deck-layouts')
          ? validateCoachDeckLayouts(body, endpoint)
          : validateCoachLayouts(body, endpoint);
        coachChecks.forEach((c) => {
          bruTest(c.name, () => { expect(c.ok, c.message).to.be.true; });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        const coachComponent = (resource === 'coach-deck-layouts') ? 'CoachDeckLayout' : 'CoachLayout';
        const coachItems = (resource === 'coach-deck-layouts') ? body.coachDeckLayouts : body.layouts;
        validateSchema(coachComponent, coachItems, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { expect(c.ok, c.message).to.be.true; });
        });
