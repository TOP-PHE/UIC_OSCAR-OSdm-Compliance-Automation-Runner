info:
  name: 10. GET Product Tags
  type: http
  seq: 10

http:
  method: GET
  url: "{{api_base}}/product-tags"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");
        const { handleSystemInfoStatus, validateProductTags } = require(bru.getEnvVar("library_base") + "osdmCompliance.js");

        const endpoint = '/product-tags';
        // Shared, version-aware status handling (product-tags is 3.5+ → a 404
        // below 3.5 is reported as out of scope, not a failure).
        if (!handleSystemInfoStatus(res.getStatus(), endpoint, { bruTest, validationLogger })) return;

        let body;
        try { body = res.getBody(); } catch (_e) {}
        const bodyNotEmpty = Array.isArray(body)
          ? body.length > 0
          : (body != null && typeof body === 'object' && Object.keys(body).length > 0);
        bruTest(`GET ${endpoint} response body is present and not empty`, () => {
          expect(body, 'Response body should not be null/undefined').to.exist;
          expect(bodyNotEmpty, 'Response array/object should not be empty').to.be.true;
        });
        validationLogger(`[INFO] GET ${endpoint} → 200 OK, ${Array.isArray(body) ? body.length + ' item(s)' : 'body received'}`);

        // ── OSDM compliance (Layer 1): ProductTagsResponse ──
        // Non-standard dual-array shape: required productTagNames[] (each with
        // tag string + description Text object) and productTagGroups[] (each
        // with code string + description Text object).
        validateProductTags(body).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });

        // ── OSDM compliance (Layer 2): deep, version-matched schema ──
        const { validateSchema } = require(bru.getEnvVar("library_base") + "osdmSchema.js");
        validateSchema('ProductTagName', body.productTagNames, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });
        validateSchema('ProductTagGroup', body.productTagGroups, { endpoint }).forEach((c) => {
          bruTest(c.name, () => { if (!c.ok) throw new Error(c.message); });
        });
