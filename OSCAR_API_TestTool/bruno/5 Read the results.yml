info:
  name: 5 Read the results
  type: http
  seq: 5

http:
  method: GET
  url: "{{oscar_url}}/v1/api/test-requests/{{test_request_id}}/results"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        await require('./lib/oscarApi.js').ensureToken(bru);
    - type: after-response
      code: |-
        // The verdict, then each run not passed and its failed checks. The answer
        // also holds the warnings and the known deviations of each run.
        const api = require('./lib/oscarApi.js');
        const body = res.getBody();
        for (const line of api.reportLines(body)) console.log(line);
        test('the verdict is passed', () => {
          expect(res.getStatus()).to.equal(200);
          expect(body.verdict).to.equal('passed');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
