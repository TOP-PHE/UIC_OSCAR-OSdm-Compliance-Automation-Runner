http:
  method: GET
  url: "{{oscar_url}}/v1/api/test-requests/{{test_request_id}}/results?format=junit"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Accept
      value: application/xml
  auth: inherit

runtime:
  scripts:
    - type: before-request
