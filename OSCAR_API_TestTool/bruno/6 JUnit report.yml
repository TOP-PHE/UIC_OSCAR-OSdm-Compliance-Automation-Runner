      code: |-
        // The same results as JUnit XML, for a CI's test report.
        test('OSCAR gives the JUnit report', () => {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
