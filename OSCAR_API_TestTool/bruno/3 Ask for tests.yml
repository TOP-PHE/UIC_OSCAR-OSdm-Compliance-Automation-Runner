info:
  name: 3 Ask for tests
  type: http
  seq: 3

http:
  method: POST
  url: "{{oscar_url}}/v1/api/test-requests"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Idempotency-Key
      value: "{{idempotency_key}}"
  body:
    type: json
    data: |
      {{test_request_body}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // A suite when the environment names one, else the scenario codes. The
        // Idempotency-Key makes a retry of this request run nothing twice.
        const api = require('./lib/oscarApi.js');
        await api.ensureToken(bru);
        bru.setVar('test_request_body', JSON.stringify(api.testRequestBody({
          providerId: bru.getVar('provider_id'),
          scenarios: bru.getEnvVar('scenarios'),
          suite: bru.getEnvVar('suite'),
          reference: bru.getEnvVar('reference'),
        })));
        bru.setVar('idempotency_key', 'bruno-' + require('crypto').randomUUID());
        bru.setVar('wait_tries', '0');
    - type: after-response
      code: |-
        // 202: queued; 200: the same request was already made with this key.
        const body = res.getBody();
        test('OSCAR takes the test request', () => {
          expect([200, 202]).to.include(res.getStatus());
        });
        if (res.getStatus() === 200 || res.getStatus() === 202) {
          bru.setVar('test_request_id', body.id);
          for (const p of body.providers || []) {
            console.log(`${p.name}: ${p.runs.length} run(s)${p.not_found.length ? ' — not on this provider: ' + p.not_found.join(', ') : ''}`);
          }
        } else {
          console.log(`Refused (HTTP ${res.getStatus()}): ${body?.detail || JSON.stringify(body)}`);
          bru.runner.stopExecution();
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
