info:
  name: 2 Find the provider
  type: http
  seq: 2

http:
  method: GET
  url: "{{oscar_url}}/v1/api/key"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        await require('./lib/oscarApi.js').ensureToken(bru);
    - type: after-response
      code: |-
        // The account, its company and the providers it may test, with their ids.
        const api = require('./lib/oscarApi.js');
        let providerId = null;
        let error = 'ok';
        try {
          providerId = api.providerIdOf(res.getBody(), bru.getEnvVar('provider'));
        } catch (e) {
          error = e.message;
        }
        test('the account may test the provider named', () => {
          expect(res.getStatus()).to.equal(200);
          expect(error).to.equal('ok');
        });
        if (providerId) bru.setVar('provider_id', providerId);
        else bru.runner.stopExecution();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
