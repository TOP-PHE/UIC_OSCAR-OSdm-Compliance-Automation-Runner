# ── SonarCloud project identification ────────────────────────────────────────
# Replace the organization slug below once the repo transfers to UICrail.
# Until then sonar.organization should match whatever org you registered in
# SonarCloud — `top-phe` works for the temporary repo.
sonar.projectKey=TOP-PHE_UIC_OSCAR_Temporary
sonar.organization=top-phe
sonar.projectName=OSCAR
# Keep in step with Oscar_Server/package.json. Sonar's "Previous version" new-code
# period keys off this, so a stale version makes almost the whole codebase count
# as "new" (it was pinned at 1.2.0 while the server was 1.11.x, which is why the
# main-branch gate graded ~28k legacy lines as new code).
sonar.projectVersion=1.11.178

# ── What to analyze ──────────────────────────────────────────────────────────
# The Node.js server PLUS the Bruno scenario engine. The Bruno collection's
# .bru files are data Sonar can't usefully lint — but Bruno_Collection/library-bruno
# is ~6.4k lines of real JavaScript (scenarioParser, requestsBuilder, offers,
# refunds, bookings, exchanges, validators, reportGenerator, mergeReport,
# loopback, …) that drives every test run. It was previously excluded wholesale
# as "data", leaving OSCAR's most logic-heavy and incident-prone code with zero
# Sonar coverage. It is now in scope. (The .bru files, json_validator data and
# Validation_Reports stay out — they are simply not in this sources list.)
sonar.sources=Oscar_Server/src,Oscar_Server/public,Bruno_Collection/library-bruno,OSDM_Simulator/src,OSDM_Simulator/server.js,OSDM_Simulator/scripts
sonar.tests=Oscar_Server/tests,OSDM_Simulator/tests

# Coverage report — Jest writes lcov.info under coverage/ when run with
# --coverage. The CI sonar.yml workflow runs `jest --coverage` before
# invoking the Sonar scanner so this file is fresh.
#
# Since #754 Jest writes the paths in lcov.info from the repository root
# (`projectRoot: '..'` in Oscar_Server/package.json), e.g.
#   Oscar_Server/src/server.js, Bruno_Collection/library-bruno/offers.js
# which is Sonar's projectBaseDir, as the simulator's report already did.
# Jest's rootDir is the repository root and its provider is v8: the babel
# provider does not instrument files outside Oscar_Server/, so
# library-bruno never reached the report.
sonar.javascript.lcov.reportPaths=Oscar_Server/coverage/lcov.info,OSDM_Simulator/coverage/lcov.info
# Tell the JS sensor where the lcov file's relative paths anchor.
sonar.javascript.coveragePlugin=lcov

# ── Exclusions ───────────────────────────────────────────────────────────────
# Don't analyze:
#   - node_modules (third-party)
#   - Sonar's own .scannerwork
#   - DB schema (treated as data, not code)
# NOTE: the blanket `Bruno_Collection/**` exclude was removed. The sources list
# above is the allowlist — only Bruno_Collection/library-bruno is analyzed; the
# rest of Bruno_Collection (.bru scenarios, environments, json_validator data,
# Validation_Reports) is never in scope, so no exclude is needed for it.
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  Documentation/**,\
  **/.scannerwork/**,\
  Oscar_Server/src/db/schema.sql,\
  Oscar_Server/public/vendor/**

# Don't measure coverage on:
#   - tests themselves (Jest's own files)
#   - the static UI HTML (Sonar can't run it)
#   - DB schema (data)
# The Bruno scenario engine (library-bruno) is measured since #754: about 40
# tests/unit/bruno-*.test.js files run it, and a PR that changes it is held
# to the new-code coverage bar like server code.
sonar.coverage.exclusions=\
  Oscar_Server/tests/**,\
  Oscar_Server/public/**,\
  Oscar_Server/src/db/schema.sql

# ── Copy-paste (duplication) exclusions ──────────────────────────────────────
# osdmSchemas.js is a GENERATED file (its own header says "do not hand-edit"):
# compact JSON-Schema descriptors repeated once per published OSDM version
# (v3.4–v3.8), so the version-to-version blocks are ~identical by design. That
# single file accounted for ~2,288 of the project's ~2,585 duplicated lines and
# was the sole reason new_duplicated_lines_density exceeded the gate. It stays
# ANALYZED for bugs/smells — only copy-paste detection is turned off for it.
#
# The HTML pages (#806): each page is a copy of the others, with the same
# banner block and inline styles, so any line changed inside that block counts
# as new duplicated code (18.6% for the two logo lines of #805). Their issues
# are still analysed. Remove this line once #807 shares the banner and styles.
sonar.cpd.exclusions=\
  Bruno_Collection/library-bruno/osdmSchemas.js,\
  Bruno_Collection/library-bruno/osdmRequestSchemas.js,\
  Oscar_Server/public/*.html

# ── SCM / new-code definition ────────────────────────────────────────────────
# Sonar's "new code" detection compares against the previous version. Use the
# Git-based approach so any commit on `main` since the last tagged release
# counts as "new code" for the quality gate.
sonar.scm.provider=git

# ── Quality-gate thresholds (issue #85 decision, 2026-05-20) ─────────────────
# These conditions live in the SonarCloud quality gate (Project → Quality Gate,
# or the org gate), NOT in this file — recorded here so the rationale is under
# version control.
#
# OSCAR is a conformance-test runner. The *measured* surface is Oscar_Server/src
# and, since #754, the Bruno scenario engine (library-bruno/**, run by the
# tests/unit/bruno-*.test.js files outside Bruno's sandbox). The static UI
# (public/**) stays coverage-excluded above. The
# default "Sonar way" new-code bar (coverage 80%, duplication <3%) is unrealistic
# for this shape, so a custom gate ("OSCAR Gate") is assigned to the project with:
#     new_coverage                  >= 83%   (ratcheted up from 35%; was 80%)
#     new_duplicated_lines_density  <  4%    (was 3%)
# The floor is meant to ratchet UP as coverage grows, never to stay put.
# History:
#   - 35%  (2026-05-20): a floor just below the then-measured ~38% new-code
#          coverage on Oscar_Server/src — enough to stop new code regressing.
#   - 50%  (2026-07-01, batch 1): integration tests for the three untested route
#          files (company-test-resources, reports, company-test-framework) took
#          overall Oscar_Server/src line coverage ~50% -> ~59%.
#   - 55%  (2026-07-01, batch 2): tests for structureResults + versionInfo, and
#          the auth route's password-reset/logout/sso-check/bootstrap paths,
#          took overall coverage ~59% -> ~65%.
#   - 65%  (2026-07-01, batch 3): extended tests for runs.js (the single biggest
#          gap, ~35% -> ~87%), admin.js (~60% -> ~89%) and company.js
#          (~58% -> ~84%) took overall coverage ~65% -> ~74%.
#   - 68%  (2026-07-02, batch 4): mailer.js (0% -> 100%, previously untested),
#          middleware/auth.js (~62% -> 100%) and worker/auth-profiles.js
#          (~85% -> ~99%) took overall coverage ~74% -> ~77%.
#   - 74%  (2026-07-02, batch 5): worker/runner.js — the Bruno CLI orchestrator
#          and single largest remaining gap (388 uncovered lines, 16% covered) —
#          taken to ~68% via a fully-mocked child_process.spawn (never a real
#          subprocess) driving executeRun()'s auth/datafile/env-write failure
#          paths, exit-code handling, HTML/JSON artifact linking (incl. the
#          mergeReport.js fallback), auth/token-format CLI-output detection,
#          the emergency-stop terminal-state guard, and a real (short,
#          config-driven) timeout-kill test. took overall coverage ~77% -> ~83%.
#   - 83%  (2026-07-02, batch 6): server.js — the Express app entry point
#          (236 uncovered lines, 0% covered; the only remaining major gap) —
#          taken to ~83% via supertest against the real exported `app`
#          (requiring the module once triggers its real, unmocked startup —
#          DB/JWT-secret bootstrap, queue wiring, a real app.listen() on a
#          dedicated test port never dialed by supertest itself), covering
#          /health, /metrics, the datafile + artifact download routes (incl.
#          tenant-ownership and loopback-bypass branches), the loopback
#          token-refresh endpoint, route-mounting wiring, and — via one
#          isolated NODE_ENV=production re-require on a second port — the
#          HTTPS-redirect middleware (Sonar S5146 guard). Deliberately out of
#          scope: the process.exit(1) missing-env-var path, the Alertmanager
#          startup seed hook, static/SPA serving, and the global error
#          handler (no non-invasive way to force an unhandled throw through a
#          real mounted route). took overall coverage ~83% -> ~88%.
#   NOTE: this file only DOCUMENTS the number — bump the actual condition in
#   SonarCloud (Project -> Quality Gate -> OSCAR Gate -> new_coverage) to match.
#   #754 — library-bruno measured (exclusion removed, Jest rootDir at the
#          repository root, v8 provider): 44 of its modules reached by the
#          tests, ~81% of their lines; Oscar_Server/src ~95% under v8. The
#          modules no test loads yet (reportGenerator, mergeReport, loopback,
#          schema, …) count as uncovered. Raise it PR after PR.

# ── Source encoding ──────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
