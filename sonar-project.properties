# ── SonarCloud project identification ────────────────────────────────────────
# Replace the organization slug below once the repo transfers to UICrail.
# Until then sonar.organization should match whatever org you registered in
# SonarCloud — `top-phe` works for the temporary repo.
sonar.projectKey=TOP-PHE_UIC_OSCAR_Temporary
sonar.organization=top-phe
sonar.projectName=OSCAR
sonar.projectVersion=1.2.0

# ── What to analyze ──────────────────────────────────────────────────────────
# The Node.js server PLUS the Bruno scenario engine. The Bruno collection's
# .bru files are data Sonar can't usefully lint — but Bruno_Collection/library-bruno
# is ~6.4k lines of real JavaScript (scenarioParser, requestsBuilder, offers,
# refunds, bookings, exchanges, validators, reportGenerator, mergeReport,
# loopback, …) that drives every test run. It was previously excluded wholesale
# as "data", leaving OSCAR's most logic-heavy and incident-prone code with zero
# Sonar coverage. It is now in scope. (The .bru files, json_validator data and
# Validation_Reports stay out — they are simply not in this sources list.)
sonar.sources=Oscar_Server/src,Oscar_Server/public,Bruno_Collection/library-bruno
sonar.tests=Oscar_Server/tests

# Coverage report — Jest writes lcov.info under coverage/ when run with
# --coverage. The CI sonar.yml workflow runs `jest --coverage` before
# invoking the Sonar scanner so this file is fresh.
#
# The lcov format records paths relative to the directory Jest was
# invoked in (Oscar_Server/), so paths inside lcov.info look like
#   tests/helpers/test-app.js
# Sonar resolves them relative to projectBaseDir (the repo root) and
# would look for "tests/helpers/test-app.js" — which doesn't match
# the actual file at "Oscar_Server/tests/helpers/test-app.js".
# Setting sonar.tests AND giving Sonar the lcov.info path is enough
# for source-attribution — but Sonar also needs to know the lcov
# basedir so the relative paths inside resolve correctly.
sonar.javascript.lcov.reportPaths=Oscar_Server/coverage/lcov.info
# Tell the JS sensor where the lcov file's relative paths anchor.
sonar.javascript.coveragePlugin=lcov

# ── Exclusions ───────────────────────────────────────────────────────────────
# Don't analyze:
#   - node_modules (third-party)
#   - Sonar's own .scannerwork
#   - DB schema (treated as data, not code)
# NOTE: the blanket `Bruno_Collection/**` exclude was removed. The sources list
# above is the allowlist — only Bruno_Collection/library-bruno is analyzed; the
# rest of Bruno_Collection (.bru scenarios, environments, json_validator data,
# Validation_Reports) is never in scope, so no exclude is needed for it.
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  Documentation/**,\
  **/.scannerwork/**,\
  Oscar_Server/src/db/schema.sql

# Don't measure coverage on:
#   - tests themselves (Jest's own files)
#   - the static UI HTML (Sonar can't run it)
#   - the Bruno scenario engine — it's now ANALYZED for bugs/smells/complexity,
#     but it has no Jest harness yet, so measuring its coverage would just drag
#     the coverage metric down for reasons unrelated to code quality. Add a test
#     harness later, then drop this line to start gating its coverage too.
#   - DB schema (data)
sonar.coverage.exclusions=\
  Oscar_Server/tests/**,\
  Oscar_Server/public/**,\
  Bruno_Collection/library-bruno/**,\
  Oscar_Server/src/db/schema.sql

# ── SCM / new-code definition ────────────────────────────────────────────────
# Sonar's "new code" detection compares against the previous version. Use the
# Git-based approach so any commit on `main` since the last tagged release
# counts as "new code" for the quality gate.
sonar.scm.provider=git

# ── Quality-gate thresholds (issue #85 decision, 2026-05-20) ─────────────────
# These conditions live in the SonarCloud quality gate (Project → Quality Gate,
# or the org gate), NOT in this file — recorded here so the rationale is under
# version control.
#
# OSCAR is a conformance-test runner. The *measured* surface is Oscar_Server/src;
# its two largest, hardest-to-unit-test layers are intentionally coverage-
# excluded above — the static UI (public/**) and the Bruno scenario engine
# (library-bruno/**, which only executes inside Bruno's QuickJS sandbox). The
# default "Sonar way" new-code bar (coverage 80%, duplication <3%) is unrealistic
# for this shape, so a custom gate ("OSCAR Gate") is assigned to the project with:
#     new_coverage                  >= 35%   (was 80%)
#     new_duplicated_lines_density  <  4%    (was 3%)
# 35% is a deliberate FLOOR just below the current measured new-code coverage
# (~38% on Oscar_Server/src) — it exists to stop new code regressing, and is
# meant to ratchet up over time, not stay there. Coverage is raised
# incrementally rather than gated to 80% in one shot: a Jest
# harness now exercises library-bruno's pure builders (envUtils, requestsBuilder,
# scenarioParser) plus the server reconcile / stop-all paths. The library-bruno
# coverage exclusion stays until enough of the engine is covered to gate it
# without dragging the number down. Ratchet the threshold back up as coverage
# grows.

# ── Source encoding ──────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
