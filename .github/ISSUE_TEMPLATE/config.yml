# Customise the GitHub New Issue chooser. Disables the blank "open empty
# issue" option and adds a security-disclosure link that routes to the
# private advisory flow instead of a public issue.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability (private disclosure)
    url: https://github.com/TOP-PHE/UIC_OSCAR_Temporary/security/advisories/new
    about: |
      Please report security vulnerabilities through GitHub's private
      Security Advisories. Do NOT open a public issue for security bugs.
      See SECURITY.md at the repo root for full disclosure policy.

  - name: Operations / deployment question
    url: https://github.com/TOP-PHE/UIC_OSCAR_Temporary/blob/main/Documentation/Server_Operations/installation-guide.md
    about: |
      Read the installation and operations guides first. They cover the
      common Docker / nginx / GHCR / Watchtower questions.
