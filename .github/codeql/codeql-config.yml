# CodeQL configuration — referenced from .github/workflows/codeql.yml via
# init.config-file. Keeps the workflow declarative and centralises path
# rules.
name: "OSCAR CodeQL config"

# Paths to EXCLUDE from analysis. Inclusions are still driven by the
# workflow's path-filter (Oscar_Server/**); these are precise drops.
paths-ignore:
  # Vendored third-party front-end bundles (e.g. vanilla-jsoneditor v3.12.0).
  # These are minified ES modules from upstream — not OSCAR code, not our
  # responsibility to maintain, and CodeQL noise on minified code is
  # actively misleading.
  - "Oscar_Server/public/vendor/**"
