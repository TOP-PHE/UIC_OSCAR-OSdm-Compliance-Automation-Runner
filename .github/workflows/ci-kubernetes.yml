name: CI · Kubernetes

# #1059: OSCAR on a Kubernetes cluster, as OSCAR_Deploy/kubernetes/ deploys
# it. A kind cluster on the runner; the base under an OpenShift-style uid
# (restricted pod security), driven through the API by ci/smoke.sh against
# the OSDM simulator; then the plain Kubernetes overlay.
# Two jobs check the VPS's own set-up on the runner: nginx (its proxy
# example) and docker-host (restarts and logs with no Docker socket in a
# container, #1434).
# Two scans read the set-up (#1438): Kubescape the manifests an operator
# applies (job kubescape), kube-bench the k3s the guide installs (job k3s).
# A finding fails unless OSCAR_Deploy/kubernetes/scans/accepted.json accepts
# it, with its reason.
#
# Not a required check: it runs when what it tests changes, and every week
# (a change elsewhere, a new runner image), so that a failure here never holds
# an unrelated pull request.
on:
  pull_request:
    branches: [main]
    paths:
      - 'OSCAR_Deploy/kubernetes/**'
      - 'Oscar_Server/Dockerfile'
      - 'Oscar_Server/.dockerignore'
      - 'Oscar_Server/bruno-cli/**'
      - 'Oscar_Server/src/server.js'
      - 'Oscar_Server/src/utils/clusterSettings.js'
      - 'Oscar_Server/src/worker/**'
      - 'Oscar_Server/src/runner-agent/**'
      - 'Oscar_Server/src/run-pod/**'
      - 'Oscar_Server/src/run-dispatcher/**'
      - 'Oscar_Server/src/utils/runAgentPeer.js'
      # Monitoring on k3s (#1147): the VPS's dashboards, Loki configuration
      # and alerts go to the cluster too, and Grafana's sign-in is OSCAR's.
      - 'OSCAR_Deploy/grafana/**'
      - 'OSCAR_Deploy/loki/**'
      - 'OSCAR_Deploy/prometheus/alerts/**'
      # The VPS's proxy: its example file is run on a real nginx (job nginx).
      - 'OSCAR_Deploy/nginx/**'
      # The VPS's Docker host: restarts and logs without the Docker socket in a
      # container (job docker-host, #1434).
      - 'OSCAR_Deploy/docker-compose*.yml'
      - 'OSCAR_Deploy/promtail/**'
      - 'OSCAR_Deploy/scripts/oscar-autoheal*.sh'
      - 'Oscar_Server/src/api/routes/auth.js'
      - '.github/workflows/ci-kubernetes.yml'
  push:
    branches: [main]
    paths:
      - 'OSCAR_Deploy/kubernetes/**'
      - 'Oscar_Server/Dockerfile'
      - 'Oscar_Server/.dockerignore'
      - 'Oscar_Server/bruno-cli/**'
      - 'Oscar_Server/src/server.js'
      - 'Oscar_Server/src/utils/clusterSettings.js'
      - 'Oscar_Server/src/worker/**'
      - 'Oscar_Server/src/runner-agent/**'
      - 'Oscar_Server/src/run-pod/**'
      - 'Oscar_Server/src/run-dispatcher/**'
      - 'Oscar_Server/src/utils/runAgentPeer.js'
      # Monitoring on k3s (#1147): the VPS's dashboards, Loki configuration
      # and alerts go to the cluster too, and Grafana's sign-in is OSCAR's.
      - 'OSCAR_Deploy/grafana/**'
      - 'OSCAR_Deploy/loki/**'
      - 'OSCAR_Deploy/prometheus/alerts/**'
      # The VPS's proxy: its example file is run on a real nginx (job nginx).
      - 'OSCAR_Deploy/nginx/**'
      # The VPS's Docker host: restarts and logs without the Docker socket in a
      # container (job docker-host, #1434).
      - 'OSCAR_Deploy/docker-compose*.yml'
      - 'OSCAR_Deploy/promtail/**'
      - 'OSCAR_Deploy/scripts/oscar-autoheal*.sh'
      - 'Oscar_Server/src/api/routes/auth.js'
      - '.github/workflows/ci-kubernetes.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The k3s the guide "OSCAR - k3s on one VPS" installs (the same version:
  # kubernetes-manifests.test.js).
  K3S_VERSION: v1.36.6+k3s1

jobs:
  kind:
    name: Kubernetes deployment (kind)
    # Pinned: kind, kubectl and jq come with this image; ubuntu-latest moves
    # to 26.04 in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Tools on the runner
        run: |
          kind version
          kubectl version --client
          jq --version

      - name: Build the images (build-images.sh)
        run: OSCAR_Deploy/kubernetes/build-images.sh local ci

      - name: The image under a uid it was not built for (Docker, no volume)
        # The image's own data directory, without a volume over it: what the
        # Dockerfile's group-0 permissions are for.
        run: |
          docker run -d --name uid-check --user 1000740000:0 \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e COLLECTION_PATH=/collection -e BRU_CMD=/usr/local/bin/bru \
            -e COMPATIBILITY_FILE=/app/compatibility.json -e HOME=/tmp \
            -p 127.0.0.1:3101:3001 local/oscar:ci
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o "$RUNNER_TEMP/health.json" http://127.0.0.1:3101/health; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs uid-check; exit 1; fi
          jq -e '.checks.database.ok and .checks.data_dir.ok' "$RUNNER_TEMP/health.json"
          docker exec uid-check id
          docker rm -f uid-check

      - name: Start the OSDM simulator on the runner
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "SIM_SECRET=$secret" >> "$GITHUB_ENV"
          jq -n --arg s "$secret" '{gamma: [{client_id: "gamma.tstmgr01", client_secret: $s}]}' > "$RUNNER_TEMP/clients.json"
          SIM_HOST=0.0.0.0 SIM_PORT=3002 SIM_CLIENTS_FILE="$RUNNER_TEMP/clients.json" \
            nohup node OSDM_Simulator/server.js > "$RUNNER_TEMP/simulator.log" 2>&1 &
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3002/healthz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/simulator.log"
          exit 1

      # #1446: the VPS's own compose file (isolated mode, as production), with
      # the image this job built: a scenario passes with both containers
      # read-only, and neither writes off its volumes.
      - name: The VPS's compose file, read-only, runs a scenario (#1446)
        run: |
          set -euo pipefail
          cd OSCAR_Deploy
          node_ip=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')
          boot=$(openssl rand -hex 24); metrics=$(openssl rand -hex 32)
          echo "::add-mask::$boot"; echo "::add-mask::$metrics"
          cp .env.example .env
          {
            echo "OSCAR_IMAGE_DIGEST=sha256:$(printf '%064d' 0)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PLATFORM_BOOTSTRAP_TOKEN=$boot"
            echo "METRICS_TOKEN=$metrics"
            echo "ALLOW_PRIVATE_TARGETS=1"
            echo "RUN_ISOLATION=isolated"
            echo "RUN_AGENT_TOKEN=$(openssl rand -hex 32)"
            echo "COMPOSE_PROFILES=isolated"
          } >> .env
          # The image this job built, in place of the published digest.
          printf 'services:\n  oscar:\n    image: local/oscar-server:ci\n  oscar-runner:\n    image: local/oscar-server:ci\n' > "$RUNNER_TEMP/ci-image.yml"
          mkdir -p data && sudo chown 1000:1000 data
          compose() { docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-image.yml" "$@"; }
          compose up -d
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 2
          done
          test "$(docker inspect oscar --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(docker inspect oscar-runner --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          OSCAR_URL=http://127.0.0.1:3001 SIM_BASE="http://$node_ip:3002" BOOTSTRAP_TOKEN="$boot" METRICS_TOKEN="$metrics" \
            OSCAR_CONTAINER=oscar SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account-vps.json" kubernetes/ci/smoke.sh \
            || { docker logs oscar | tail -n 80; docker logs oscar-runner | tail -n 40; exit 1; }
          for c in oscar oscar-runner; do
            if docker exec "$c" sh -c 'touch /app/.write-check' 2> /dev/null; then echo "$c can write its root file system"; exit 1; fi
            if docker logs "$c" 2>&1 | grep -E 'EROFS|read-only file system'; then echo "$c tried to write off its volumes"; exit 1; fi
          done
          compose down -v
          sudo rm -rf data .env

      - name: Create the kind cluster
        run: |
          kind create cluster --name oscar --wait 180s
          kind load docker-image local/oscar:ci --name oscar
          # Pods reach the runner (and so the simulator) at the gateway of
          # kind's Docker network.
          gateway=$(docker network inspect kind --format '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -v ':' | grep -m1 .)
          echo "SIM_BASE=http://$gateway:3002" >> "$GITHUB_ENV"

      - name: Deploy as OpenShift runs it (ci/openshift-like)
        run: |
          kubectl create namespace oscar
          kubectl label namespace oscar pod-security.kubernetes.io/enforce=restricted
          boot=$(openssl rand -hex 24)
          metrics=$(openssl rand -hex 32)
          echo "::add-mask::$boot"
          echo "::add-mask::$metrics"
          echo "BOOTSTRAP_TOKEN=$boot" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$metrics" >> "$GITHUB_ENV"
          # The keys the data move (oscar-data.sh, below) takes along, as a
          # VPS's .env goes with its data.
          key=$(openssl rand -hex 32)
          jwt=$(openssl rand -hex 64)
          echo "::add-mask::$key"
          echo "::add-mask::$jwt"
          echo "MOVED_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
          echo "MOVED_JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nPLATFORM_BOOTSTRAP_TOKEN=%s\nMETRICS_TOKEN=%s\n' \
            "$key" "$jwt" "$boot" "$metrics" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar apply -k OSCAR_Deploy/kubernetes/ci/openshift-like
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- id -u)" = 1000740000
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- id -g)" = 0

      - name: The runner holds none of the server's data, secrets or processes
        run: |
          r() { kubectl -n oscar exec deploy/oscar -c runner -- "$@"; }
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- printenv RUN_ISOLATION)" = isolated
          # No secret of the server in its environment.
          for k in ENCRYPTION_KEY JWT_SECRET PLATFORM_BOOTSTRAP_TOKEN METRICS_TOKEN SMTP_PASS; do
            if r printenv "$k" > /dev/null; then echo "the runner holds $k"; exit 1; fi
          done
          # No database: the data volume is not mounted there.
          r node -e "process.exit(require('node:fs').existsSync('/app/data/oscar.db') ? 1 : 0)"
          # No server process in its view.
          r node -e "
            const fs = require('node:fs');
            const seen = fs.readdirSync('/proc').filter(p => /^\d+$/.test(p))
              .map(p => { try { return fs.readFileSync('/proc/' + p + '/cmdline', 'utf8'); } catch { return ''; } });
            if (seen.some(c => c.includes('src/' + 'server.js'))) { console.error(seen); process.exit(1); }
          "

      - name: Run a scenario through the API (ci/smoke.sh)
        run: |
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account.json" \
            OSCAR_Deploy/kubernetes/ci/smoke.sh
          # #1441: neither container can write its root file system, and no
          # write was refused (a path off the volumes would log EROFS).
          for c in oscar runner; do
            if kubectl -n oscar exec deploy/oscar -c "$c" -- sh -c 'touch /app/.write-check' 2> /dev/null; then
              echo "$c can write its root file system"; exit 1
            fi
            if kubectl -n oscar logs deploy/oscar -c "$c" | grep -E 'EROFS|read-only file system'; then
              echo "$c tried to write off its volumes"; exit 1
            fi
          done

      - name: Deploy the Kubernetes overlay (ci/kubernetes)
        # With the first deployment's keys: the data moves here below.
        run: |
          kubectl create namespace oscar-k8s
          kubectl label namespace oscar-k8s pod-security.kubernetes.io/enforce=restricted
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nMETRICS_TOKEN=%s\n' \
            "$MOVED_ENCRYPTION_KEY" "$MOVED_JWT_SECRET" "$(openssl rand -hex 32)" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar-k8s create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar-k8s create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar-k8s apply -k OSCAR_Deploy/kubernetes/ci/kubernetes
          kubectl -n oscar-k8s rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar-k8s exec deploy/oscar -c oscar -- id -u)" = 1000
          test "$(kubectl -n oscar-k8s exec deploy/oscar -c runner -- id -u)" = 1000
          kubectl -n oscar-k8s get ingress oscar

      - name: The data moves from one deployment to another (oscar-data.sh)
        # As from a VPS to a cluster: the first deployment's data (OpenShift's
        # uid, group 0) saved, then loaded into the Kubernetes overlay's (uid
        # 1000, fsGroup), which runs with the same keys.
        run: |
          set -euo pipefail
          d=OSCAR_Deploy/kubernetes/oscar-data.sh
          # save stops OSCAR's pod: its port-forward ends with it.
          pkill -f 'port-forward service/oscar 3001:3001' || true
          NAMESPACE=oscar "$d" save "$RUNNER_TEMP/moved"
          jq -e '.users >= 2 and .companies >= 1 and .runs >= 1' "$RUNNER_TEMP/moved/manifest.json"
          # A database with users is never overwritten without --replace, and
          # OSCAR comes back as it was.
          if NAMESPACE=oscar "$d" load "$RUNNER_TEMP/moved"; then echo "loaded over a database with users"; exit 1; fi
          test "$(kubectl -n oscar get deployment oscar -o jsonpath='{.spec.replicas}')" = 1
          # The first start made an empty database there: replaced without asking.
          NAMESPACE=oscar-k8s "$d" load "$RUNNER_TEMP/moved"
          test "$(kubectl -n oscar-k8s exec deploy/oscar -c oscar -- id -u)" = 1000
          test -z "$(kubectl -n oscar-k8s get pods -l app.kubernetes.io/name=oscar-data-copy -o name)"

          # The Test Manager signs in there and reads, decrypted, the data file
          # and the run of the first deployment.
          kubectl -n oscar-k8s port-forward service/oscar 3011:3001 > "$RUNNER_TEMP/port-forward-k8s.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3011/health; then break; fi
            sleep 1
          done
          a="$RUNNER_TEMP/smoke-account.json"
          jq '{email: .tm_email, password: .tm_password}' "$a" > "$RUNNER_TEMP/login.json"
          token=$(curl -fsS -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/login.json" \
            http://127.0.0.1:3011/v1/auth/login | jq -r .token)
          rm "$RUNNER_TEMP/login.json"
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          curl -fsS -H "$auth" http://127.0.0.1:3011/v1/company/datafile \
            | jq -e --arg s "$(jq -r .scenario "$a")" 'any(.scenarios[]; .code == $s)'
          curl -fsS -H "$auth" "http://127.0.0.1:3011/v1/runs/$(jq -r .run_id "$a")" | jq -e '.status == "COMPLETED"'
          pkill -f 'port-forward service/oscar 3011:3001' || true

      - name: The moved deployment wrote nothing off its volumes (#1441)
        run: |
          for c in oscar runner; do
            if kubectl -n oscar-k8s exec deploy/oscar -c "$c" -- sh -c 'touch /app/.write-check' 2> /dev/null; then
              echo "$c can write its root file system"; exit 1
            fi
            if kubectl -n oscar-k8s logs deploy/oscar -c "$c" | grep -E 'EROFS|read-only file system'; then
              echo "$c tried to write off its volumes"; exit 1
            fi
          done

      - name: The OpenShift overlay renders
        # kind has no Route type to check it against; its content is pinned by
        # Oscar_Server/tests/unit/kubernetes-manifests.test.js.
        run: |
          kubectl kustomize OSCAR_Deploy/kubernetes/overlays/openshift > "$RUNNER_TEMP/openshift.yaml"
          grep -q '^kind: Route$' "$RUNNER_TEMP/openshift.yaml"

      # ── Pod mode (run isolation option 4, #1130): each run in a pod of its own ──
      - name: Pod mode, deployed (ci/pod-runs, ci/pod-mode)
        run: |
          kind load docker-image local/oscar-run:ci --name oscar
          # A fresh OSCAR namespace: ci/smoke.sh makes the first administrator.
          pkill -f 'port-forward service/oscar 3001:3001' || true
          kubectl delete namespace oscar --wait=true --timeout=300s
          kubectl apply -k OSCAR_Deploy/kubernetes/ci/pod-runs
          kubectl create namespace oscar
          kubectl label namespace oscar pod-security.kubernetes.io/enforce=restricted
          boot=$(openssl rand -hex 24)
          metrics=$(openssl rand -hex 32)
          echo "::add-mask::$boot"
          echo "::add-mask::$metrics"
          echo "BOOTSTRAP_TOKEN=$boot" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$metrics" >> "$GITHUB_ENV"
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nPLATFORM_BOOTSTRAP_TOKEN=%s\nMETRICS_TOKEN=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 64)" "$boot" "$metrics" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar apply -k OSCAR_Deploy/kubernetes/ci/pod-mode
          kubectl -n oscar rollout status deployment/oscar-dispatcher --timeout=300s
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar get deployment oscar -o jsonpath='{.spec.template.spec.containers[*].name}')" = oscar
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- printenv RUN_ISOLATION)" = pod

      - name: Pod mode, who may do what
        run: |
          can() { kubectl auth can-i "$@" 2> /dev/null || true; }
          d=system:serviceaccount:oscar:oscar-dispatcher
          # Only the dispatcher makes run pods, and only in the runs' namespace.
          test "$(can create jobs -n oscar-runs --as=$d)" = yes
          test "$(can create jobs -n oscar --as=$d)" = no
          test "$(can get secrets -n oscar --as=$d)" = no
          test "$(can get secrets -n oscar-runs --as=$d)" = no
          # #1438: its Secrets are removed by label, never listed.
          test "$(can list secrets -n oscar-runs --as=$d)" = no
          test "$(can deletecollection secrets -n oscar-runs --as=$d)" = yes
          if kubectl -n oscar logs deploy/oscar-dispatcher | grep -q 'leftovers not removed'; then
            kubectl -n oscar logs deploy/oscar-dispatcher | grep 'leftovers not removed'; exit 1
          fi
          test "$(can create jobs -n oscar-runs --as=system:serviceaccount:oscar:default)" = no
          test "$(can list pods -n oscar-runs --as=system:serviceaccount:oscar-runs:oscar-run)" = no
          # The dispatcher holds none of the server's secrets.
          for k in ENCRYPTION_KEY JWT_SECRET PLATFORM_BOOTSTRAP_TOKEN METRICS_TOKEN SMTP_PASS; do
            if kubectl -n oscar exec deploy/oscar-dispatcher -- printenv "$k" > /dev/null; then echo "the dispatcher holds $k"; exit 1; fi
          done

      - name: Pod mode, a scenario in a pod of its own (ci/smoke.sh)
        run: |
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward-pod.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account-pod.json" OSCAR_Deploy/kubernetes/ci/smoke.sh
          kubectl -n oscar logs deploy/oscar-dispatcher | grep -q 'started oscar-run-'
          # The run's Job, pod and Secret are removed once it has ended.
          left=1
          for _ in $(seq 1 30); do
            left=$(kubectl -n oscar-runs get jobs,pods,secrets -l app.kubernetes.io/managed-by=oscar-dispatcher -o name | wc -l)
            if [ "$left" = 0 ]; then break; fi
            sleep 2
          done
          test "$left" = 0

      - name: Pod mode, what a run pod may reach
        run: |
          p=OSCAR_Deploy/kubernetes/ci/probe-run-network.sh
          # OSCAR's internal port, nothing else of OSCAR's.
          test "$($p probe-internal oscar-internal.oscar.svc.cluster.local 3003)" = open
          test "$($p probe-public oscar.oscar.svc.cluster.local 3001)" = closed
          test "$($p probe-dispatcher oscar-dispatcher.oscar.svc.cluster.local 3002)" = closed

      # #1324: with RUN_KEPT_PODS=on, the runs of a batch in one kept pod.
      - name: Pod mode, the runs of a batch in one kept pod (ci/kept-pods.sh)
        run: |
          pkill -f 'port-forward service/oscar 3001:3001' || true
          kubectl -n oscar set env deployment/oscar RUN_KEPT_PODS=on
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward-kept.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account-pod.json" OSCAR_Deploy/kubernetes/ci/kept-pods.sh

      - name: What the cluster shows (on failure)
        if: failure()
        run: |
          echo "=== oscar-runs"
          kubectl -n oscar-runs get all,secrets,networkpolicy,resourcequota,events 2>&1 | tail -n 60 || true
          kubectl -n oscar logs deploy/oscar-dispatcher --tail=200 2>&1 || true
          for ns in oscar oscar-k8s; do
            echo "=== $ns"
            kubectl -n "$ns" get all,pvc,configmap,events 2>&1 | tail -n 60 || true
            kubectl -n "$ns" describe pod -l app.kubernetes.io/name=oscar 2>&1 | tail -n 60 || true
            kubectl -n "$ns" logs deploy/oscar -c oscar --tail=200 2>&1 || true
            kubectl -n "$ns" logs deploy/oscar -c runner --tail=100 2>&1 || true
          done
          echo "=== simulator"
          tail -n 100 "$RUNNER_TEMP/simulator.log" || true

  # ── k3s on one machine (guide: "OSCAR - k3s on one VPS") ──────────────────
  # The guide's own files on a real k3s, installed on the runner as the guide
  # installs it: k3s/config.yaml and k3s/traefik-config.yaml in place first,
  # the pinned k3s, the runs' namespace, overlays/k3s (pod mode behind
  # Traefik) through ci/k3s. Then a scenario on the simulator, what Traefik
  # does (http sent to https, the 50 MB limit, the client's own address
  # reaching OSCAR) and what a run pod may reach under k3s's own NetworkPolicy
  # enforcement. Let's Encrypt is left out: the runner has no public name.
  k3s:
    name: k3s on one machine
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build the images (build-images.sh)
        run: OSCAR_Deploy/kubernetes/build-images.sh local ci

      - name: Start the OSDM simulator on the runner
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "SIM_SECRET=$secret" >> "$GITHUB_ENV"
          jq -n --arg s "$secret" '{gamma: [{client_id: "gamma.tstmgr01", client_secret: $s}]}' > "$RUNNER_TEMP/clients.json"
          SIM_HOST=0.0.0.0 SIM_PORT=3002 SIM_CLIENTS_FILE="$RUNNER_TEMP/clients.json" \
            nohup node OSDM_Simulator/server.js > "$RUNNER_TEMP/simulator.log" 2>&1 &
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3002/healthz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/simulator.log"
          exit 1

      - name: Install k3s as the guide does
        run: |
          set -euo pipefail
          # The runner's address: where the simulator answers and Traefik listens.
          node_ip=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')
          test -n "$node_ip"
          echo "NODE_IP=$node_ip" >> "$GITHUB_ENV"
          # #1336: the machine's inotify instances, as the guide sets them.
          # GitHub's runner image sets the same key in /etc/sysctl.conf, which
          # "sysctl --system" reads last: that line goes first, as the guide
          # tells a machine where the check shows another value to do (#1340).
          grep -rn 'max_user_instances' /etc/sysctl.conf /etc/sysctl.d /usr/lib/sysctl.d 2>/dev/null || true
          sudo sed -i '/^[[:space:]]*fs\.inotify\.max_user_instances/d' /etc/sysctl.conf
          sudo cp OSCAR_Deploy/kubernetes/k3s/sysctl-oscar.conf /etc/sysctl.d/90-oscar-k3s.conf
          sudo sysctl --system > /dev/null
          sysctl fs.inotify.max_user_instances
          test "$(sysctl -n fs.inotify.max_user_instances)" = 8192
          sudo mkdir -p /etc/rancher/k3s /var/lib/rancher/k3s/server/manifests
          sudo cp OSCAR_Deploy/kubernetes/k3s/config.yaml /etc/rancher/k3s/config.yaml
          # #1271: k3s starts on its default datastore (SQLite) first, as a
          # machine installed before etcd; the next step converts it as the
          # guide does, so the conversion is proved, not only a new install.
          sudo sed -i '/^cluster-init:/d' /etc/rancher/k3s/config.yaml
          sudo cp OSCAR_Deploy/kubernetes/k3s/traefik-config.yaml /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
          sudo install -D -m 0644 OSCAR_Deploy/kubernetes/k3s/cert-permissions.conf /etc/systemd/system/k3s.service.d/oscar-cert-permissions.conf
          # k3s comes from GitHub's releases: a download that times out there
          # ("Download failed") is tried again, as the guide says to.
          for attempt in 1 2 3; do
            if curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="$K3S_VERSION" sh -; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "k3s install, attempt $attempt failed: again in 30 s"
            sleep 30
          done
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown "$(id -u):$(id -g)" ~/.kube/config
          kubectl wait node --all --for=condition=Ready --timeout=180s
          docker save local/oscar:ci local/oscar-run:ci | sudo k3s ctr images import -
          # k3s installs its Traefik itself (a Helm job), with our values.
          for _ in $(seq 1 90); do
            if kubectl -n kube-system get deployment traefik > /dev/null 2>&1; then break; fi
            sleep 2
          done
          kubectl -n kube-system rollout status deployment/traefik --timeout=300s
          test "$(kubectl -n kube-system get service traefik -o jsonpath='{.spec.externalTrafficPolicy}')" = Local
          kubectl wait --for condition=established crd/middlewares.traefik.io --timeout=120s
          # Secrets are encrypted in k3s's datastore (k3s/config.yaml).
          sudo k3s secrets-encrypt status | tee "$RUNNER_TEMP/encryption.txt"
          grep -q 'Encryption Status: Enabled' "$RUNNER_TEMP/encryption.txt"
          # The guide's section 3 (#1438): k3s's default ServiceAccounts mount no token.
          for ns in $(kubectl get namespaces -o name); do kubectl -n "${ns#namespace/}" patch serviceaccount default -p '{"automountServiceAccountToken": false}'; done

      - name: k3s converted to etcd, as the guide converts a machine (#1271)
        run: |
          set -euo pipefail
          sudo test -f /var/lib/rancher/k3s/server/db/state.db
          # Something made on SQLite must come along: a Secret, encrypted at rest.
          kubectl create namespace convert-check
          kubectl -n convert-check create secret generic marker --from-literal=value=made-on-sqlite
          # The guide's conversion (section 9, "k3s on etcd").
          sudo systemctl stop k3s
          grep -q '^cluster-init:' /etc/rancher/k3s/config.yaml || echo 'cluster-init: true' | sudo tee -a /etc/rancher/k3s/config.yaml
          sudo systemctl start k3s
          for _ in $(seq 1 90); do
            if kubectl get --raw /readyz > /dev/null 2>&1; then break; fi
            sleep 2
          done
          kubectl wait node --all --for=condition=Ready --timeout=180s
          # What there is, before it is checked: a failed check below says
          # nothing by itself.
          sudo ls -la /var/lib/rancher/k3s/server/db/
          kubectl get nodes --show-labels
          sudo journalctl -u k3s --since -10min | grep -iE 'migrat|sqlite|etcd for new cluster|kine' | grep -v 'Migrating etcd key' | cut -c1-240 | head -20 || true
          # On etcd now: its folder, the SQLite file renamed, its snapshots listed.
          # Not the node's etcd role: k3s adds it a little after its start, and
          # the first CI run read it too early (#1332).
          sudo test -d /var/lib/rancher/k3s/server/db/etcd/member
          sudo test -f /var/lib/rancher/k3s/server/db/state.db.migrated
          sudo test ! -e /var/lib/rancher/k3s/server/db/state.db
          sudo k3s etcd-snapshot ls
          echo "keys copied: $(sudo journalctl -u k3s --since -10min | grep -c 'Migrating etcd key')"
          test "$(kubectl -n convert-check get secret marker -o jsonpath='{.data.value}' | base64 -d)" = made-on-sqlite
          sudo k3s secrets-encrypt status | grep -q 'Encryption Status: Enabled'
          kubectl delete namespace convert-check --wait=false
          kubectl -n kube-system rollout status deployment/traefik --timeout=300s

      - name: The runs' namespace, and the simulator for the run pods
        run: |
          set -euo pipefail
          kubectl apply -k OSCAR_Deploy/kubernetes/runs
          # CI only: run pods may reach the simulator on the runner's private
          # address. A policy of its own (policies add up), as ci/pod-runs
          # does for kind.
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: ci-simulator
            namespace: oscar-runs
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: oscar-run
            policyTypes: [Egress]
            egress:
              - to:
                  - ipBlock:
                      cidr: ${NODE_IP}/32
                ports:
                  - { protocol: TCP, port: 3002 }
          EOF

      - name: Deploy the k3s overlay (ci/k3s)
        run: |
          set -euo pipefail
          kubectl create namespace oscar
          kubectl label namespace oscar pod-security.kubernetes.io/enforce=restricted
          boot=$(openssl rand -hex 24)
          metrics=$(openssl rand -hex 32)
          echo "::add-mask::$boot"
          echo "::add-mask::$metrics"
          echo "BOOTSTRAP_TOKEN=$boot" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$metrics" >> "$GITHUB_ENV"
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nPLATFORM_BOOTSTRAP_TOKEN=%s\nMETRICS_TOKEN=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 64)" "$boot" "$metrics" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar apply -k OSCAR_Deploy/kubernetes/ci/k3s
          kubectl -n oscar rollout status deployment/oscar-dispatcher --timeout=300s
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- printenv RUN_ISOLATION)" = pod
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- id -u)" = 1000

      - name: Monitoring as the guide installs it (monitoring/stack, monitoring/oscar)
        run: |
          set -euo pipefail
          kubectl apply -f OSCAR_Deploy/kubernetes/monitoring/stack/namespace.yaml
          # A configuration that mails nobody; the guide's is
          # monitoring/alertmanager.yaml.example, filled in.
          printf 'route:\n  receiver: oscar-ci\nreceivers:\n  - name: oscar-ci\n' > "$RUNNER_TEMP/alertmanager.yaml"
          kubectl -n monitoring create secret generic oscar-alertmanager --from-file=alertmanager.yaml="$RUNNER_TEMP/alertmanager.yaml"
          kubectl apply -k OSCAR_Deploy/kubernetes/ci/k3s-monitoring
          # k3s's Helm controller installs the chart (a job in kube-system),
          # its CRDs first; OSCAR's part needs them, and the operator, which
          # checks a PrometheusRule before it is stored.
          # A CRD just made has no status yet, and `kubectl wait` then stops
          # with ".status.conditions accessor error" instead of waiting (seen
          # on main and on #1273): wait for the conditions to exist first.
          crds="servicemonitors.monitoring.coreos.com prometheusrules.monitoring.coreos.com"
          for _ in $(seq 1 150); do
            conditions=0
            for crd in $crds; do
              if [ -n "$(kubectl get crd "$crd" -o jsonpath='{.status.conditions}' 2> /dev/null)" ]; then conditions=$((conditions + 1)); fi
            done
            if [ "$conditions" -eq 2 ]; then break; fi
            sleep 2
          done
          kubectl wait --for condition=established crd/servicemonitors.monitoring.coreos.com crd/prometheusrules.monitoring.coreos.com --timeout=120s
          ready() {
            for _ in $(seq 1 150); do
              if kubectl -n monitoring get "$1" > /dev/null 2>&1; then break; fi
              sleep 2
            done
            kubectl -n monitoring rollout status "$1" --timeout=600s
          }
          ready deployment/kube-prometheus-stack-operator
          kubectl apply -k OSCAR_Deploy/kubernetes/monitoring/oscar
          for w in deployment/kube-prometheus-stack-kube-state-metrics daemonset/kube-prometheus-stack-prometheus-node-exporter \
            deployment/kube-prometheus-stack-grafana statefulset/prometheus-kube-prometheus-stack-prometheus \
            statefulset/alertmanager-kube-prometheus-stack-alertmanager statefulset/loki deployment/alloy; do
            ready "$w"
          done

      - name: A scenario in a pod of its own (ci/smoke.sh)
        run: |
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 SIM_BASE="http://$NODE_IP:3002" \
            SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account.json" OSCAR_Deploy/kubernetes/ci/smoke.sh
          kubectl -n oscar logs deploy/oscar-dispatcher | grep -q 'started oscar-run-'
          # #1438: that run's pod had the uid and group the k3s overlay names.
          test "$(kubectl -n oscar exec deploy/oscar-dispatcher -- printenv RUN_POD_USER)" = 1000:1000
          # #1441: neither container can write its root file system, and no
          # write was refused (a path off the volumes would log EROFS).
          for c in oscar; do
            if kubectl -n oscar exec deploy/oscar -c "$c" -- sh -c 'touch /app/.write-check' 2> /dev/null; then
              echo "$c can write its root file system"; exit 1
            fi
            if kubectl -n oscar logs deploy/oscar -c "$c" | grep -E 'EROFS|read-only file system'; then
              echo "$c tried to write off its volumes"; exit 1
            fi
          done

      - name: Traefik as the guide sets it
        run: |
          set -euo pipefail
          host=oscar.example.org
          # http is sent to https.
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --resolve "$host:80:$NODE_IP" "http://$host/health")
          echo "http: $out"
          [[ "$out" =~ ^30[18]\ https://oscar\.example\.org(:443)?/health$ ]]
          # https reaches OSCAR (Traefik's own certificate: no Let's Encrypt here).
          curl -fsSk --resolve "$host:443:$NODE_IP" "https://$host/health" | jq -e '.status == "ok"'
          # The VPS's nginx limit: 50 MB of body, then 413 from Traefik.
          head -c 52428801 /dev/zero > "$RUNNER_TEMP/big"
          code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$host:443:$NODE_IP" -X POST \
            -H 'Content-Type: application/octet-stream' --data-binary "@$RUNNER_TEMP/big" "https://$host/v1/auth/login")
          rm "$RUNNER_TEMP/big"
          echo "51 MB body: $code"
          test "$code" = 413
          # Text answers are compressed for a client that takes gzip, as the
          # VPS's nginx does (overlays/k3s/compression.yaml).
          enc=$(curl -sk -o /dev/null -D - -H 'Accept-Encoding: gzip' --resolve "$host:443:$NODE_IP" "https://$host/js/scenarios.js" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "content-encoding" { print $2 }')
          echo "scenarios.js: content-encoding ${enc:-none}"
          test "$enc" = gzip
          # The client's own address reaches OSCAR. The client is a network
          # namespace of its own (192.0.2.2, behind a veth pair): its traffic
          # comes into the machine as a visitor's does, not through the
          # loopback. Its sign-in through Traefik must be recorded under
          # 192.0.2.2, not a cluster address.
          sudo ip netns add client
          sudo ip link add oscar-h type veth peer name oscar-c
          sudo ip link set oscar-c netns client
          sudo ip addr add 192.0.2.1/24 dev oscar-h
          sudo ip link set oscar-h up
          sudo ip netns exec client ip link set lo up
          sudo ip netns exec client ip addr add 192.0.2.2/24 dev oscar-c
          sudo ip netns exec client ip link set oscar-c up
          sudo ip netns exec client ip route add default via 192.0.2.1
          jq '{email: .tm_email, password: .tm_password}' "$RUNNER_TEMP/smoke-account.json" > "$RUNNER_TEMP/login.json"
          sudo ip netns exec client curl -fsSk -o /dev/null --resolve "$host:443:$NODE_IP" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/login.json" "https://$host/v1/auth/login"
          rm "$RUNNER_TEMP/login.json"
          seen=$(kubectl -n oscar exec deploy/oscar -c oscar -- node -e '
            const { DatabaseSync } = require("node:sqlite");
            const db = new DatabaseSync(process.env.OSCAR_DB_PATH || "/app/data/oscar.db");
            const row = db.prepare("SELECT ip FROM auth_events WHERE event_type = ? ORDER BY id DESC LIMIT 1").get("login_success");
            process.stdout.write(row ? String(row.ip) : "");' 2>/dev/null)
          echo "OSCAR recorded the sign-in from $seen; the client is 192.0.2.2"
          test "$seen" = 192.0.2.2 || test "$seen" = ::ffff:192.0.2.2

      - name: What a run pod may reach (k3s enforces NetworkPolicy)
        run: |
          p=OSCAR_Deploy/kubernetes/ci/probe-run-network.sh
          test "$($p probe-internal oscar-internal.oscar.svc.cluster.local 3003)" = open
          test "$($p probe-public oscar.oscar.svc.cluster.local 3001)" = closed
          test "$($p probe-dispatcher oscar-dispatcher.oscar.svc.cluster.local 3002)" = closed

      - name: Monitoring, what it reads and who reaches it (ci/check-monitoring.sh)
        run: SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account.json" OSCAR_Deploy/kubernetes/ci/check-monitoring.sh

      # #1324: with RUN_KEPT_PODS=on, the runs of a batch in one kept pod, as
      # the guide switches it on (section 9): last, the server restarts.
      - name: The runs of a batch in one kept pod (ci/kept-pods.sh)
        run: |
          pkill -f 'port-forward service/oscar 3001:3001' || true
          kubectl -n oscar set env deployment/oscar RUN_KEPT_PODS=on
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward-kept.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account.json" OSCAR_Deploy/kubernetes/ci/kept-pods.sh

      # #1438: the CIS benchmark of k3s, on the k3s installed as the guide
      # installs it (k3s/config.yaml), with the overlay, the runs and the
      # monitoring deployed. A FAIL that scans/accepted.json does not accept
      # fails the job; the benchmark's manual checks (WARN) are listed.
      - name: kube-bench, the CIS benchmark of k3s
        env:
          KUBE_BENCH_VERSION: 0.16.0
          KUBE_BENCH_SHA256: 82dbc7e598740dc9344d41f8ad0b8210d57c4c00bdb2c5f1d8a69a2b98baddcf
          # The latest k3s benchmark that kube-bench holds.
          KUBE_BENCH_BENCHMARK: k3s-cis-1.9
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/kube-bench"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/kube-bench.tar.gz" \
            "https://github.com/aquasecurity/kube-bench/releases/download/v${KUBE_BENCH_VERSION}/kube-bench_${KUBE_BENCH_VERSION}_linux_amd64.tar.gz"
          echo "${KUBE_BENCH_SHA256}  $dir/kube-bench.tar.gz" | sha256sum -c -
          tar -xzf "$dir/kube-bench.tar.gz" -C "$dir"
          ls "$dir"
          (cd "$dir" && sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml ./kube-bench run \
            --config-dir cfg --config cfg/config.yaml --benchmark "$KUBE_BENCH_BENCHMARK" --json) > "$RUNNER_TEMP/kube-bench.json"
          # 1.2.23 is accepted because the benchmark reads the first start of
          # the API server (on SQLite here, before the move to etcd): its
          # latest start must name both arguments.
          last=$(sudo journalctl -u k3s | grep 'Running kube-apiserver' | tail -n 1)
          for flag in --etcd-certfile= --etcd-keyfile=; do
            printf '%s' "$last" | grep -q -- "$flag" || { echo "the API server's latest start has no $flag"; exit 1; }
          done
          # 1.1.20: the drop-in closed k3s's certificates after its last start.
          test -z "$(sudo find /var/lib/rancher/k3s/server/tls -name '*.crt' -perm /077)"
          node OSCAR_Deploy/kubernetes/scans/check-scans.js kube-bench "$RUNNER_TEMP/kube-bench.json"

      - name: What the cluster shows (on failure)
        if: failure()
        run: |
          kubectl get pods -A -o wide 2>&1 | tail -n 60 || true
          echo "=== monitoring"
          kubectl -n kube-system logs job/helm-install-kube-prometheus-stack --tail=60 2>&1 || true
          kubectl -n monitoring get all,pvc,networkpolicy,ingress,events 2>&1 | tail -n 80 || true
          kubectl -n monitoring logs deploy/alloy --tail=60 2>&1 || true
          kubectl -n monitoring logs statefulset/loki --tail=40 2>&1 || true
          kubectl -n monitoring logs deploy/kube-prometheus-stack-grafana -c grafana --tail=60 2>&1 || true
          kubectl -n kube-system logs deployment/traefik --tail=100 2>&1 || true
          kubectl -n kube-system get helmcharts,helmchartconfigs,jobs 2>&1 || true
          echo "=== oscar-runs"
          kubectl -n oscar-runs get all,networkpolicy,events 2>&1 | tail -n 60 || true
          echo "=== oscar"
          kubectl -n oscar get all,pvc,ingress,events 2>&1 | tail -n 60 || true
          kubectl -n oscar logs deploy/oscar -c oscar --tail=200 2>&1 || true
          kubectl -n oscar logs deploy/oscar-dispatcher --tail=100 2>&1 || true
          echo "=== k3s"
          sudo journalctl -u k3s --no-pager 2>&1 | tail -n 80 || true
          echo "=== simulator"
          tail -n 100 "$RUNNER_TEMP/simulator.log" || true

  # The VPS's proxy. OSCAR_Deploy/nginx/oscar.conf.example is what an
  # installation copies: it is run here on Ubuntu's own nginx, with that
  # package's nginx.conf as it comes, in front of a stand-in for OSCAR.
  # `nginx -t` alone says the file parses, not what it does.
  nginx:
    name: nginx example (the VPS's proxy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ubuntu's nginx with the example as its only site
        run: |
          set -euo pipefail
          if ! command -v nginx > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo cp OSCAR_Deploy/nginx/oscar.conf.example /etc/nginx/sites-available/oscar
          sudo ln -sf /etc/nginx/sites-available/oscar /etc/nginx/sites-enabled/oscar
          sudo nginx -t
          sudo systemctl restart nginx

      - name: A stand-in for OSCAR on 127.0.0.1:3001
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/js" "$site/metrics"
          cp Oscar_Server/public/js/scenarios.js "$site/js/"
          cp compatibility.json "$site/"
          cp Oscar_Server/public/uic-logo.png "$site/"
          echo "not for the outside" > "$site/metrics/index.html"
          (cd "$site" && nohup python3 -m http.server 3001 --bind 127.0.0.1 > "$RUNNER_TEMP/site.log" 2>&1 &)
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/compatibility.json; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/site.log"; exit 1

      - name: Text is compressed, an image is not, /metrics is not served
        run: |
          set -euo pipefail
          encoding() { curl -s -o /dev/null -D - -H 'Host: oscar.example.com' "$@" | tr -d '\r' | awk -F': ' 'tolower($1) == "content-encoding" { print $2 }'; }
          for path in /js/scenarios.js /compatibility.json; do
            enc=$(encoding -H 'Accept-Encoding: gzip' "http://127.0.0.1$path")
            echo "$path: content-encoding ${enc:-none}"
            test "$enc" = gzip
          done
          # An image is already compressed; a client that does not ask gets plain text.
          enc=$(encoding -H 'Accept-Encoding: gzip' http://127.0.0.1/uic-logo.png)
          echo "/uic-logo.png: content-encoding ${enc:-none}"
          test -z "$enc"
          enc=$(encoding http://127.0.0.1/js/scenarios.js)
          echo "/js/scenarios.js without Accept-Encoding: content-encoding ${enc:-none}"
          test -z "$enc"
          # What goes over the wire, against what OSCAR sends.
          sent=$(curl -s -H 'Host: oscar.example.com' -H 'Accept-Encoding: gzip' http://127.0.0.1/js/scenarios.js | wc -c)
          whole=$(wc -c < Oscar_Server/public/js/scenarios.js)
          echo "scenarios.js: $sent bytes on the wire for $whole"
          test "$sent" -lt $((whole / 2))
          # /metrics stays closed, in any spelling.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: oscar.example.com' http://127.0.0.1/METRICS/)
          echo "/METRICS/: $code"
          test "$code" = 404

      - name: No nginx version, no security header of the proxy's own (#1426)
        run: |
          set -euo pipefail
          headers() { curl -s -o /dev/null -D - -H 'Host: oscar.example.com' "$@" | tr -d '\r'; }
          # The Server header and nginx's own error page name no version.
          server=$(headers http://127.0.0.1/compatibility.json | awk -F': ' 'tolower($1) == "server" { print $2 }')
          echo "Server: $server"
          test "$server" = nginx
          page=$(curl -s -H 'Host: oscar.example.com' http://127.0.0.1/metrics)
          if printf '%s' "$page" | grep -Eq 'nginx/[0-9]'; then echo "an error page names the version"; exit 1; fi
          # The stand-in sends no Content-Security-Policy: the proxy must add none.
          if headers http://127.0.0.1/compatibility.json | grep -iq '^content-security-policy:'; then
            echo "the proxy adds a Content-Security-Policy of its own"; exit 1
          fi
          echo "no Content-Security-Policy added by the proxy"

  docker-host:
    name: Docker host (the VPS's restarts and logs, no Docker socket in a container)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A small image with a shell, by digest, from Google's mirror of Docker
      # Hub (Docker Hub limits shared addresses).
      BUSYBOX: mirror.gcr.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The compose files, as Docker Compose reads them
        run: |
          set -euo pipefail
          cd OSCAR_Deploy
          cp .env.example .env
          mkdir -p secrets
          : > secrets/encryption_key
          : > secrets/smtp_pass
          OSCAR_IMAGE_DIGEST="sha256:$(printf '%064d' 0)" docker compose \
            -f docker-compose.yml -f docker-compose.metrics.yml -f docker-compose.secrets.yml \
            --profile isolated config --format json > "$RUNNER_TEMP/compose.json"
          jq -r '.services | keys | join(", ")' "$RUNNER_TEMP/compose.json"
          # No service mounts the Docker socket.
          jq -e '[.services[] | .volumes[]? | select((.source // "") | test("docker\\.sock"))] | length == 0' "$RUNNER_TEMP/compose.json"
          # Every service writes json-file logs naming its container: one block for all.
          jq -e '[.services[].logging] | unique | length == 1' "$RUNNER_TEMP/compose.json"
          jq -e '.services.oscar.logging | .driver == "json-file" and .options.tag == "{{.Name}}"' "$RUNNER_TEMP/compose.json"

      - name: Restarts from the host, by the installed timer
        run: |
          set -euo pipefail
          sudo bash OSCAR_Deploy/scripts/oscar-autoheal-schedule.sh install
          systemctl is-active oscar-autoheal.timer
          sudo cmp OSCAR_Deploy/scripts/oscar-autoheal.sh /usr/local/sbin/oscar-autoheal
          stat -c '%U %a' /usr/local/sbin/oscar-autoheal | grep -qx 'root 755'
          # Two containers whose check fails at once; only one has the label.
          sick() { docker run -d --name "$1" "${@:2}" --health-cmd 'test -f /tmp/ok' --health-interval 2s \
            --health-timeout 2s --health-retries 1 --health-start-period 0s "$BUSYBOX" sleep 3600 > /dev/null; }
          sick labelled --label autoheal=true
          sick unlabelled
          started() { docker inspect --format '{{.State.StartedAt}}' "$1"; }
          first=$(started labelled); other=$(started unlabelled)
          for i in $(seq 1 60); do
            [ "$(started labelled)" != "$first" ] && break
            sleep 2
          done
          echo "labelled: started $first, then $(started labelled)"
          test "$(started labelled)" != "$first"
          # Left alone: unhealthy, never restarted.
          test "$(started unlabelled)" = "$other"
          test "$(docker inspect --format '{{.State.Health.Status}}' unlabelled)" = unhealthy
          sudo journalctl -t oscar-autoheal --no-pager | tee "$RUNNER_TEMP/autoheal.log"
          grep -q 'restarted labelled' "$RUNNER_TEMP/autoheal.log"
          if grep -q unlabelled "$RUNNER_TEMP/autoheal.log"; then echo "restarted a container without the label"; exit 1; fi
          docker rm -f labelled unlabelled > /dev/null
          sudo bash OSCAR_Deploy/scripts/oscar-autoheal-schedule.sh remove
          test ! -e /usr/local/sbin/oscar-autoheal
          if systemctl is-active --quiet oscar-autoheal.timer; then echo "the timer is still active"; exit 1; fi

      - name: Promtail reads the log files, and finds each container's name in its lines
        run: |
          set -euo pipefail
          # A container made with the compose files' logging block, as compose makes it.
          opts=()
          while IFS= read -r o; do opts+=(--log-opt "$o"); done < <(jq -r '.services.oscar.logging.options | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/compose.json")
          docker run -d --name oscar-like --label com.docker.compose.service=oscar --label com.docker.compose.project=oscar_deploy \
            --log-driver json-file "${opts[@]}" "$BUSYBOX" sh -c 'echo "hello on stdout"; echo "hello on stderr" >&2; sleep 3600' > /dev/null
          # A container made without it: its lines name no container.
          plain=$(docker run -d "$BUSYBOX" sh -c 'echo "a line naming nothing"; sleep 3600')
          image=$(jq -r '.services.promtail.image' "$RUNNER_TEMP/compose.json")
          echo "Promtail: $image"
          mkdir -p "$RUNNER_TEMP/positions"
          docker run -d --name promtail-check \
            -v "$PWD/OSCAR_Deploy/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro" \
            -v /var/lib/docker/containers:/var/lib/docker/containers:ro \
            -v "$RUNNER_TEMP/positions:/promtail" \
            "$image" -config.file=/etc/promtail/promtail-config.yaml -dry-run > /dev/null
          # -dry-run prints each entry as "time<TAB>{labels}<TAB>line" on
          # Promtail's own output, which is a log file it then reads too: keep
          # the entries whose line is one the test's containers wrote.
          entries() {
            docker logs promtail-check 2>&1 \
              | awk -F '\t' '$3 ~ /^(hello on (stdout|stderr)|a line naming nothing)$/' > "$RUNNER_TEMP/entries.txt" || true
          }
          for i in $(seq 1 30); do
            entries
            [ "$(wc -l < "$RUNNER_TEMP/entries.txt")" -ge 3 ] && break
            sleep 2
          done
          docker stop promtail-check > /dev/null
          entries
          cat "$RUNNER_TEMP/entries.txt"
          # has LINE LABEL: an entry of that line carries that label.
          has() { awk -F '\t' -v line="$1" -v want="$2" '$3 == line && index($2, want) { found = 1 } END { exit !found }' "$RUNNER_TEMP/entries.txt"; }
          for want in 'container="oscar-like"' 'compose_service="oscar"' 'compose_project="oscar_deploy"' 'stream="stdout"'; do
            has 'hello on stdout' "$want" || { echo "the stdout line lacks $want"; exit 1; }
          done
          has 'hello on stderr' 'stream="stderr"' || { echo "the stderr line lacks its stream"; exit 1; }
          has 'a line naming nothing' "container=\"${plain:0:12}\"" || { echo "a nameless line lacks its container id"; exit 1; }
          if awk -F '\t' 'index($2, "filename=") { bad = 1 } END { exit !bad }' "$RUNNER_TEMP/entries.txt"; then
            echo "the file's path is a label"; exit 1
          fi
          echo "Promtail: names, compose labels and streams from the files, no socket"

  kubescape:
    name: Kubescape (the Kubernetes manifests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBESCAPE_VERSION: 4.0.17
      KUBESCAPE_SHA256: 9ed580e7c9b1e2e5b8f0adcfdf2bf2fd8856e7297125fc9aa10cdcb97813a4fa
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: What an operator applies, rendered (scans/render.sh)
        run: bash OSCAR_Deploy/kubernetes/scans/render.sh "$RUNNER_TEMP/rendered"

      - name: Kubescape, its pinned release checked
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/kubescape"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/kubescape.tar.gz" \
            "https://github.com/kubescape/kubescape/releases/download/v${KUBESCAPE_VERSION}/kubescape_${KUBESCAPE_VERSION}_linux_amd64.tar.gz"
          echo "${KUBESCAPE_SHA256}  $dir/kubescape.tar.gz" | sha256sum -c -
          tar -xzf "$dir/kubescape.tar.gz" -C "$dir"
          bin=$(find "$dir" -type f -name kubescape | head -n 1)
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/kubescape
          kubescape version

      - name: Kubescape on the rendered manifests (NSA and MITRE frameworks)
        run: |
          set -euo pipefail
          kubescape scan framework nsa,mitre "$RUNNER_TEMP/rendered" --format json --output "$RUNNER_TEMP/kubescape.json"
          node OSCAR_Deploy/kubernetes/scans/check-scans.js kubescape "$RUNNER_TEMP/kubescape.json"
