name: CI · Kubernetes

# #1059: OSCAR on a Kubernetes cluster, as OSCAR_Deploy/kubernetes/ deploys
# it. A kind cluster on the runner; the base under an OpenShift-style uid
# (restricted pod security), driven through the API by ci/smoke.sh against
# the OSDM simulator; then the plain Kubernetes overlay.
#
# Not a required check: it runs when what it tests changes, and every week
# (a change elsewhere, a new runner image), so that a failure here never holds
# an unrelated pull request.
on:
  pull_request:
    branches: [main]
    paths:
      - 'OSCAR_Deploy/kubernetes/**'
      - 'Oscar_Server/Dockerfile'
      - 'Oscar_Server/.dockerignore'
      - 'Oscar_Server/bruno-cli/**'
      - 'Oscar_Server/src/server.js'
      - 'Oscar_Server/src/utils/clusterSettings.js'
      - 'Oscar_Server/src/worker/**'
      - 'Oscar_Server/src/runner-agent/**'
      - 'Oscar_Server/src/run-pod/**'
      - 'Oscar_Server/src/run-dispatcher/**'
      - 'Oscar_Server/src/utils/runAgentPeer.js'
      - '.github/workflows/ci-kubernetes.yml'
  push:
    branches: [main]
    paths:
      - 'OSCAR_Deploy/kubernetes/**'
      - 'Oscar_Server/Dockerfile'
      - 'Oscar_Server/.dockerignore'
      - 'Oscar_Server/bruno-cli/**'
      - 'Oscar_Server/src/server.js'
      - 'Oscar_Server/src/utils/clusterSettings.js'
      - 'Oscar_Server/src/worker/**'
      - 'Oscar_Server/src/runner-agent/**'
      - 'Oscar_Server/src/run-pod/**'
      - 'Oscar_Server/src/run-dispatcher/**'
      - 'Oscar_Server/src/utils/runAgentPeer.js'
      - '.github/workflows/ci-kubernetes.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The k3s the guide "OSCAR - k3s on one VPS" installs (the same version:
  # kubernetes-manifests.test.js).
  K3S_VERSION: v1.36.6+k3s1

jobs:
  kind:
    name: Kubernetes deployment (kind)
    # Pinned: kind, kubectl and jq come with this image; ubuntu-latest moves
    # to 26.04 in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Tools on the runner
        run: |
          kind version
          kubectl version --client
          jq --version

      - name: Build the images (build-images.sh)
        run: OSCAR_Deploy/kubernetes/build-images.sh local ci

      - name: The image under a uid it was not built for (Docker, no volume)
        # The image's own data directory, without a volume over it: what the
        # Dockerfile's group-0 permissions are for.
        run: |
          docker run -d --name uid-check --user 1000740000:0 \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e COLLECTION_PATH=/collection -e BRU_CMD=/usr/local/bin/bru \
            -e COMPATIBILITY_FILE=/app/compatibility.json -e HOME=/tmp \
            -p 127.0.0.1:3101:3001 local/oscar:ci
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o "$RUNNER_TEMP/health.json" http://127.0.0.1:3101/health; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs uid-check; exit 1; fi
          jq -e '.checks.database.ok and .checks.data_dir.ok' "$RUNNER_TEMP/health.json"
          docker exec uid-check id
          docker rm -f uid-check

      - name: Start the OSDM simulator on the runner
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "SIM_SECRET=$secret" >> "$GITHUB_ENV"
          jq -n --arg s "$secret" '{gamma: [{client_id: "gamma.tstmgr01", client_secret: $s}]}' > "$RUNNER_TEMP/clients.json"
          SIM_HOST=0.0.0.0 SIM_PORT=3002 SIM_CLIENTS_FILE="$RUNNER_TEMP/clients.json" \
            nohup node OSDM_Simulator/server.js > "$RUNNER_TEMP/simulator.log" 2>&1 &
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3002/healthz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/simulator.log"
          exit 1

      - name: Create the kind cluster
        run: |
          kind create cluster --name oscar --wait 180s
          kind load docker-image local/oscar:ci --name oscar
          # Pods reach the runner (and so the simulator) at the gateway of
          # kind's Docker network.
          gateway=$(docker network inspect kind --format '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -v ':' | grep -m1 .)
          echo "SIM_BASE=http://$gateway:3002" >> "$GITHUB_ENV"

      - name: Deploy as OpenShift runs it (ci/openshift-like)
        run: |
          kubectl create namespace oscar
          kubectl label namespace oscar pod-security.kubernetes.io/enforce=restricted
          boot=$(openssl rand -hex 24)
          metrics=$(openssl rand -hex 32)
          echo "::add-mask::$boot"
          echo "::add-mask::$metrics"
          echo "BOOTSTRAP_TOKEN=$boot" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$metrics" >> "$GITHUB_ENV"
          # The keys the data move (oscar-data.sh, below) takes along, as a
          # VPS's .env goes with its data.
          key=$(openssl rand -hex 32)
          jwt=$(openssl rand -hex 64)
          echo "::add-mask::$key"
          echo "::add-mask::$jwt"
          echo "MOVED_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
          echo "MOVED_JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nPLATFORM_BOOTSTRAP_TOKEN=%s\nMETRICS_TOKEN=%s\n' \
            "$key" "$jwt" "$boot" "$metrics" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar apply -k OSCAR_Deploy/kubernetes/ci/openshift-like
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- id -u)" = 1000740000
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- id -g)" = 0

      - name: The runner holds none of the server's data, secrets or processes
        run: |
          r() { kubectl -n oscar exec deploy/oscar -c runner -- "$@"; }
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- printenv RUN_ISOLATION)" = isolated
          # No secret of the server in its environment.
          for k in ENCRYPTION_KEY JWT_SECRET PLATFORM_BOOTSTRAP_TOKEN METRICS_TOKEN SMTP_PASS; do
            if r printenv "$k" > /dev/null; then echo "the runner holds $k"; exit 1; fi
          done
          # No database: the data volume is not mounted there.
          r node -e "process.exit(require('node:fs').existsSync('/app/data/oscar.db') ? 1 : 0)"
          # No server process in its view.
          r node -e "
            const fs = require('node:fs');
            const seen = fs.readdirSync('/proc').filter(p => /^\d+$/.test(p))
              .map(p => { try { return fs.readFileSync('/proc/' + p + '/cmdline', 'utf8'); } catch { return ''; } });
            if (seen.some(c => c.includes('src/' + 'server.js'))) { console.error(seen); process.exit(1); }
          "

      - name: Run a scenario through the API (ci/smoke.sh)
        run: |
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account.json" \
            OSCAR_Deploy/kubernetes/ci/smoke.sh

      - name: Deploy the Kubernetes overlay (ci/kubernetes)
        # With the first deployment's keys: the data moves here below.
        run: |
          kubectl create namespace oscar-k8s
          kubectl label namespace oscar-k8s pod-security.kubernetes.io/enforce=restricted
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nMETRICS_TOKEN=%s\n' \
            "$MOVED_ENCRYPTION_KEY" "$MOVED_JWT_SECRET" "$(openssl rand -hex 32)" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar-k8s create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar-k8s create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar-k8s apply -k OSCAR_Deploy/kubernetes/ci/kubernetes
          kubectl -n oscar-k8s rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar-k8s exec deploy/oscar -c oscar -- id -u)" = 1000
          test "$(kubectl -n oscar-k8s exec deploy/oscar -c runner -- id -u)" = 1000
          kubectl -n oscar-k8s get ingress oscar

      - name: The data moves from one deployment to another (oscar-data.sh)
        # As from a VPS to a cluster: the first deployment's data (OpenShift's
        # uid, group 0) saved, then loaded into the Kubernetes overlay's (uid
        # 1000, fsGroup), which runs with the same keys.
        run: |
          set -euo pipefail
          d=OSCAR_Deploy/kubernetes/oscar-data.sh
          # save stops OSCAR's pod: its port-forward ends with it.
          pkill -f 'port-forward service/oscar 3001:3001' || true
          NAMESPACE=oscar "$d" save "$RUNNER_TEMP/moved"
          jq -e '.users >= 2 and .companies >= 1 and .runs >= 1' "$RUNNER_TEMP/moved/manifest.json"
          # A database with users is never overwritten without --replace, and
          # OSCAR comes back as it was.
          if NAMESPACE=oscar "$d" load "$RUNNER_TEMP/moved"; then echo "loaded over a database with users"; exit 1; fi
          test "$(kubectl -n oscar get deployment oscar -o jsonpath='{.spec.replicas}')" = 1
          # The first start made an empty database there: replaced without asking.
          NAMESPACE=oscar-k8s "$d" load "$RUNNER_TEMP/moved"
          test "$(kubectl -n oscar-k8s exec deploy/oscar -c oscar -- id -u)" = 1000
          test -z "$(kubectl -n oscar-k8s get pods -l app.kubernetes.io/name=oscar-data-copy -o name)"

          # The Test Manager signs in there and reads, decrypted, the data file
          # and the run of the first deployment.
          kubectl -n oscar-k8s port-forward service/oscar 3011:3001 > "$RUNNER_TEMP/port-forward-k8s.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3011/health; then break; fi
            sleep 1
          done
          a="$RUNNER_TEMP/smoke-account.json"
          jq '{email: .tm_email, password: .tm_password}' "$a" > "$RUNNER_TEMP/login.json"
          token=$(curl -fsS -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/login.json" \
            http://127.0.0.1:3011/v1/auth/login | jq -r .token)
          rm "$RUNNER_TEMP/login.json"
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          curl -fsS -H "$auth" http://127.0.0.1:3011/v1/company/datafile \
            | jq -e --arg s "$(jq -r .scenario "$a")" 'any(.scenarios[]; .code == $s)'
          curl -fsS -H "$auth" "http://127.0.0.1:3011/v1/runs/$(jq -r .run_id "$a")" | jq -e '.status == "COMPLETED"'
          pkill -f 'port-forward service/oscar 3011:3001' || true

      - name: The OpenShift overlay renders
        # kind has no Route type to check it against; its content is pinned by
        # Oscar_Server/tests/unit/kubernetes-manifests.test.js.
        run: |
          kubectl kustomize OSCAR_Deploy/kubernetes/overlays/openshift > "$RUNNER_TEMP/openshift.yaml"
          grep -q '^kind: Route$' "$RUNNER_TEMP/openshift.yaml"

      # ── Pod mode (run isolation option 4, #1130): each run in a pod of its own ──
      - name: Pod mode, deployed (ci/pod-runs, ci/pod-mode)
        run: |
          kind load docker-image local/oscar-run:ci --name oscar
          # A fresh OSCAR namespace: ci/smoke.sh makes the first administrator.
          pkill -f 'port-forward service/oscar 3001:3001' || true
          kubectl delete namespace oscar --wait=true --timeout=300s
          kubectl apply -k OSCAR_Deploy/kubernetes/ci/pod-runs
          kubectl create namespace oscar
          kubectl label namespace oscar pod-security.kubernetes.io/enforce=restricted
          boot=$(openssl rand -hex 24)
          metrics=$(openssl rand -hex 32)
          echo "::add-mask::$boot"
          echo "::add-mask::$metrics"
          echo "BOOTSTRAP_TOKEN=$boot" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$metrics" >> "$GITHUB_ENV"
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nPLATFORM_BOOTSTRAP_TOKEN=%s\nMETRICS_TOKEN=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 64)" "$boot" "$metrics" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar apply -k OSCAR_Deploy/kubernetes/ci/pod-mode
          kubectl -n oscar rollout status deployment/oscar-dispatcher --timeout=300s
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar get deployment oscar -o jsonpath='{.spec.template.spec.containers[*].name}')" = oscar
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- printenv RUN_ISOLATION)" = pod

      - name: Pod mode, who may do what
        run: |
          can() { kubectl auth can-i "$@" 2> /dev/null || true; }
          d=system:serviceaccount:oscar:oscar-dispatcher
          # Only the dispatcher makes run pods, and only in the runs' namespace.
          test "$(can create jobs -n oscar-runs --as=$d)" = yes
          test "$(can create jobs -n oscar --as=$d)" = no
          test "$(can get secrets -n oscar --as=$d)" = no
          test "$(can get secrets -n oscar-runs --as=$d)" = no
          test "$(can create jobs -n oscar-runs --as=system:serviceaccount:oscar:default)" = no
          test "$(can list pods -n oscar-runs --as=system:serviceaccount:oscar-runs:oscar-run)" = no
          # The dispatcher holds none of the server's secrets.
          for k in ENCRYPTION_KEY JWT_SECRET PLATFORM_BOOTSTRAP_TOKEN METRICS_TOKEN SMTP_PASS; do
            if kubectl -n oscar exec deploy/oscar-dispatcher -- printenv "$k" > /dev/null; then echo "the dispatcher holds $k"; exit 1; fi
          done

      - name: Pod mode, a scenario in a pod of its own (ci/smoke.sh)
        run: |
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward-pod.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 OSCAR_Deploy/kubernetes/ci/smoke.sh
          kubectl -n oscar logs deploy/oscar-dispatcher | grep -q 'started oscar-run-'
          # The run's Job, pod and Secret are removed once it has ended.
          left=1
          for _ in $(seq 1 30); do
            left=$(kubectl -n oscar-runs get jobs,pods,secrets -l app.kubernetes.io/managed-by=oscar-dispatcher -o name | wc -l)
            if [ "$left" = 0 ]; then break; fi
            sleep 2
          done
          test "$left" = 0

      - name: Pod mode, what a run pod may reach
        run: |
          p=OSCAR_Deploy/kubernetes/ci/probe-run-network.sh
          # OSCAR's internal port, nothing else of OSCAR's.
          test "$($p probe-internal oscar-internal.oscar.svc.cluster.local 3003)" = open
          test "$($p probe-public oscar.oscar.svc.cluster.local 3001)" = closed
          test "$($p probe-dispatcher oscar-dispatcher.oscar.svc.cluster.local 3002)" = closed

      - name: What the cluster shows (on failure)
        if: failure()
        run: |
          echo "=== oscar-runs"
          kubectl -n oscar-runs get all,secrets,networkpolicy,resourcequota,events 2>&1 | tail -n 60 || true
          kubectl -n oscar logs deploy/oscar-dispatcher --tail=200 2>&1 || true
          for ns in oscar oscar-k8s; do
            echo "=== $ns"
            kubectl -n "$ns" get all,pvc,configmap,events 2>&1 | tail -n 60 || true
            kubectl -n "$ns" describe pod -l app.kubernetes.io/name=oscar 2>&1 | tail -n 60 || true
            kubectl -n "$ns" logs deploy/oscar -c oscar --tail=200 2>&1 || true
            kubectl -n "$ns" logs deploy/oscar -c runner --tail=100 2>&1 || true
          done
          echo "=== simulator"
          tail -n 100 "$RUNNER_TEMP/simulator.log" || true

  # ── k3s on one machine (guide: "OSCAR - k3s on one VPS") ──────────────────
  # The guide's own files on a real k3s, installed on the runner as the guide
  # installs it: k3s/config.yaml and k3s/traefik-config.yaml in place first,
  # the pinned k3s, the runs' namespace, overlays/k3s (pod mode behind
  # Traefik) through ci/k3s. Then a scenario on the simulator, what Traefik
  # does (http sent to https, the 50 MB limit, the client's own address
  # reaching OSCAR) and what a run pod may reach under k3s's own NetworkPolicy
  # enforcement. Let's Encrypt is left out: the runner has no public name.
  k3s:
    name: k3s on one machine
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build the images (build-images.sh)
        run: OSCAR_Deploy/kubernetes/build-images.sh local ci

      - name: Start the OSDM simulator on the runner
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "SIM_SECRET=$secret" >> "$GITHUB_ENV"
          jq -n --arg s "$secret" '{gamma: [{client_id: "gamma.tstmgr01", client_secret: $s}]}' > "$RUNNER_TEMP/clients.json"
          SIM_HOST=0.0.0.0 SIM_PORT=3002 SIM_CLIENTS_FILE="$RUNNER_TEMP/clients.json" \
            nohup node OSDM_Simulator/server.js > "$RUNNER_TEMP/simulator.log" 2>&1 &
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3002/healthz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/simulator.log"
          exit 1

      - name: Install k3s as the guide does
        run: |
          set -euo pipefail
          # The runner's address: where the simulator answers and Traefik listens.
          node_ip=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')
          test -n "$node_ip"
          echo "NODE_IP=$node_ip" >> "$GITHUB_ENV"
          sudo mkdir -p /etc/rancher/k3s /var/lib/rancher/k3s/server/manifests
          sudo cp OSCAR_Deploy/kubernetes/k3s/config.yaml /etc/rancher/k3s/config.yaml
          sudo cp OSCAR_Deploy/kubernetes/k3s/traefik-config.yaml /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="$K3S_VERSION" sh -
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown "$(id -u):$(id -g)" ~/.kube/config
          kubectl wait node --all --for=condition=Ready --timeout=180s
          docker save local/oscar:ci local/oscar-run:ci | sudo k3s ctr images import -
          # k3s installs its Traefik itself (a Helm job), with our values.
          for _ in $(seq 1 90); do
            if kubectl -n kube-system get deployment traefik > /dev/null 2>&1; then break; fi
            sleep 2
          done
          kubectl -n kube-system rollout status deployment/traefik --timeout=300s
          test "$(kubectl -n kube-system get service traefik -o jsonpath='{.spec.externalTrafficPolicy}')" = Local
          kubectl wait --for condition=established crd/middlewares.traefik.io --timeout=120s
          # Secrets are encrypted in k3s's datastore (k3s/config.yaml).
          sudo k3s secrets-encrypt status | tee "$RUNNER_TEMP/encryption.txt"
          grep -q 'Encryption Status: Enabled' "$RUNNER_TEMP/encryption.txt"

      - name: The runs' namespace, and the simulator for the run pods
        run: |
          set -euo pipefail
          kubectl apply -k OSCAR_Deploy/kubernetes/runs
          # CI only: run pods may reach the simulator on the runner's private
          # address. A policy of its own (policies add up), as ci/pod-runs
          # does for kind.
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: ci-simulator
            namespace: oscar-runs
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: oscar-run
            policyTypes: [Egress]
            egress:
              - to:
                  - ipBlock:
                      cidr: ${NODE_IP}/32
                ports:
                  - { protocol: TCP, port: 3002 }
          EOF

      - name: Deploy the k3s overlay (ci/k3s)
        run: |
          set -euo pipefail
          kubectl create namespace oscar
          kubectl label namespace oscar pod-security.kubernetes.io/enforce=restricted
          boot=$(openssl rand -hex 24)
          metrics=$(openssl rand -hex 32)
          echo "::add-mask::$boot"
          echo "::add-mask::$metrics"
          echo "BOOTSTRAP_TOKEN=$boot" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$metrics" >> "$GITHUB_ENV"
          printf 'ENCRYPTION_KEY=%s\nJWT_SECRET=%s\nPLATFORM_BOOTSTRAP_TOKEN=%s\nMETRICS_TOKEN=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 64)" "$boot" "$metrics" > "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-secrets --from-env-file="$RUNNER_TEMP/secrets.env"
          rm "$RUNNER_TEMP/secrets.env"
          kubectl -n oscar create secret generic oscar-runner --from-literal=RUN_AGENT_TOKEN="$(openssl rand -hex 32)"
          kubectl -n oscar apply -k OSCAR_Deploy/kubernetes/ci/k3s
          kubectl -n oscar rollout status deployment/oscar-dispatcher --timeout=300s
          kubectl -n oscar rollout status deployment/oscar --timeout=300s
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- printenv RUN_ISOLATION)" = pod
          test "$(kubectl -n oscar exec deploy/oscar -c oscar -- id -u)" = 1000

      - name: A scenario in a pod of its own (ci/smoke.sh)
        run: |
          kubectl -n oscar port-forward service/oscar 3001:3001 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          OSCAR_URL=http://127.0.0.1:3001 SIM_BASE="http://$NODE_IP:3002" \
            SMOKE_ACCOUNT_FILE="$RUNNER_TEMP/smoke-account.json" OSCAR_Deploy/kubernetes/ci/smoke.sh
          kubectl -n oscar logs deploy/oscar-dispatcher | grep -q 'started oscar-run-'

      - name: Traefik as the guide sets it
        run: |
          set -euo pipefail
          host=oscar.example.org
          # http is sent to https.
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --resolve "$host:80:$NODE_IP" "http://$host/health")
          echo "http: $out"
          [[ "$out" =~ ^30[18]\ https://oscar\.example\.org(:443)?/health$ ]]
          # https reaches OSCAR (Traefik's own certificate: no Let's Encrypt here).
          curl -fsSk --resolve "$host:443:$NODE_IP" "https://$host/health" | jq -e '.status == "ok"'
          # The VPS's nginx limit: 50 MB of body, then 413 from Traefik.
          head -c 52428801 /dev/zero > "$RUNNER_TEMP/big"
          code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$host:443:$NODE_IP" -X POST \
            -H 'Content-Type: application/octet-stream' --data-binary "@$RUNNER_TEMP/big" "https://$host/v1/auth/login")
          rm "$RUNNER_TEMP/big"
          echo "51 MB body: $code"
          test "$code" = 413
          # The client's own address reaches OSCAR: a sign-in through Traefik
          # is recorded under the runner's address, not a cluster address.
          jq '{email: .tm_email, password: .tm_password}' "$RUNNER_TEMP/smoke-account.json" > "$RUNNER_TEMP/login.json"
          curl -fsSk -o /dev/null --resolve "$host:443:$NODE_IP" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/login.json" "https://$host/v1/auth/login"
          rm "$RUNNER_TEMP/login.json"
          seen=$(kubectl -n oscar exec deploy/oscar -c oscar -- node -e '
            const { DatabaseSync } = require("node:sqlite");
            const db = new DatabaseSync(process.env.OSCAR_DB_PATH || "/app/data/oscar.db");
            const row = db.prepare("SELECT ip FROM auth_events WHERE event_type = ? ORDER BY id DESC LIMIT 1").get("login_success");
            process.stdout.write(row ? String(row.ip) : "");' 2>/dev/null)
          echo "OSCAR recorded the sign-in from $seen; the runner is $NODE_IP"
          test "$seen" = "$NODE_IP" || test "$seen" = "::ffff:$NODE_IP"

      - name: What a run pod may reach (k3s enforces NetworkPolicy)
        run: |
          p=OSCAR_Deploy/kubernetes/ci/probe-run-network.sh
          test "$($p probe-internal oscar-internal.oscar.svc.cluster.local 3003)" = open
          test "$($p probe-public oscar.oscar.svc.cluster.local 3001)" = closed
          test "$($p probe-dispatcher oscar-dispatcher.oscar.svc.cluster.local 3002)" = closed

      - name: What the cluster shows (on failure)
        if: failure()
        run: |
          kubectl get pods -A -o wide 2>&1 | tail -n 40 || true
          kubectl -n kube-system logs deployment/traefik --tail=100 2>&1 || true
          kubectl -n kube-system get helmcharts,helmchartconfigs,jobs 2>&1 || true
          echo "=== oscar-runs"
          kubectl -n oscar-runs get all,networkpolicy,events 2>&1 | tail -n 60 || true
          echo "=== oscar"
          kubectl -n oscar get all,pvc,ingress,events 2>&1 | tail -n 60 || true
          kubectl -n oscar logs deploy/oscar -c oscar --tail=200 2>&1 || true
          kubectl -n oscar logs deploy/oscar-dispatcher --tail=100 2>&1 || true
          echo "=== k3s"
          sudo journalctl -u k3s --no-pager 2>&1 | tail -n 80 || true
          echo "=== simulator"
          tail -n 100 "$RUNNER_TEMP/simulator.log" || true
