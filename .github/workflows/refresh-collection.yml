name: Refresh · Bruno collection on production VPS

# Moves the production VPS checkout (the bind-mounted Bruno collection and
# compatibility.json) to the newest release tag on main, by hand only.
#
# A merge to main no longer reaches production by itself: the collection runs
# inside the server's container, so only a release does. promote-release.yml
# moves the checkout at every release; this workflow is the manual way to do
# it again (say the VPS was down). The remote side is refresh-collection.sh,
# which takes the newest release-* tag on main, never main's head.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    name: Move the VPS checkout to the latest release
    runs-on: ubuntu-latest
    # The deploy key lives in the "production" environment only.
    environment: production
    permissions:
      contents: read

    steps:
      - name: Set up SSH
        env:
          KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger collection refresh on VPS
        # The locked-down authorized_keys entry on the VPS forces the
        # installed copy of refresh-collection.sh, whatever is sent here. See
        # Documentation/Server_Operations/auto-deploy-setup.md, step 4.
        run: ssh -o StrictHostKeyChecking=yes ubuntu@oscar.uic.org "/usr/local/sbin/oscar-refresh-collection"

      - name: Summary
        run: echo "Moved the VPS checkout to the latest release tag on main." >> "$GITHUB_STEP_SUMMARY"
