name: CI · Server

# Runs only when server code, deploy config, or this workflow itself changes.
# Doc-only or collection-only PRs skip this entire pipeline.
on:
  push:
    branches: [main]
    paths:
      - 'Oscar_Server/**'
      - 'OSCAR_Deploy/**'
      - 'compatibility.json'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Oscar_Server/**'
      - 'OSCAR_Deploy/**'
      - 'compatibility.json'
      - '.github/workflows/ci-server.yml'
  workflow_dispatch:

# Force JS-based actions onto Node 24 ahead of GitHub's June 2026 deadline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-test:
    name: Lint, audit, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Oscar_Server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Oscar_Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit (high+ severity only)
        # `audit-level=high` keeps the build from failing on transitive
        # low/moderate issues. Tighten later as we resolve known noise.
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        # Thresholds set just below current actual values so CI does not
        # ratchet down by accident. Raise in 5pp steps as new tests land.
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":50,"branches":42}}'
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./Oscar_Server
          push: false
          tags: oscar-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./Oscar_Server
          push: false
          load: true
          tags: oscar-server:trivy-${{ github.sha }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: oscar-server:trivy-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
