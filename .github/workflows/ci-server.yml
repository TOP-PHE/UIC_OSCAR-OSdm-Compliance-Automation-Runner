name: CI · Server

# On push to main: only run when server code, deploy config, or this
# workflow itself changes — saves CI minutes on doc/collection-only commits.
# On pull_request: always run, because these jobs (Lint+test, Docker build,
# Trivy) are *required* status checks in branch protection. Path-filtered
# required checks never report a status when paths don't match, blocking
# PR merges indefinitely.
on:
  push:
    branches: [main]
    paths:
      - 'Oscar_Server/**'
      - 'OSCAR_Deploy/**'
      - 'compatibility.json'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Force JS-based actions onto Node 24 ahead of GitHub's June 2026 deadline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-test:
    name: Lint, audit, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Oscar_Server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Oscar_Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit (high+ severity only)
        # `audit-level=high` keeps the build from failing on transitive
        # low/moderate issues. Tighten later as we resolve known noise.
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        # Thresholds set just below current actual values so CI does not
        # ratchet down by accident. Raise in 5pp steps as new tests land.
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":50,"branches":42}}'
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./Oscar_Server
          push: false
          tags: oscar-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./Oscar_Server
          push: false
          load: true
          tags: oscar-server:trivy-${{ github.sha }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oscar-server:trivy-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
