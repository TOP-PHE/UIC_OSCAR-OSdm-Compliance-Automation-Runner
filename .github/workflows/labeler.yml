name: PR labeler

# Auto-applies labels to PRs based on the file paths they touch. Rules
# live in .github/labeler.yml — keep that file as the single source of
# truth for path-to-label mapping.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Don't remove labels a human added on top — only manage the ones
          # produced by path matches.
          sync-labels: false
