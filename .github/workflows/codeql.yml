name: CodeQL

# GitHub-native static analysis (SAST). Catches a broader class of issues
# than ESLint or Sonar — injection sinks, prototype pollution, regex DoS,
# unsafe deserialisation, hardcoded credentials, etc. Findings appear in
# the Security tab and (for PRs) inline as PR review comments.
on:
  push:
    branches: [main]
    paths:
      - 'Oscar_Server/**'
      - '.github/workflows/codeql.yml'
  # No paths: filter on pull_request — CodeQL is a required check in branch
  # protection, and path-filtered required checks never report a status when
  # paths don't match, blocking PR merges indefinitely.
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 05:00 UTC scan even without commits — catches CVEs in
    # the underlying CodeQL ruleset that get published after our merge.
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read           # read workflow status for the build matrix
      contents: read
      security-events: write  # required to upload SARIF results to the Security tab

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # security-and-quality includes both security queries and code-quality
          # checks. If you want only security findings (faster, fewer noise),
          # change to `security-extended`.
          queries: security-and-quality
          # Path rules (e.g. excluding Oscar_Server/public/vendor/**).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
