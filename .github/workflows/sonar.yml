name: SonarCloud

# Runs on every push to main and on every PR targeting main, scoped to
# server-relevant files.
#
# Two-step job: "SonarCloud Scan" uploads the analysis (it exits 0 once the
# upload succeeds — it does NOT know or care whether the Quality Gate passed);
# "SonarQube Quality Gate check" then polls SonarCloud for the actual verdict
# and is what turns this from "the scanner ran" into "the code meets the bar"
# (issue #452 — the job used to have only the scan step, so the required check
# was always green regardless of gate status). The gate-check step is
# deliberately NOT (yet) in branch protection's
# required-checks list — main's gate was red (pre-existing accessibility +
# duplication issues) when this was added, and making it required immediately
# would have blocked every PR, unrelated ones included. Once those are cleared
# and this step is green on main, add "SonarQube Quality Gate check" to
# required checks (repo Settings → Branches → main) to make it actually block.
on:
  push:
    branches: [main]
    paths:
      - 'Oscar_Server/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonar.yml'
  # No paths: filter on pull_request — Sonar is a required check in branch
  # protection, and path-filtered required checks never report a status when
  # paths don't match, blocking PR merges indefinitely.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sonar:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v7
        with:
          # Sonar needs the full Git history to attribute issues to commits
          # for the "new code" period. Shallow clones produce blank blame.
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Oscar_Server/package-lock.json

      # ── Skip the analysis on Dependabot PRs (skip-with-success) ───────────
      # GitHub does not pass Actions secrets (incl. SONAR_TOKEN) to
      # Dependabot-triggered runs, so the scan can't authenticate and the
      # required check would fail forever, blocking every bot PR. We guard the
      # work STEPS (not the job) with `github.actor != 'dependabot[bot]'`: on a
      # bot PR the steps are skipped and the job still completes GREEN, so the
      # required "SonarCloud Code Analysis" check is satisfied and the PR can
      # merge. (A job-level `if:` would leave the required check pending forever.)
      # No coverage is lost: a Dependabot PR only changes package.json /
      # package-lock.json — Sonar has no new source code to analyse — and the
      # bump is fully analysed when it lands on main (push: [main] above).
      # Dependency security/quality on the PR is still covered by npm audit,
      # Trivy and CodeQL, which run without the Sonar token.
      - name: Install dependencies
        if: ${{ github.actor != 'dependabot[bot]' }}
        working-directory: Oscar_Server
        run: npm ci

      - name: Run tests with coverage
        # Sonar reads Oscar_Server/coverage/lcov.info to populate the
        # Coverage on New Code metric. The thresholds here mirror ci-server.yml
        # so a Sonar gate failure means the same regression as a CI failure.
        if: ${{ github.actor != 'dependabot[bot]' }}
        working-directory: Oscar_Server
        run: npx jest --coverage
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}

      - name: SonarCloud Scan
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          # Provided automatically by GitHub for PR decoration (commit
          # statuses, PR comments). Read-only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository secret. Generate at https://sonarcloud.io/account/security
          # and store under repo settings → secrets and variables → actions.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Polls SonarCloud for the Quality Gate verdict of the analysis just
      # uploaded above and fails THIS step (not the job — see the file header)
      # when it's red. Reads report-task.txt left on disk by the scan step, so
      # it must run in the same job right after it. Same Dependabot guard as
      # the scan step — nothing was analyzed for a bot PR, so there is no gate
      # to poll. pollingTimeoutSec caps how long (and how many Action minutes)
      # a slow SonarCloud gate computation can burn before we give up.
      - name: SonarQube Quality Gate check
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
